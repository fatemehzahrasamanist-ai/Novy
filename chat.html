<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نووی | همراه دانش‌آموزان</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background: var(--bg);
    color: var(--text);

    transition:
        background 0.25s ease,
        color 0.25s ease;
}

button,
input,
textarea {
    font-family: inherit;
}


/* =========================================================
   DEFAULT VARIABLES
========================================================= */

:root {

    --bg: #061426;
    --section: #081b30;
    --card: #0b233d;
    --chat: #0a2038;
    --message: #102e4a;

    --text: #f4fbff;
    --soft: #a8c7d9;
    --muted: #91b0c2;

    --accent: #8ee7ff;

    --border: #1d405d;
    --border-soft: #163452;

    --danger: #ff7185;
}


/* =========================================================
   NAVY THEME
========================================================= */

body.theme-navy {

    --bg: #061426;
    --section: #081b30;
    --card: #0b233d;
    --chat: #0a2038;
    --message: #102e4a;

    --text: #f4fbff;
    --soft: #a8c7d9;
    --muted: #91b0c2;

    --accent: #8ee7ff;

    --border: #1d405d;
    --border-soft: #163452;
}


/* =========================================================
   BLACK THEME
========================================================= */

body.theme-black {

    --bg: #050505;
    --section: #0b0b0b;
    --card: #111111;
    --chat: #090909;
    --message: #181818;

    --text: #f5f5f5;
    --soft: #c0c0c0;
    --muted: #929292;

    --accent: #ffffff;

    --border: #292929;
    --border-soft: #202020;
}


/* =========================================================
   ICE THEME
========================================================= */

body.theme-ice {

    --bg: #dff6ff;
    --section: #c9effc;
    --card: #eafaff;
    --chat: #e5f8ff;
    --message: #cceffc;

    --text: #102a3a;
    --soft: #42677a;
    --muted: #648596;

    --accent: #008dcc;

    --border: #9ed8eb;
    --border-soft: #b9e5f2;
}


/* =========================================================
   APP
========================================================= */

.app {

    min-height: 100vh;

    display: flex;

    background: var(--bg);
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {

    width: 270px;

    flex-shrink: 0;

    background: var(--section);

    border-inline-end:
        1px solid var(--border);

    padding: 18px 14px;

    display: flex;

    flex-direction: column;

    gap: 12px;

    transition:
        width 0.25s ease,
        transform 0.25s ease,
        background 0.25s ease;

    z-index: 1000;
}


.sidebar.collapsed {

    width: 76px;
}


.sidebar.collapsed .logo-text,
.sidebar.collapsed .tool-text,
.sidebar.collapsed .recent-title,
.sidebar.collapsed .recent-item,
.sidebar.collapsed .profile-info {

    display: none;
}


.sidebar.collapsed .logo {

    justify-content: center;
}


.sidebar.collapsed .tool {

    justify-content: center;
}


.sidebar.collapsed .profile {

    justify-content: center;
}


/* =========================================================
   LOGO
========================================================= */

.logo {

    display: flex;

    align-items: center;

    gap: 10px;

    padding:
        8px 10px 18px;
}


.logo-icon {

    width: 40px;
    height: 40px;

    border-radius: 13px;

    display: flex;

    align-items: center;
    justify-content: center;

    background: var(--card);

    border:
        1px solid var(--border);

    font-size: 21px;

    flex-shrink: 0;
}


.logo-text {

    font-weight: 800;

    font-size: 18px;

    white-space: nowrap;
}


.logo-text small {

    display: block;

    color: var(--muted);

    font-size: 10px;

    font-weight: 400;

    margin-top: 3px;
}


/* =========================================================
   SIDEBAR TOOLS
========================================================= */

.tools {

    display: flex;

    flex-direction: column;

    gap: 5px;
}


.tool {

    border: 0;

    background: transparent;

    color: var(--soft);

    min-height: 45px;

    border-radius: 12px;

    padding:
        9px 11px;

    display: flex;

    align-items: center;

    gap: 12px;

    cursor: pointer;

    text-align: start;

    transition:
        background 0.18s ease,
        color 0.18s ease;
}


.tool:hover {

    background: var(--card);

    color: var(--text);
}


.tool.active {

    background: var(--card);

    color: var(--accent);
}


.tool-icon {

    width: 24px;

    text-align: center;

    font-size: 18px;

    flex-shrink: 0;
}


.tool-text {

    font-size: 14px;

    white-space: nowrap;
}


/* =========================================================
   RECENT CHATS
========================================================= */

.recent {

    display: none;

    margin-top: 8px;

    padding-top: 12px;

    border-top:
        1px solid var(--border-soft);

    overflow: hidden;
}


.recent.has-items {

    display: block;
}


.recent-title {

    color: var(--muted);

    font-size: 11px;

    padding:
        4px 10px 8px;
}


.recent-item {

    border: 0;

    background: transparent;

    color: var(--soft);

    width: 100%;

    text-align: start;

    border-radius: 9px;

    padding:
        8px 10px;

    cursor: pointer;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.recent-item:hover {

    background: var(--card);

    color: var(--text);
}


/* =========================================================
   PROFILE
========================================================= */

.profile {

    margin-top: auto;

    border-top:
        1px solid var(--border-soft);

    padding-top: 13px;

    display: flex;

    align-items: center;

    gap: 10px;

    width: 100%;

    border-left: 0;
    border-right: 0;
    border-bottom: 0;

    background: transparent;

    color: var(--text);

    cursor: pointer;

    text-align: start;

    transition:
        background 0.18s ease,
        color 0.18s ease;
}


.profile:hover {

    background: var(--card);

    border-radius: 12px;
}


.profile-avatar {

    width: 38px;
    height: 38px;

    border-radius: 50%;

    background: var(--card);

    border:
        1px solid var(--border);

    display: flex;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;
}


.profile-name {

    font-size: 13px;

    font-weight: 700;
}


.profile-sub {

    color: var(--muted);

    font-size: 10px;

    margin-top: 2px;
}


/* =========================================================
   MAIN
========================================================= */

.main {

    flex: 1;

    min-width: 0;

    display: flex;

    flex-direction: column;

    min-height: 100vh;
}


/* =========================================================
   TOPBAR
========================================================= */

.topbar {

    height: 64px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    gap: 10px;

    padding:
        0 18px;

    border-bottom:
        1px solid var(--border);

    background: var(--section);
}


.icon-button {

    width: 40px;
    height: 40px;

    border-radius: 11px;

    border:
        1px solid var(--border);

    background: var(--card);

    color: var(--text);

    cursor: pointer;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 18px;
}


.icon-button:hover {

    border-color: var(--accent);

    color: var(--accent);
}


.chat-title {

    font-weight: 800;

    font-size: 15px;
}


.chat-status {

    color: var(--muted);

    font-size: 10px;

    margin-top: 3px;
}


/* =========================================================
   CHAT
========================================================= */

.chat {

    flex: 1;

    overflow-y: auto;

    padding:
        35px 18px 140px;

    background: var(--chat);
}


.chat-inner {

    width:
        min(850px, 100%);

    margin: auto;
}


.welcome {

    text-align: center;

    padding:
        65px 15px 35px;
}


.welcome-icon {

    width: 65px;
    height: 65px;

    margin:
        0 auto 17px;

    border-radius: 20px;

    background: var(--card);

    border:
        1px solid var(--border);

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 31px;
}


.welcome h1 {

    margin:
        0 0 9px;

    font-size: 27px;
}


.welcome p {

    margin: 0;

    color: var(--soft);

    font-size: 14px;
}


.messages {

    display: flex;

    flex-direction: column;

    gap: 15px;
}


.message {

    max-width: 80%;

    padding:
        12px 15px;

    border-radius: 16px;

    line-height: 1.8;

    font-size: 14px;

    white-space: pre-wrap;
}


.message.user {

    align-self: flex-start;

    background: var(--accent);

    color: #062033;

    border-bottom-left-radius: 5px;
}


.message.novy {

    align-self: flex-end;

    background: var(--message);

    border:
        1px solid var(--border-soft);

    border-bottom-right-radius: 5px;
}


/* =========================================================
   INPUT
========================================================= */

.input-area {

    position: fixed;

    inset-inline-start: 270px;

    inset-inline-end: 0;

    bottom: 0;

    padding:
        14px 18px 18px;

    background:
        linear-gradient(
            to top,
            var(--chat) 75%,
            transparent
        );

    transition:
        inset-inline-start 0.25s ease;

    z-index: 900;
}


.sidebar.collapsed ~ .main .input-area {

    inset-inline-start: 76px;
}


.input-inner {

    width:
        min(850px, 100%);

    margin: auto;
}


.input-box {

    display: flex;

    align-items: flex-end;

    gap: 8px;

    background: var(--card);

    border:
        1px solid var(--border);

    border-radius: 17px;

    padding: 8px;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.15);
}


.input-box textarea {

    flex: 1;

    min-height: 42px;

    max-height: 130px;

    resize: none;

    border: 0;

    outline: none;

    background: transparent;

    color: var(--text);

    padding:
        10px 8px;

    font-size: 14px;
}


.input-box textarea::placeholder {

    color: var(--muted);
}


.send-button {

    width: 42px;
    height: 42px;

    flex-shrink: 0;

    border: 0;

    border-radius: 12px;

    background: var(--accent);

    color: #062033;

    cursor: pointer;

    font-size: 18px;

    font-weight: 800;
}


.send-button:hover {

    filter: brightness(1.08);
}


.note {

    color: var(--muted);

    font-size: 9px;

    text-align: center;

    margin-top: 7px;
}


/* =========================================================
   SETTINGS OVERLAY
========================================================= */

.overlay {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,0.48);

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity 0.2s ease,
        visibility 0.2s ease;

    z-index: 1500;
}


.overlay.show {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}


/* =========================================================
   SETTINGS PANEL
========================================================= */

.settings-panel {

    position: fixed;

    top: 0;

    right: 0;

    width:
        min(390px, 92vw);

    height: 100vh;

    background: var(--section);

    border-left:
        1px solid var(--border);

    transform:
        translateX(105%);

    transition:
        transform 0.25s ease,
        background 0.25s ease;

    z-index: 1600;

    overflow-y: auto;

    padding: 22px;
}


/* RTL */

html[dir="rtl"] .settings-panel {

    right: auto;

    left: 0;

    border-left: 0;

    border-right:
        1px solid var(--border);

    transform:
        translateX(-105%);
}


/* OPEN */

.settings-panel.open {

    transform:
        translateX(0);
}


/* =========================================================
   PROFILE PANEL
========================================================= */

.profile-panel {

    position: fixed;

    top: 0;

    right: 0;

    width:
        min(390px, 92vw);

    height: 100vh;

    background: var(--section);

    border-left:
        1px solid var(--border);

    transform:
        translateX(105%);

    transition:
        transform 0.25s ease,
        background 0.25s ease;

    z-index: 1600;

    overflow-y: auto;

    padding: 22px;
}


html[dir="rtl"] .profile-panel {

    right: auto;

    left: 0;

    border-left: 0;

    border-right:
        1px solid var(--border);

    transform:
        translateX(-105%);
}


.profile-panel.open {

    transform:
        translateX(0);
}


.profile-panel-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 28px;
}


.profile-panel-header h2 {

    margin: 0;

    font-size: 19px;
}


.profile-card {

    background: var(--card);

    border:
        1px solid var(--border);

    border-radius: 17px;

    padding: 20px;

    text-align: center;
}


.profile-big-avatar {

    width: 75px;
    height: 75px;

    margin:
        0 auto 14px;

    border-radius: 50%;

    background: var(--section);

    border:
        1px solid var(--border);

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 32px;
}


.profile-card-name {

    font-size: 18px;

    font-weight: 800;

    margin-bottom: 6px;
}


.profile-card-username {

    color: var(--muted);

    font-size: 12px;
}


.profile-card-email {

    color: var(--soft);

    font-size: 12px;

    margin-top: 10px;

    direction: ltr;
}


/* =========================================================
   SETTINGS HEADER
========================================================= */

.settings-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 25px;
}


.settings-header h2 {

    margin: 0;

    font-size: 19px;
}


/* =========================================================
   SETTINGS SECTION
========================================================= */

.settings-section {

    margin-bottom: 28px;
}


.settings-section h3 {

    margin:
        0 0 12px;

    font-size: 13px;

    color: var(--soft);
}


/* =========================================================
   THEMES
========================================================= */

.theme-grid {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 9px;
}


.theme-option {

    border:
        1px solid var(--border);

    background: var(--card);

    color: var(--text);

    border-radius: 13px;

    padding:
        13px 10px;

    cursor: pointer;

    text-align: center;

    transition:
        border-color 0.18s ease,
        box-shadow 0.18s ease;
}


.theme-option:hover {

    border-color:
        var(--accent);
}


.theme-option.active {

    border-color:
        var(--accent);

    box-shadow:
        0 0 0 1px var(--accent);
}


.theme-preview {

    height: 45px;

    border-radius: 9px;

    margin-bottom: 9px;

    border:
        1px solid rgba(255,255,255,0.12);
}


.preview-navy {

    background:
        linear-gradient(
            135deg,
            #061426,
            #102e4a
        );
}


.preview-black {

    background:
        linear-gradient(
            135deg,
            #050505,
            #202020
        );
}


.preview-ice {

    background:
        linear-gradient(
            135deg,
            #dff6ff,
            #83cfe8
        );
}


.preview-custom {

    background:
        linear-gradient(
            135deg,
            #100b20,
            #c995ff
        );
}


/* =========================================================
   CUSTOMIZER
========================================================= */

.customizer {

    display: none;

    margin-top: 14px;

    padding: 14px;

    background: var(--card);

    border:
        1px solid var(--border);

    border-radius: 15px;
}


.customizer.show {

    display: block;
}


.customizer-title {

    font-size: 12px;

    color: var(--soft);

    margin-bottom: 13px;
}


.color-row {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 12px;

    margin-bottom: 11px;
}


.color-row:last-child {

    margin-bottom: 0;
}


.color-row label {

    font-size: 12px;

    color: var(--text);
}


.color-picker {

    width: 45px;

    height: 32px;

    padding: 0;

    border:
        1px solid var(--border);

    border-radius: 8px;

    background: transparent;

    cursor: pointer;
}


.custom-actions {

    display: flex;

    gap: 8px;

    margin-top: 14px;
}


.custom-action {

    flex: 1;

    min-height: 37px;

    border-radius: 9px;

    border:
        1px solid var(--border);

    background: var(--section);

    color: var(--text);

    cursor: pointer;

    font-size: 11px;
}


.custom-action:hover {

    border-color:
        var(--accent);
}


.custom-action.primary {

    background:
        var(--accent);

    color: #062033;

    border-color:
        var(--accent);
}


/* =========================================================
   LANGUAGE
========================================================= */

.language-grid {

    display: grid;

    gap: 8px;
}


.language-option {

    border:
        1px solid var(--border);

    background: var(--card);

    color: var(--text);

    border-radius: 13px;

    padding: 12px;

    cursor: pointer;

    text-align: start;

    display: flex;

    align-items: center;

    gap: 10px;
}


.language-option:hover {

    border-color:
        var(--accent);
}


.language-option.active {

    border-color:
        var(--accent);

    box-shadow:
        0 0 0 1px var(--accent);
}


/* =========================================================
   MOBILE OVERLAY
========================================================= */

.mobile-overlay {

    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,0.45);

    z-index: 950;
}


.mobile-overlay.show {

    display: block;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 760px) {

    .sidebar {

        position: fixed;

        top: 0;
        bottom: 0;

        left: 0;

        width: 270px;

        transform:
            translateX(-105%);
    }


    html[dir="rtl"] .sidebar {

        left: auto;

        right: 0;

        transform:
            translateX(105%);
    }


    .sidebar.mobile-open {

        transform:
            translateX(0);
    }


    .sidebar.collapsed {

        width: 270px;
    }


    .sidebar.collapsed .logo-text,
    .sidebar.collapsed .tool-text,
    .sidebar.collapsed .recent-title,
    .sidebar.collapsed .recent-item,
    .sidebar.collapsed .profile-info {

        display: block;
    }


    .sidebar.collapsed .logo {

        justify-content:
            flex-start;
    }


    .sidebar.collapsed .tool {

        justify-content:
            flex-start;
    }


    .sidebar.collapsed .profile {

        justify-content:
            flex-start;
    }


    .input-area {

        inset-inline-start: 0 !important;
    }


    .message {

        max-width: 90%;
    }


    .welcome {

        padding-top: 45px;
    }


    .welcome h1 {

        font-size: 23px;
    }


    .chat {

        padding-inline: 12px;
    }


    .settings-panel {

        width:
            min(390px, 94vw);
    }


    .profile-panel {

        width:
            min(390px, 94vw);
    }

}

</style>
</head>


<body class="theme-navy">


<div class="app">


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="logo">

            <div class="logo-icon">
                🤖
            </div>

            <div class="logo-text">

                نووی

                <small>
                    همراه دانش‌آموزان
                </small>

            </div>

        </div>


        <div class="tools">


            <button
                class="tool active"
                id="newChatBtn"
            >

                <span class="tool-icon">
                    ＋
                </span>

                <span
                    class="tool-text"
                    data-i18n="newChat"
                >
                    گفت‌وگوی جدید
                </span>

            </button>


            <button
                class="tool"
                data-tool="images"
            >

                <span class="tool-icon">
                    🖼️
                </span>

                <span
                    class="tool-text"
                    data-i18n="images"
                >
                    تصاویر
                </span>

            </button>


            <button
                class="tool"
                data-tool="library"
            >

                <span class="tool-icon">
                    📚
                </span>

                <span
                    class="tool-text"
                    data-i18n="library"
                >
                    کتابخانه
                </span>

            </button>


            <button
                class="tool"
                data-tool="projects"
            >

                <span class="tool-icon">
                    📁
                </span>

                <span
                    class="tool-text"
                    data-i18n="projects"
                >
                    پروژه‌ها
                </span>

            </button>


            <button
                class="tool"
                data-tool="code"
            >

                <span class="tool-icon">
                    💻
                </span>

                <span
                    class="tool-text"
                    data-i18n="code"
                >
                    کدنویسی
                </span>

            </button>


            <button
                class="tool"
                id="settingsBtn"
            >

                <span class="tool-icon">
                    ⚙️
                </span>

                <span
                    class="tool-text"
                    data-i18n="settings"
                >
                    تنظیمات
                </span>

            </button>


        </div>


        <!--
            این قسمت عمداً خالی است.
            وقتی واقعاً چتی ساخته شود،
            می‌توانیم آن را وارد تاریخچه کنیم.
        -->

        <div
            class="recent"
            id="recentChats"
        >

            <div
                class="recent-title"
                data-i18n="recent"
            >
                گفت‌وگوهای اخیر
            </div>

            <div id="recentList"></div>

        </div>


        <button
            class="profile"

/* =========================================================
   DEFAULT CUSTOM THEME
========================================================= */

const defaultCustom = {

    bg: "#061426",

    section: "#081b30",

    card: "#0b233d",

    message: "#102e4a",

    text: "#f4fbff",

    accent: "#8ee7ff"

};


/* =========================================================
   APPLY THEME
========================================================= */

function applyTheme(theme) {

    const validThemes = [
        "navy",
        "black",
        "ice",
        "custom"
    ];


    if (!validThemes.includes(theme)) {

        theme = "navy";

    }


    body.classList.remove(
        "theme-navy",
        "theme-black",
        "theme-ice"
    );


    body.style.removeProperty("--bg");
    body.style.removeProperty("--section");
    body.style.removeProperty("--card");
    body.style.removeProperty("--chat");
    body.style.removeProperty("--message");
    body.style.removeProperty("--text");
    body.style.removeProperty("--soft");
    body.style.removeProperty("--muted");
    body.style.removeProperty("--accent");
    body.style.removeProperty("--border");
    body.style.removeProperty("--border-soft");


    if (theme === "custom") {

        body.classList.add(
            "theme-navy"
        );


        let custom;

        try {

            custom =
                JSON.parse(
                    localStorage.getItem(
                        "novyCustomTheme"
                    )
                );

        } catch {

            custom = null;

        }


        if (!custom) {

            custom = {
                ...defaultCustom
            };

            localStorage.setItem(
                "novyCustomTheme",
                JSON.stringify(custom)
            );

        }


        body.style.setProperty(
            "--bg",
            custom.bg
        );

        body.style.setProperty(
            "--section",
            custom.section
        );

        body.style.setProperty(
            "--card",
            custom.card
        );

        body.style.setProperty(
            "--chat",
            custom.bg
        );

        body.style.setProperty(
            "--message",
            custom.message
        );

        body.style.setProperty(
            "--text",
            custom.text
        );

        body.style.setProperty(
            "--soft",
            custom.text
        );

        body.style.setProperty(
            "--muted",
            custom.text
        );

        body.style.setProperty(
            "--accent",
            custom.accent
        );

        body.style.setProperty(
            "--border",
            custom.accent
        );

        body.style.setProperty(
            "--border-soft",
            custom.section
        );


        customBg.value =
            custom.bg;

        customSection.value =
            custom.section;

        customCard.value =
            custom.card;

        customMessage.value =
            custom.message;

        customText.value =
            custom.text;

        customAccent.value =
            custom.accent;


        customizer.classList.add(
            "show"
        );

    }

    else {

        body.classList.add(
            "theme-" + theme
        );

        customizer.classList.remove(
            "show"
        );

    }


    localStorage.setItem(
        "novyTheme",
        theme
    );


    updateThemeButtons(
        theme
    );

}


/* =========================================================
   THEME BUTTON STATE
========================================================= */

function updateThemeButtons(theme) {

    document
        .querySelectorAll(
            ".theme-option"
        )
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.theme === theme
            );

        });

}


/* =========================================================
   SAVE CUSTOM THEME
========================================================= */

function saveCustomTheme() {

    const custom = {

        bg:
            customBg.value,

        section:
            customSection.value,

        card:
            customCard.value,

        message:
            customMessage.value,

        text:
            customText.value,

        accent:
            customAccent.value

    };


    localStorage.setItem(
        "novyCustomTheme",
        JSON.stringify(custom)
    );


    applyTheme(
        "custom"
    );

}


/* =========================================================
   RESET CUSTOM THEME
========================================================= */

function resetCustomTheme() {

    localStorage.setItem(
        "novyCustomTheme",
        JSON.stringify(
            defaultCustom
        )
    );


    customBg.value =
        defaultCustom.bg;

    customSection.value =
        defaultCustom.section;

    customCard.value =
        defaultCustom.card;

    customMessage.value =
        defaultCustom.message;

    customText.value =
        defaultCustom.text;

    customAccent.value =
        defaultCustom.accent;


    applyTheme(
        "custom"
    );

}


/* =========================================================
   LANGUAGE
========================================================= */

function applyLanguage(
    language
) {

    if (!translations[language]) {

        language = "fa";

    }


    const t =
        translations[language];


    document.documentElement.lang =
        language;


    document.documentElement.dir =
        language === "en"
            ? "ltr"
            : "rtl";


    document
        .querySelectorAll(
            "[data-i18n]"
        )
        .forEach(element => {

            const key =
                element.dataset.i18n;


            if (t[key]) {

                element.textContent =
                    t[key];

            }

        });


    document
        .querySelectorAll(
            "[data-i18n-placeholder]"
        )
        .forEach(element => {

            const key =
                element.dataset
                    .i18nPlaceholder;


            if (t[key]) {

                element.placeholder =
                    t[key];

            }

        });


    document
        .querySelectorAll(
            ".language-option"
        )
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.language === language
            );

        });


    localStorage.setItem(
        "novyLanguage",
        language
    );


    /*
       اگر تم سفارشی فعال باشد،
       بعد از تغییر زبان دوباره موقعیت پنل
       را درست نگه می‌داریم.
    */

    const currentTheme =
        localStorage.getItem(
            "novyTheme"
        ) || "navy";


    if (currentTheme === "custom") {

        applyTheme(
            "custom"
        );

    }

}


/* =========================================================

    if (settingsPanel) {

        settingsPanel.classList.remove(

    if (settingsOverlay) {

        settingsOverlay.classList.remove(
            "show"

    closeAllPanels();


    settingsPanel.classList.add(

    settingsOverlay.classList.add(

            );

            body.style.setProperty(
                "--card",
                custom.card
            );

            body.style.setProperty(
                "--chat",
                custom.bg
            );

            body.style.setProperty(
                "--message",
                custom.message
            );

            body.style.setProperty(
                "--text",
                custom.text
            );

            body.style.setProperty(
                "--soft",
                custom.text
            );

            body.style.setProperty(
                "--muted",
                custom.text
            );

            body.style.setProperty(
                "--accent",
                custom.accent
            );

            body.style.setProperty(
                "--border",
                custom.accent
            );

            body.style.setProperty(
                "--border-soft",
                custom.section
            );


            localStorage.setItem(
                "novyCustomTheme",
                JSON.stringify(custom)
            );

        }
    );

});


/* =========================================================
   LANGUAGE EVENTS
========================================================= */

document
    .querySelectorAll(
        ".language-option"
    )
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                applyLanguage(
                    button.dataset.language
                );

            }
        );

    });


/* =========================================================
   SIDEBAR / MOBILE
========================================================= */

menuBtn.addEventListener(
    "click",
    () => {

        if (
            window.innerWidth <= 760
        ) {

            sidebar.classList.toggle(
                "mobile-open"
            );

            mobileOverlay.classList.toggle(
                "show"
            );

        }

        else {

            sidebar.classList.toggle(
                "collapsed"
            );

        }

    }
);


mobileOverlay.addEventListener(
    "click",
    () => {

        sidebar.classList.remove(
            "mobile-open"
        );

        mobileOverlay.classList.remove(
            "show"
        );

    }
);


/* =========================================================
   SEND MESSAGE
========================================================= */

function sendMessage() {

    const text =
        messageInput.value.trim();


    if (!text) {

        return;

    }


    welcome.style.display =
        "none";


    const userMessage =
        document.createElement(
            "div"
        );


    userMessage.className =
        "message user";


    userMessage.textContent =
        text;


    messages.appendChild(
        userMessage
    );


    messageInput.value = "";


    messageInput.style.height =
        "42px";


    const language =
        localStorage.getItem(
            "novyLanguage"
        ) || "fa";


    setTimeout(
        () => {

            const botMessage =
                document.createElement(
                    "div"
                );


            botMessage.className =
                "message novy";


            botMessage.textContent =
                translations[
                    language
                ].fakeAnswer;


            messages.appendChild(
                botMessage
            );


            const chat =
                document.getElementById(
                    "chat"
                );


            chat.scrollTo({

                top:
                    chat.scrollHeight,

                behavior:
                    "smooth"

            });

        },

        500
    );

}


sendBtn.addEventListener(
    "click",
    sendMessage
);


/* =========================================================
   ENTER TO SEND
========================================================= */

messageInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   AUTO RESIZE
========================================================= */

messageInput.addEventListener(
    "input",
    () => {

        messageInput.style.height =
            "auto";


        messageInput.style.height =
            Math.min(
                messageInput.scrollHeight,
                130
            ) + "px";

    }
);


/* =========================================================
   NEW CHAT
========================================================= */

document
    .getElementById(
        "newChatBtn"
    )
    .addEventListener(
        "click",
        () => {

            messages.innerHTML =
                "";

            welcome.style.display =
                "";


            messageInput.value =
                "";


            messageInput.style.height =
                "42px";


            if (
                window.innerWidth <= 760
            ) {

                sidebar.classList.remove(
                    "mobile-open"
                );

                mobileOverlay.classList.remove(
                    "show"
                );

            }

        }
    );


/* =========================================================
   PLACEHOLDER TOOLS
========================================================= */

document
    .querySelectorAll(
        ".tool[data-tool]"
    )
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const language =
                    localStorage.getItem(
                        "novyLanguage"
                    ) || "fa";


                alert(
                    translations[
                        language
                    ].toolSoon
                );

            }
        );

    });


/* =========================================================
   INITIAL LOAD
========================================================= */

/*
   نکته مهم:
   تنظیمات و پروفایل هیچ‌وقت هنگام لود باز نمی‌شوند.
*/

closeAllPanels();


const savedTheme =
    localStorage.getItem(
        "novyTheme"
    ) || "navy";


const savedLanguage =
    localStorage.getItem(
        "novyLanguage"
    ) || "fa";


applyLanguage(
    savedLanguage
);


applyTheme(
    savedTheme
);


/*
   تاریخچه در شروع خالی است.
*/

recentList.innerHTML =
    "";

recentChats.classList.remove(
    "has-items"
);

</script>

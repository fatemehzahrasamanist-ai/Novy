<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVY | Chat</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* =========================================================
           NOVY CHAT
           Base UI
        ========================================================= */

        :root {
            --bg-main: #0b1020;
            --bg-sidebar: #080d1a;
            --bg-panel: #10182b;
            --bg-input: #121c32;
            --bg-message: #151f35;

            --border: #263451;

            --text-main: #f4f7ff;
            --text-muted: #9ba8c2;

            --accent: #8ee7ff;
            --accent-soft: rgba(142, 231, 255, 0.12);

            --danger: #ff6b7a;
            --success: #72e0a8;

            --shadow: 0 20px 60px rgba(0, 0, 0, 0.25);

            --sidebar-width: 270px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: var(--bg-main);
            color: var(--text-main);

            overflow: hidden;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            border: none;
        }

        /* =========================================================
           APP
        ========================================================= */

        .app {
            width: 100%;
            height: 100vh;
            display: flex;
            background: var(--bg-main);
        }

        /* =========================================================
           SIDEBAR
        ========================================================= */

        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;

            background: var(--bg-sidebar);
            border-left: 1px solid var(--border);

            display: flex;
            flex-direction: column;

            padding: 14px 12px;

            transition:
                width 0.25s ease,
                padding 0.25s ease;

            flex-shrink: 0;
            overflow: hidden;
        }

        body.ltr .sidebar {
            border-left: none;
            border-right: 1px solid var(--border);
        }

        .sidebar.collapsed {
            width: 74px;
            padding-left: 10px;
            padding-right: 10px;
        }

        .sidebar-top {
            display: flex;
            align-items: center;
            justify-content: space-between;

            min-height: 48px;
            margin-bottom: 12px;
        }

        .sidebar.collapsed .sidebar-top {
            justify-content: center;
        }

        .novy-brand {
            display: flex;
            align-items: center;
            gap: 10px;

            min-width: 0;
        }

        .novy-logo {
            width: 38px;
            height: 38px;

            border-radius: 12px;

            background: var(--accent-soft);
            border: 1px solid var(--border);

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--accent);
            font-size: 19px;
            font-weight: 900;

            flex-shrink: 0;
        }

        .brand-text {
            font-size: 15px;
            font-weight: 800;
            white-space: nowrap;
        }

        .sidebar-toggle {
            width: 36px;
            height: 36px;

            border-radius: 10px;

            background: transparent;
            color: var(--text-muted);

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: 0.2s ease;
        }

        .sidebar-toggle:hover {
            background: var(--bg-message);
            color: var(--accent);
        }

        .sidebar.collapsed .brand-text,
        .sidebar.collapsed .sidebar-toggle {
            display: none;
        }

        /* =========================================================
           SIDEBAR BUTTONS
        ========================================================= */

        .sidebar-actions {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .sidebar-button {
            width: 100%;
            min-height: 44px;

            padding: 8px 10px;

            display: flex;
            align-items: center;
            gap: 11px;

            background: transparent;
            color: var(--text-main);

            border-radius: 11px;

            cursor: pointer;

            text-align: right;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .sidebar-button:hover {
            background: var(--bg-message);
            color: var(--accent);
            transform: translateX(-2px);
        }

        body.ltr .sidebar-button:hover {
            transform: translateX(2px);
        }

        .sidebar-button.active {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .sidebar-icon {
            width: 25px;
            height: 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            font-size: 17px;
        }

        .sidebar-label {
            white-space: nowrap;
            font-size: 13px;
            font-weight: 700;
        }

        .sidebar.collapsed .sidebar-button {
            justify-content: center;
            padding: 8px;
        }

        .sidebar.collapsed .sidebar-label {
            display: none;
        }

        /* =========================================================
           SEARCH
        ========================================================= */

        .search-box {
            margin-top: 10px;
            margin-bottom: 8px;
        }

        .search-wrapper {
            display: flex;
            align-items: center;

            height: 42px;

            padding: 0 11px;

            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 11px;

            gap: 8px;
        }

        .search-icon {
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .search-input {
            width: 100%;

            background: transparent;
            border: none;
            outline: none;

            color: var(--text-main);
            font-size: 13px;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .sidebar.collapsed .search-box {
            display: none;
        }

        /* =========================================================
           RECENT CHATS
        ========================================================= */

        .recent-section {
            flex: 1;

            min-height: 0;

            margin-top: 10px;

            overflow: hidden;

            display: flex;
            flex-direction: column;
        }

        .section-title {
            padding: 8px 8px;

            color: var(--text-muted);

            font-size: 11px;
            font-weight: 800;

            white-space: nowrap;
        }

        .recent-list {
            flex: 1;

            overflow-y: auto;

            padding-right: 2px;
        }

        .recent-list::-webkit-scrollbar {
            width: 4px;
        }

        .recent-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        .recent-chat {
            width: 100%;

            padding: 9px 10px;

            border-radius: 9px;

            background: transparent;
            color: var(--text-muted);

            cursor: pointer;

            text-align: right;

            display: flex;
            align-items: center;
            gap: 8px;

            transition: 0.2s ease;
        }

        .recent-chat:hover {
            background: var(--bg-message);
            color: var(--text-main);
        }

        .recent-chat-icon {
            flex-shrink: 0;
        }

        .recent-chat-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            font-size: 12px;
        }

        .sidebar.collapsed .recent-section {
            display: none;
        }

        /* =========================================================
           PROFILE
        ========================================================= */

        .profile-area {
            margin-top: 10px;
            padding-top: 10px;

            border-top: 1px solid var(--border);
        }

        .profile-button {
            width: 100%;

            padding: 8px;

            background: transparent;
            color: var(--text-main);

            border-radius: 11px;

            cursor: pointer;

            display: flex;
            align-items: center;
            gap: 10px;

            text-align: right;

            transition: 0.2s ease;
        }

        .profile-button:hover {
            background: var(--bg-message);
        }

        .avatar {
            width: 38px;
            height: 38px;

            border-radius: 50%;

            background: var(--accent-soft);
            border: 1px solid var(--border);

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            flex-shrink: 0;

            color: var(--accent);
            font-weight: 900;
        }

        .avatar img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .profile-info {
            min-width: 0;
        }

        .profile-name {
            font-size: 12px;
            font-weight: 800;

            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .profile-username {
            margin-top: 2px;

            font-size: 10px;
            color: var(--text-muted);

            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .sidebar.collapsed .profile-info {
            display: none;
        }

        .sidebar.collapsed .profile-button {
            justify-content: center;
        }

        /* =========================================================
           MAIN
        ========================================================= */

        .main {
            flex: 1;

            min-width: 0;
            height: 100vh;

            display: flex;
            flex-direction: column;

            position: relative;
        }

        /* =========================================================
           TOPBAR
        ========================================================= */

        .topbar {
            height: 62px;

            padding: 0 18px;

            border-bottom: 1px solid var(--border);

            display: flex;
            align-items: center;
            justify-content: space-between;

            flex-shrink: 0;
        }

        .topbar-title {
            display: flex;
            align-items: center;
            gap: 9px;

            min-width: 0;
        }

        .topbar-title-icon {
            color: var(--accent);
        }

        .topbar-title-text {
            font-size: 14px;
            font-weight: 800;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .topbar-menu {
            position: relative;
        }

        .topbar-more {
            width: 38px;
            height: 38px;

            border-radius: 10px;

            background: transparent;
            color: var(--text-muted);

            cursor: pointer;

            font-size: 20px;
        }

        .topbar-more:hover {
            background: var(--bg-message);
            color: var(--accent);
        }

        /* =========================================================
           CHAT AREA
        ========================================================= */

        .chat-area {
            flex: 1;

            min-height: 0;

            overflow-y: auto;

            padding: 30px 20px 20px;
        }

        .chat-area::-webkit-scrollbar {
            width: 6px;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        .chat-content {
            width: min(820px, 100%);
            margin: 0 auto;

            min-height: 100%;

            display: flex;
            flex-direction: column;
        }

        /* =========================================================
           WELCOME
        ========================================================= */

        .welcome {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 50px 10px;
        }

        .welcome-inner {
            max-width: 580px;
        }

        .welcome-logo {
            width: 68px;
            height: 68px;

            margin: 0 auto 18px;

            border-radius: 21px;

            background: var(--accent-soft);
            border: 1px solid var(--border);

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--accent);

            font-size: 29px;
            font-weight: 900;
        }

        .welcome h1 {
            margin: 0;

            font-size: clamp(25px, 4vw, 34px);
        }

        .welcome p {
            margin: 10px auto 0;

            color: var(--text-muted);

            font-size: 14px;
            line-height: 1.8;
        }

        .suggestions {
            margin-top: 25px;

            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));

            gap: 9px;
        }

        .suggestion {
            padding: 13px;

            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;

            color: var(--text-main);

            cursor: pointer;

            text-align: right;

            font-size: 12px;

            transition: 0.2s ease;
        }

        .suggestion:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-soft);
        }

        /* =========================================================
           MESSAGES
        ========================================================= */

        .messages {
            display: flex;
            flex-direction: column;
            gap: 18px;

            padding-bottom: 30px;
        }

        .message {
            display: flex;
            gap: 10px;

            max-width: 85%;
        }

        .message.user {
            align-self: flex-start;
        }

        body.ltr .message.user {
            align-self: flex-end;
        }

        .message.novy {
            align-self: flex-end;
        }

        body.ltr .message.novy {
            align-self: flex-start;
        }

        .message-avatar {
            width: 30px;
            height: 30px;

            border-radius: 10px;

            background: var(--accent-soft);
            color: var(--accent);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 12px;
            font-weight: 900;

            flex-shrink: 0;
        }

        .message-body {
            padding: 11px 14px;

            border-radius: 14px;

            background: var(--bg-message);

            border: 1px solid var(--border);

            line-height: 1.8;

            font-size: 13px;

            white-space: pre-wrap;
            word-break: break-word;
        }

        .message.user .message-body {
            background: var(--accent-soft);
        }

        /* =========================================================
           INPUT
        ========================================================= */

        .composer-area {
            padding: 12px 20px 18px;

            flex-shrink: 0;
        }

        .composer {
            width: min(820px, 100%);
            margin: 0 auto;

            background: var(--bg-input);

            border: 1px solid var(--border);

            border-radius: 17px;

            box-shadow: var(--shadow);

            padding: 10px;
        }

        .composer-textarea {
            width: 100%;

            min-height: 48px;
            max-height: 180px;

            resize: none;

            border: none;
            outline: none;

            background: transparent;

            color: var(--text-main);

            font-size: 13px;
            line-height: 1.7;

            padding: 7px 8px;
        }

        .composer-textarea::placeholder {
            color: var(--text-muted);
        }

        .composer-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 8px;

            margin-top: 4px;
        }

        .composer-tools {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .composer-button {
            width: 36px;
            height: 36px;

            border-radius: 10px;

            background: transparent;
            color: var(--text-muted);

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: 0.2s ease;
        }

        .composer-button:hover {
            background: var(--bg-message);
            color: var(--accent);
        }

        .send-button {
            width: 38px;
            height: 38px;

            border-radius: 11px;

            background: var(--accent);
            color: #07111b;

            cursor: pointer;

            font-weight: 900;

            transition: 0.2s ease;
        }

        .send-button:hover {
            transform: translateY(-1px);
            filter: brightness(1.06);
        }

        .composer-note {
            margin: 7px auto 0;

            width: min(820px, 100%);

            text-align: center;

            color: var(--text-muted);

            font-size: 9px;
        }

        /* =========================================================
           DROPDOWN
        ========================================================= */

        .dropdown {
            position: absolute;

            top: calc(100% + 8px);
            right: 0;

            min-width: 190px;

            padding: 7px;

            background: var(--bg-panel);

            border: 1px solid var(--border);
            border-radius: 13px;

            box-shadow: var(--shadow);

            z-index: 100;

            display: none;
        }

        body.ltr .dropdown {
            right: auto;
            left: 0;
        }

        .dropdown.open {
            display: block;
        }

        .dropdown-button {
            width: 100%;

            padding: 10px;

            background: transparent;
            color: var(--text-main);

            border-radius: 9px;

            cursor: pointer;

            text-align: right;

            font-size: 12px;

            transition: 0.2s ease;
        }

        .dropdown-button:hover {
            background: var(--bg-message);
            color: var(--accent);
        }

        .dropdown-button.danger {
            color: var(--danger);
        }

        /* =========================================================
           MODAL
        ========================================================= */

        .modal-overlay {
            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.58);

            display: none;
            align-items: center;
            justify-content: center;

            padding: 20px;

            z-index: 500;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            width: min(470px, 100%);

            max-height: 90vh;
            overflow-y: auto;

            background: var(--bg-panel);

            border: 1px solid var(--border);
            border-radius: 18px;

            box-shadow: var(--shadow);

            padding: 20px;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;

            margin-bottom: 18px;
        }

        .modal-title {
            margin: 0;

            font-size: 17px;
        }

        .close-modal {
            width: 34px;
            height: 34px;

            border-radius: 9px;

            background: transparent;
            color: var(--text-muted);

            cursor: pointer;
        }

        .close-modal:hover {
            background: var(--bg-message);
            color: var(--text-main);
        }

        /* =========================================================
           PROFILE MENU
        ========================================================= */

        .profile-menu {
            position: fixed;

            bottom: 78px;

            right: 15px;

            width: 250px;

            padding: 8px;

            background: var(--bg-panel);

            border: 1px solid var(--border);
            border-radius: 15px;

            box-shadow: var(--shadow);

            z-index: 400;

            display: none;
        }

        body.ltr .profile-menu {
            right: auto;
            left: 15px;
        }

        .profile-menu.open {
            display: block;
        }

        .profile-menu-head {
            padding: 10px;

            display: flex;
            align-items: center;
            gap: 10px;

            border-bottom: 1px solid var(--border);

            margin-bottom: 6px;
        }

        .profile-menu-name {
            font-size: 12px;
            font-weight: 800;
        }

        .profile-menu-username {
            font-size: 10px;
            color: var(--text-muted);

            margin-top: 2px;
        }

        .profile-menu-button {
            width: 100%;

            padding: 10px;

            background: transparent;
            color: var(--text-main);

            border-radius: 9px;

            cursor: pointer;

            text-align: right;

            font-size: 12px;
        }

        .profile-menu-button:hover {
            background: var(--bg-message);
            color: var(--accent);
        }

        /* =========================================================
           SETTINGS
        ========================================================= */

        .settings-group {
            margin-bottom: 18px;
        }

        .settings-label {
            margin-bottom: 8px;

            color: var(--text-muted);

            font-size: 11px;
            font-weight: 800;
        }

        .settings-option {
            width: 100%;

            min-height: 44px;

            margin-bottom: 6px;

            padding: 10px 12px;

            border: 1px solid var(--border);
            border-radius: 11px;

            background: var(--bg-message);
            color: var(--text-main);

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: space-between;

            text-align: right;

            font-size: 12px;

            transition: 0.2s ease;
        }

        .settings-option:hover,
        .settings-option.active {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-soft);
        }

        /* =========================================================
           LANGUAGE PANEL
        ========================================================= */

        .language-panel {
            margin-top: 8px;

            padding: 9px;

            background: var(--bg-main);

            border: 1px solid var(--border);
            border-radius: 13px;

            display: none;
        }

        .language-panel.open {
            display: block;
        }

        .language-item {
            width: 100%;

            padding: 9px;

            background: transparent;
            color: var(--text-main);

            border-radius: 9px;

            cursor: pointer;

            text-align: right;

            font-size: 12px;
        }

        .language-item:hover {
            background: var(--bg-message);
            color: var(--accent);
        }

        /* =========================================================
           THEME CUSTOMIZER
        ========================================================= */

        .custom-theme {
            display: none;

            padding: 12px;

            background: var(--bg-main);

            border: 1px solid var(--border);
            border-radius: 13px;
        }

        .custom-theme.open {
            display: block;
        }

        .color-row {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 10px;

            font-size: 11px;
        }

        .color-row input[type="color"] {
            width: 42px;
            height: 30px;

            padding: 2px;

            border: 1px solid var(--border);
            border-radius: 7px;

            background: transparent;
            cursor: pointer;
        }

        /* =========================================================
           EMPTY / PLACEHOLDER PAGES
        ========================================================= */

        .page-view {
            flex: 1;

            overflow-y: auto;

            padding: 30px 20px;
        }

        .page-container {
            width: min(900px, 100%);
            margin: 0 auto;
        }

        .page-title {
            margin: 0 0 8px;

            font-size: 25px;
        }

        .page-description {
            margin: 0 0 25px;

            color: var(--text-muted);

            font-size: 13px;
            line-height: 1.8;
        }

        .page-card {
            padding: 20px;

            background: var(--bg-panel);

            border: 1px solid var(--border);
            border-radius: 15px;

            margin-bottom: 12px;
        }

        .page-card-title {
            margin: 0 0 6px;

            font-size: 14px;
        }

        .page-card-text {
            margin: 0;

            color: var(--text-muted);

            font-size: 12px;
            line-height: 1.8;
        }

        .primary-button {
            min-height: 43px;

            padding: 10px 15px;

            border-radius: 11px;

            background: var(--accent);
            color: #07111b;

            cursor: pointer;

            font-size: 12px;
            font-weight: 800;
        }

        .secondary-button {
            min-height: 43px;

            padding: 10px 15px;

            border-radius: 11px;

            background: var(--bg-message);
            color: var(--text-main);

            border: 1px solid var(--border);

            cursor: pointer;

            font-size: 12px;
            font-weight: 700;
        }

        .hidden {
            display: none !important;
        }

        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 700px) {
            :root {
                --sidebar-width: 250px;
            }

            .sidebar {
                position: fixed;
                z-index: 300;

                right: 0;
                top: 0;
            }

            body.ltr .sidebar {
                right: auto;
                left: 0;
            }

            .sidebar.collapsed {
                transform: translateX(100%);
                width: var(--sidebar-width);
            }

/* ============================================================
   LANGUAGE FALLBACK
============================================================ */

function getText(key) {

    const lang =
        localStorage.getItem("novy-language") || "fa";

    return (
        translations[lang]?.[key] ||
        translations.en?.[key] ||
        translations.fa?.[key] ||
        key
    );
}


/* ============================================================
   APPLY LANGUAGE
============================================================ */

function applyLanguage(lang) {

    if (!translations[lang] || Object.keys(translations[lang]).length === 0) {
        lang = "en";
    }

    localStorage.setItem("novy-language", lang);

    const rtlLanguages = ["fa", "ar"];

    const isRTL = rtlLanguages.includes(lang);

    document.documentElement.lang = lang;
    document.documentElement.dir = isRTL ? "rtl" : "ltr";

    document.body.classList.toggle("ltr", !isRTL);

    document.querySelectorAll("[data-i18n]").forEach(element => {

        const key = element.dataset.i18n;

        if (translations[lang]?.[key]) {
            element.textContent = translations[lang][key];
        }

    });


    document.querySelectorAll("[data-i18n-placeholder]").forEach(element => {

        const key = element.dataset.i18nPlaceholder;

        if (translations[lang]?.[key]) {
            element.placeholder = translations[lang][key];
        }

    });


    updateLanguageLabel(lang);
}


/* ============================================================
   LANGUAGE LABEL
============================================================ */

function updateLanguageLabel(lang) {

    const labels = {

        fa: "فارسی",
        en: "English",
        ar: "العربية",
        es: "Español",
        ko: "한국어",
        fr: "Français",
        de: "Deutsch",
        tr: "Türkçe",
        ja: "日本語",
        zh: "中文"

    };

    const element =
        document.getElementById("currentLanguageLabel");

    if (element) {
        element.textContent =
            labels[lang] || labels.en;
    }

}

function applyThemeVariables(theme) {

    const root =
        document.documentElement;

    Object.entries(theme).forEach(
        ([key, value]) => {

            const variableName =
                key.replace(/[A-Z]/g, m => "-" + m.toLowerCase());

            root.style.setProperty(
                "--" + variableName,
                value
            );

        }
    );

}


function setTheme(themeName) {

    if (!themes[themeName]) {
        return;
    }

    applyThemeVariables(
        themes[themeName]
    );

    localStorage.setItem(
        "novy-chat-theme",
        themeName
    );

    document
        .querySelectorAll(".settings-option")
        .forEach(el => el.classList.remove("active"));

    const active =
        document.getElementById(
            "theme" +
            themeName.charAt(0).toUpperCase() +
            themeName.slice(1)
        );

    if (active) {
        active.classList.add("active");
    }

    if (themeName !== "custom") {

        document
            .getElementById("customTheme")
            .classList.remove("open");

    }

}

/* ============================================================
   RECENT CHATS
============================================================ */

function renderRecentChats(
    filter = ""
) {

    const list =
        document.getElementById("recentList");

    list.innerHTML = "";

    const filtered =
        chats.filter(chat =>
            chat.title
                .toLowerCase()
                .includes(
                    filter.toLowerCase()
                )
        );


    if (!filtered.length) {

        const empty =
            document.createElement("div");

        empty.className =
            "section-title";

        empty.textContent =
            getText("noChats");

        list.appendChild(empty);

        return;
    }


    filtered.slice(0, 30).forEach(chat => {

        const button =
            document.createElement("button");

        button.className =
            "recent-chat";

        button.onclick =
            () => openStoredChat(chat.id);


        button.innerHTML = `
            <span class="recent-chat-icon">💬</span>
            <span class="recent-chat-title"></span>
        `;

        button
            .querySelector(".recent-chat-title")
            .textContent =
            chat.title;

        list.appendChild(button);

    });

}


/* ============================================================
   OPEN STORED CHAT
============================================================ */

function openStoredChat(id) {

    const chat =
        chats.find(
            item => item.id === id
        );

    if (!chat) return;

    currentChatId = id;

    document
        .getElementById("pageView")
        .classList.add("hidden");

    document
        .getElementById("chatView")
        .classList.remove("hidden");

    document
        .getElementById("composerArea")
        .classList.remove("hidden");

    document
        .getElementById("welcome")
        .classList.add("hidden");

    document
        .getElementById("pageTitle")
        .textContent =
        chat.title;

    renderMessages(
        chat.messages || []
    );

}

   RENDER MESSAGES
============================================================ */

function renderMessages(messages) {

    const container =
        document.getElementById("messages");

    container.innerHTML = "";

    messages.forEach(message => {

        addMessageToUI(
            message.role,
            message.content,
            false
        );

    });

}


/* ============================================================
   ADD MESSAGE UI
============================================================ */

function addMessageToUI(
    role,
    content,
    scroll = true
) {

    const container =
        document.getElementById("messages");

    const message =
        document.createElement("div");

    message.className =
        "message " +
        (role === "user"
            ? "user"
            : "novy");


    message.innerHTML = `

        <div class="message-avatar">
            ${role === "user" ? "U" : "N"}
        </div>

        <div class="message-body"></div>

    `;

    message
        .querySelector(".message-body")
        .textContent =
        content;

    container.appendChild(message);

    if (scroll) {

        const chatArea =
            document.getElementById("chatView");

        chatArea.scrollTop =
            chatArea.scrollHeight;

    }

}


/* ============================================================
   SEND MESSAGE
============================================================ */

function sendMessage() {

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if (!text) return;


    if (!currentChatId) {

        createChat();

    }


    const chat =
        chats.find(
            item => item.id === currentChatId
        );

    if (!chat) return;


    chat.messages.push({

        role: "user",

        content: text

    });


    if (
        chat.title === getText("newChat")
    ) {

        chat.title =
            text.length > 38
                ? text.slice(0, 38) + "..."
                : text;

    }


    saveChats();

    document
        .getElementById("welcome")
        .classList.add("hidden");


    addMessageToUI(
        "user",
        text
    );


    input.value = "";

    autoResize(input);

    document
        .getElementById("pageTitle")
        .textContent =
        chat.title;

    renderRecentChats();


    /*
        AI connection will be added later.
    */

}

    if (!currentChatId) {

            ? "🖼️ " + file.name

    const chat =
        chats.find(
            item => item.id === currentChatId

    if (!chat) return;

    chat.messages.push({

        role: "user",

        content: text

    });

    saveChats();

    document
        .getElementById("welcome")
        .classList.add("hidden");

    addMessageToUI(
        "user",
        text
    );

}

/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(value) {

    return String(value)
        .replace(
            /[&<>"']/g,
            char => ({

                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"

            }[char])
        );

}

            localStorage.getItem(
                "novy-custom-accent"
            ) || "#8ee7ff";

        document
            .getElementById("customBg")
            .value = bg;

        document
            .getElementById("customAccent")
            .value = accent;

        applyCustomTheme();

    } else {

        setTheme(
            savedTheme
        );

    }


    await loadUserProfile();

    renderRecentChats();

}


/* ============================================================
   CLICK OUTSIDE
============================================================ */

document.addEventListener(
    "click",
    function (event) {

        const profileMenu =
            document.getElementById(
                "profileMenu"
            );

        const profileButton =
            document.querySelector(
                ".profile-button"
            );

        if (
            profileMenu.classList.contains("open") &&
            !profileMenu.contains(event.target) &&
            !profileButton.contains(event.target)
        ) {

            closeProfileMenu();

        }


        const chatMenu =
            document.getElementById(
                "chatMenu"
            );

        const moreButton =
            document.querySelector(
                ".topbar-more"
            );

        if (
            chatMenu.classList.contains("open") &&
            !chatMenu.contains(event.target) &&
            !moreButton.contains(event.target)
        ) {

            closeChatMenu();

        }

    }
);


/* ============================================================
   AUTH STATE
============================================================ */

supabaseClient.auth.onAuthStateChange(
    (event, session) => {

        if (
            event === "SIGNED_OUT" ||
            !session
        ) {

            window.location.href =
                "login.html";

        }

    }
);


/* ============================================================
   START
============================================================ */

initialize();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نووی | همراه دانش‌آموزان</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #061426;
  --section: #081b30;
  --card: #0b233d;
  --chat: #0a2038;
  --message: #102e4a;
  --text: #f4fbff;
  --soft: #a8c7d9;
  --muted: #91b0c2;
  --accent: #8ee7ff;
  --border: #1d405d;
  --border-soft: #163452;
  --danger: #ff7185;
}

/* =========================
   THEMES
========================= */

body.theme-navy {
  --bg: #061426;
  --section: #081b30;
  --card: #0b233d;
  --chat: #0a2038;
  --message: #102e4a;
  --text: #f4fbff;
  --soft: #a8c7d9;
  --muted: #91b0c2;
  --accent: #8ee7ff;
  --border: #1d405d;
  --border-soft: #163452;
}

body.theme-black {
  --bg: #050505;
  --section: #0b0b0b;
  --card: #111111;
  --chat: #0a0a0a;
  --message: #181818;
  --text: #f5f5f5;
  --soft: #c0c0c0;
  --muted: #929292;
  --accent: #ffffff;
  --border: #292929;
  --border-soft: #202020;
}

body.theme-ice {
  --bg: #dff6ff;
  --section: #c9effc;
  --card: #eafaff;
  --chat: #e5f8ff;
  --message: #cceffc;
  --text: #102a3a;
  --soft: #42677a;
  --muted: #648596;
  --accent: #008dcc;
  --border: #9ed8eb;
  --border-soft: #b9e5f2;
}

body.theme-night {
  --bg: #100b20;
  --section: #17102c;
  --card: #21163c;
  --chat: #190f31;
  --message: #2b1c49;
  --text: #f7f0ff;
  --soft: #cdbce5;
  --muted: #a895bd;
  --accent: #c995ff;
  --border: #503678;
  --border-soft: #392557;
}

/* =========================
   BODY
========================= */

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family:
    Tahoma,
    Arial,
    sans-serif;
  transition:
    background 0.25s ease,
    color 0.25s ease;
}

button,
input,
textarea {
  font-family: inherit;
}

/* =========================
   APP
========================= */

.app {
  min-height: 100vh;
  display: flex;
  background: var(--bg);
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
  width: 270px;
  flex-shrink: 0;
  background: var(--section);
  border-inline-end: 1px solid var(--border);
  padding: 18px 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition:
    width 0.25s ease,
    transform 0.25s ease,
    background 0.25s ease;
  z-index: 1000;
}

.sidebar.collapsed {
  width: 76px;
}

.sidebar.collapsed .logo-text,
.sidebar.collapsed .tool-text,
.sidebar.collapsed .recent-title,
.sidebar.collapsed .recent-item,
.sidebar.collapsed .profile-info {
  display: none;
}

.sidebar.collapsed .logo {
  justify-content: center;
}

.sidebar.collapsed .tool {
  justify-content: center;
}

.sidebar.collapsed .profile {
  justify-content: center;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px 18px;
}

.logo-icon {
  width: 40px;
  height: 40px;
  border-radius: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--card);
  border: 1px solid var(--border);
  font-size: 21px;
  flex-shrink: 0;
}

.logo-text {
  font-weight: 800;
  font-size: 18px;
  white-space: nowrap;
}

.logo-text small {
  display: block;
  color: var(--muted);
  font-size: 10px;
  font-weight: 400;
  margin-top: 3px;
}

/* =========================
   SIDEBAR TOOLS
========================= */

.tools {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.tool {
  border: 0;
  background: transparent;
  color: var(--soft);
  min-height: 45px;
  border-radius: 12px;
  padding: 9px 11px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  text-align: start;
  transition:
    background 0.18s ease,
    color 0.18s ease;
}

.tool:hover {
  background: var(--card);
  color: var(--text);
}

.tool.active {
  background: var(--card);
  color: var(--accent);
}

.tool-icon {
  width: 24px;
  text-align: center;
  font-size: 18px;
  flex-shrink: 0;
}

.tool-text {
  font-size: 14px;
  white-space: nowrap;
}

.recent {
  margin-top: 8px;
  padding-top: 12px;
  border-top: 1px solid var(--border-soft);
  overflow: hidden;
}

.recent-title {
  color: var(--muted);
  font-size: 11px;
  padding: 4px 10px 8px;
}

.recent-item {
  border: 0;
  background: transparent;
  color: var(--soft);
  width: 100%;
  text-align: start;
  border-radius: 9px;
  padding: 8px 10px;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.recent-item:hover {
  background: var(--card);
  color: var(--text);
}

/* =========================
   PROFILE
========================= */

.profile {
  margin-top: auto;
  border-top: 1px solid var(--border-soft);
  padding-top: 13px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.profile-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--card);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.profile-name {
  font-size: 13px;
  font-weight: 700;
}

.profile-sub {
  color: var(--muted);
  font-size: 10px;
  margin-top: 2px;
}

/* =========================
   MAIN
========================= */

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* =========================
   TOPBAR
========================= */

.topbar {
  height: 64px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 18px;
  border-bottom: 1px solid var(--border);
  background: var(--section);
}

.icon-button {
  width: 40px;
  height: 40px;
  border-radius: 11px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}

.icon-button:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.chat-title {
  font-weight: 800;
  font-size: 15px;
}

.chat-status {
  color: var(--muted);
  font-size: 10px;
  margin-top: 3px;
}

/* =========================
   CHAT
========================= */

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 35px 18px 140px;
  background: var(--chat);
}

.chat-inner {
  width: min(850px, 100%);
  margin: auto;
}

.welcome {
  text-align: center;
  padding: 65px 15px 35px;
}

.welcome-icon {
  width: 65px;
  height: 65px;
  margin: 0 auto 17px;
  border-radius: 20px;
  background: var(--card);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 31px;
}

.welcome h1 {
  margin: 0 0 9px;
  font-size: 27px;
}

.welcome p {
  margin: 0;
  color: var(--soft);
  font-size: 14px;
}

.messages {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.message {
  max-width: 80%;
  padding: 12px 15px;
  border-radius: 16px;
  line-height: 1.8;
  font-size: 14px;
  white-space: pre-wrap;
}

.message.user {
  align-self: flex-start;
  background: var(--accent);
  color: #062033;
  border-bottom-left-radius: 5px;
}

.message.novy {
  align-self: flex-end;
  background: var(--message);
  border: 1px solid var(--border-soft);
  border-bottom-right-radius: 5px;
}

/* =========================
   INPUT AREA
========================= */

.input-area {
  position: fixed;
  inset-inline-start: 270px;
  inset-inline-end: 0;
  bottom: 0;
  padding: 14px 18px 18px;
  background: linear-gradient(
    to top,
    var(--chat) 75%,
    transparent
  );
  transition: inset-inline-start 0.25s ease;
  z-index: 900;
}

.sidebar.collapsed ~ .main .input-area {
  inset-inline-start: 76px;
}

.input-inner {
  width: min(850px, 100%);
  margin: auto;
}

.input-box {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 17px;
  padding: 8px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.15);
}

.input-box textarea {
  flex: 1;
  min-height: 42px;
  max-height: 130px;
  resize: none;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--text);
  padding: 10px 8px;
  font-size: 14px;
}

.input-box textarea::placeholder {
  color: var(--muted);
}

.send-button {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  border: 0;
  border-radius: 12px;
  background: var(--accent);
  color: #062033;
  cursor: pointer;
  font-size: 18px;
  font-weight: 800;
}

.send-button:hover {
  filter: brightness(1.08);
}

.note {
  color: var(--muted);
  font-size: 9px;
  text-align: center;
  margin-top: 7px;
}

/* =========================
   SETTINGS PANEL
========================= */

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.48);
  opacity: 0;
  visibility: hidden;
  transition: 0.2s ease;
  z-index: 1500;
}

.overlay.show {
  opacity: 1;
  visibility: visible;
}

.settings-panel {
  position: fixed;
  top: 0;
  inset-inline-end: 0;
  width: min(390px, 92vw);
  height: 100vh;
  background: var(--section);
  border-inline-start: 1px solid var(--border);
  transform: translateX(105%);
  transition:
    transform 0.25s ease,
    background 0.25s ease;
  z-index: 1600;
  overflow-y: auto;
  padding: 22px;
}

.settings-panel.open {
  transform: translateX(0);
}

.settings-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 25px;
}

.settings-header h2 {
  margin: 0;
  font-size: 19px;
}

.settings-section {
  margin-bottom: 28px;
}

.settings-section h3 {
  margin: 0 0 12px;
  font-size: 13px;
  color: var(--soft);
}

.theme-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.theme-option,
.language-option {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  border-radius: 13px;
  padding: 13px 10px;
  cursor: pointer;
  text-align: center;
  transition: 0.18s ease;
}

.theme-option:hover,
.language-option:hover {
  border-color: var(--accent);
}

.theme-option.active,
.language-option.active {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

.theme-preview {
  height: 45px;
  border-radius: 9px;
  margin-bottom: 9px;
  border: 1px solid rgba(255,255,255,0.12);
}

.preview-navy {
  background:
    linear-gradient(135deg, #061426, #102e4a);
}

.preview-black {
  background:
    linear-gradient(135deg, #050505, #202020);
}

.preview-ice {
  background:
    linear-gradient(135deg, #dff6ff, #83cfe8);
}

.preview-night {
  background:
    linear-gradient(135deg, #100b20, #55367c);
}

.language-grid {
  display: grid;
  gap: 8px;
}

.language-option {
  text-align: start;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* =========================
   CUSTOM THEME
========================= */

.customizer {
  display: none;
  margin-top: 14px;
  padding: 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 15px;
}

.customizer.show {
  display: block;
}

.customizer-title {
  font-size: 12px;
  color: var(--soft);
  margin-bottom: 13px;
}

.color-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 11px;
}

.color-row:last-child {
  margin-bottom: 0;
}

.color-row label {
  font-size: 12px;
  color: var(--text);
}

.color-picker {
  width: 45px;
  height: 32px;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: transparent;
  cursor: pointer;
}

.custom-actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}

.custom-action {
  flex: 1;
  min-height: 37px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--section);
  color: var(--text);
  cursor: pointer;
  font-size: 11px;
}

.custom-action:hover {
  border-color: var(--accent);
}

.custom-action.primary {
  background: var(--accent);
  color: #062033;
  border-color: var(--accent);
}

/* =========================
   MOBILE
========================= */

.mobile-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 950;
}

@media (max-width: 760px) {

  .sidebar {
    position: fixed;
    top: 0;
    bottom: 0;
    inset-inline-start: 0;
    width: 270px;
    transform: translateX(105%);
  }

  html[dir="ltr"] .sidebar {
    inset-inline-start: auto;
    inset-inline-end: 0;
    transform: translateX(105%);
  }

  .sidebar.mobile-open {
    transform: translateX(0);
  }

  .sidebar.collapsed {
    width: 270px;
  }

  .sidebar.collapsed .logo-text,
  .sidebar.collapsed .tool-text,
  .sidebar.collapsed .recent-title,
  .sidebar.collapsed .recent-item,
  .sidebar.collapsed .profile-info {
    display: block;
  }

  .sidebar.collapsed .logo {
    justify-content: flex-start;
  }

  .sidebar.collapsed .tool {
    justify-content: flex-start;
  }

  .sidebar.collapsed .profile {
    justify-content: flex-start;
  }

  .mobile-overlay.show {
    display: block;
  }

  .input-area {
    inset-inline-start: 0 !important;
  }

  .message {
    max-width: 90%;
  }

  .welcome {
    padding-top: 45px;
  }

  .welcome h1 {
    font-size: 23px;
  }

  .chat {
    padding-inline: 12px;
  }
}
</style>
</head>

<body class="theme-navy">

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="logo">
      <div class="logo-icon">🤖</div>
      <div class="logo-text">
        نووی
        <small id="logoSubtitle">همراه دانش‌آموزان</small>
      </div>
    </div>

    <div class="tools">

      <button class="tool active" data-tool="newChat" id="newChatBtn">
        <span class="tool-icon">＋</span>
        <span class="tool-text" data-i18n="newChat">گفت‌وگوی جدید</span>
      </button>

      <button class="tool" data-tool="images">
        <span class="tool-icon">🖼️</span>
        <span class="tool-text" data-i18n="images">تصاویر</span>
      </button>

      <button class="tool" data-tool="library">
        <span class="tool-icon">📚</span>
        <span class="tool-text" data-i18n="library">کتابخانه</span>
      </button>

      <button class="tool" data-tool="projects">
        <span class="tool-icon">📁</span>
        <span class="tool-text" data-i18n="projects">پروژه‌ها</span>
      </button>

      <button class="tool" data-tool="code">
        <span class="tool-icon">💻</span>
        <span class="tool-text" data-i18n="code">کدنویسی</span>
      </button>

      <button class="tool" id="settingsBtn">
        <span class="tool-icon">⚙️</span>
        <span class="tool-text" data-i18n="settings">تنظیمات</span>
      </button>

    </div>

    <div class="recent">
      <div class="recent-title" data-i18n="recent">گفت‌وگوهای اخیر</div>

      <button class="recent-item">
        💡 ایده‌های پروژه
      </button>

      <button class="recent-item">
        🔬 فیزیک و لیزر
      </button>

      <button class="recent-item">
        🧠 علوم مغز
      </button>
    </div>

    <div class="profile">
      <div class="profile-avatar">👤</div>

      <div class="profile-info">
        <div class="profile-name" data-i18n="student">دانش‌آموز</div>
        <div class="profile-sub" data-i18n="online">آنلاین</div>
      </div>
    </div>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <header class="topbar">

      <button class="icon-button" id="menuBtn" aria-label="menu">
        ☰
      </button>

      <div>
        <div class="chat-title">نووی</div>
        <div class="chat-status" data-i18n="status">
          همراه دانش‌آموزان
        </div>
      </div>

    </header>

    <section class="chat" id="chat">

      <div class="chat-inner">

        <div class="welcome" id="welcome">

          <div class="welcome-icon">🤖</div>

          <h1 data-i18n="welcomeTitle">
            سلام! من نووی‌ام 👋
          </h1>

          <p data-i18n="welcomeText">
            همراهت برای یادگیری، برنامه‌ریزی و پیدا کردن جواب سؤال‌هات.
          </p>

        </div>

        <div class="messages" id="messages"></div>

      </div>

    </section>

  </main>

</div>

<!-- INPUT -->
<div class="input-area">

  <div class="input-inner">

    <div class="input-box">

      <textarea
        id="messageInput"
        rows="1"
        data-i18n-placeholder="placeholder"
        placeholder="پیامت رو بنویس..."
      ></textarea>

      <button class="send-button" id="sendBtn">
        ➤
      </button>

    </div>

    <div class="note" data-i18n="note">
      نووی ممکن است اشتباه کند؛ اطلاعات مهم را بررسی کن.
    </div>

  </div>

</div>

<!-- MOBILE OVERLAY -->
<div class="mobile-overlay" id="mobileOverlay"></div>

<!-- SETTINGS OVERLAY -->
<div class="overlay" id="settingsOverlay"></div>

<!-- SETTINGS -->
<aside class="settings-panel" id="settingsPanel">

  <div class="settings-header">

    <h2 data-i18n="settingsTitle">تنظیمات</h2>

    <button class="icon-button" id="closeSettings">
      ×
    </button>

  </div>

  <!-- THEMES -->
  <section class="settings-section">

    <h3 data-i18n="themeTitle">
      ظاهر
    </h3>

    <div class="theme-grid">

      <button
        class="theme-option"
        data-theme="navy"
      >
        <div class="theme-preview preview-navy"></div>
        <span data-i18n="themeNavy">🌌 سرمه‌ای</span>
      </button>

      <button
        class="theme-option"
        data-theme="black"
      >
        <div class="theme-preview preview-black"></div>
        <span data-i18n="themeBlack">🖤 مشکی</span>
      </button>

      <button
        class="theme-option"
        data-theme="ice"
      >
        <div class="theme-preview preview-ice"></div>
        <span data-i18n="themeIce">🧊 آبی یخی</span>
      </button>

      <button
        class="theme-option"
        data-theme="night"
      >
        <div class="theme-preview preview-night"></div>
        <span data-i18n="themeNight">🌙 بنفش شب</span>
      </button>

    </div>

    <!-- CUSTOM -->
    <div class="customizer" id="customizer">

      <div class="customizer-title" data-i18n="customTitle">
        🎨 تم سفارشی
      </div>

      <div class="color-row">
        <label data-i18n="customBg">پس‌زمینه</label>
        <input
          type="color"
          class="color-picker"
          id="customBg"
          value="#061426"
        >
      </div>

      <div class="color-row">
        <label data-i18n="customSection">بخش‌ها</label>
        <input
          type="color"
          class="color-picker"
          id="customSection"
          value="#081b30"
        >
      </div>

      <div class="color-row">
        <label data-i18n="customCard">کارت‌ها</label>
        <input
          type="color"
          class="color-picker"
          id="customCard"
          value="#0b233d"
        >
      </div>

      <div class="color-row">
        <label data-i18n="customMessage">پیام‌ها</label>
        <input
          type="color"
          class="color-picker"
          id="customMessage"
          value="#102e4a"
        >
      </div>

      <div class="color-row">
        <label data-i18n="customText">نوشته‌ها</label>
        <input
          type="color"
          class="color-picker"
          id="customText"
          value="#f4fbff"
        >

/* =========================================================
   ELEMENTS
========================================================= */

const body = document.body;

const sidebar = document.getElementById("sidebar");
const menuBtn = document.getElementById("menuBtn");
const mobileOverlay = document.getElementById("mobileOverlay");

const settingsBtn = document.getElementById("settingsBtn");
const settingsPanel = document.getElementById("settingsPanel");
const settingsOverlay = document.getElementById("settingsOverlay");
const closeSettings = document.getElementById("closeSettings");

const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");

const customizer = document.getElementById("customizer");

const customBg = document.getElementById("customBg");
const customSection = document.getElementById("customSection");
const customCard = document.getElementById("customCard");
const customMessage = document.getElementById("customMessage");
const customText = document.getElementById("customText");
const customAccent = document.getElementById("customAccent");

const saveCustom = document.getElementById("saveCustom");
const resetCustom = document.getElementById("resetCustom");

/* =========================================================
   DEFAULT CUSTOM COLORS
========================================================= */

const defaultCustom = {
  bg: "#061426",
  section: "#081b30",
  card: "#0b233d",
  message: "#102e4a",
  text: "#f4fbff",
  accent: "#8ee7ff"
};

/* =========================================================
   THEME
========================================================= */

function applyTheme(theme) {

  const validThemes = [
    "navy",
    "black",
    "ice",
    "night",
    "custom"
  ];

  if (!validThemes.includes(theme)) {
    theme = "navy";
  }

  body.classList.remove(
    "theme-navy",
    "theme-black",
    "theme-ice",
    "theme-night"
  );

  if (theme === "custom") {

    body.classList.add("theme-navy");

    const custom =
      JSON.parse(
        localStorage.getItem("novyCustomTheme")
      ) || defaultCustom;

    body.style.setProperty("--bg", custom.bg);
    body.style.setProperty("--section", custom.section);
    body.style.setProperty("--card", custom.card);
    body.style.setProperty("--chat", custom.bg);
    body.style.setProperty("--message", custom.message);
    body.style.setProperty("--text", custom.text);
    body.style.setProperty("--soft", custom.text);
    body.style.setProperty("--muted", custom.text);
    body.style.setProperty("--accent", custom.accent);
    body.style.setProperty("--border", custom.accent);
    body.style.setProperty("--border-soft", custom.section);

    customBg.value = custom.bg;
    customSection.value = custom.section;
    customCard.value = custom.card;
    customMessage.value = custom.message;
    customText.value = custom.text;
    customAccent.value = custom.accent;

    customizer.classList.add("show");

  } else {

    body.style.removeProperty("--bg");
    body.style.removeProperty("--section");
    body.style.removeProperty("--card");
    body.style.removeProperty("--chat");
    body.style.removeProperty("--message");
    body.style.removeProperty("--text");
    body.style.removeProperty("--soft");
    body.style.removeProperty("--muted");
    body.style.removeProperty("--accent");
    body.style.removeProperty("--border");
    body.style.removeProperty("--border-soft");

    body.classList.add("theme-" + theme);

    customizer.classList.remove("show");
  }

  localStorage.setItem("novyTheme", theme);

  updateThemeButtons(theme);
}

/* =========================================================
   THEME BUTTONS
========================================================= */

function updateThemeButtons(theme) {

  document
    .querySelectorAll(".theme-option")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.theme === theme
      );

    });
}

/* =========================================================
   CUSTOM THEME
========================================================= */

function saveCustomTheme() {

  const custom = {

    bg: customBg.value,
    section: customSection.value,
    card: customCard.value,
    message: customMessage.value,
    text: customText.value,
    accent: customAccent.value

  };

  localStorage.setItem(
    "novyCustomTheme",
    JSON.stringify(custom)
  );

  applyTheme("custom");
}

function resetCustomTheme() {

  localStorage.setItem(
    "novyCustomTheme",
    JSON.stringify(defaultCustom)
  );

  customBg.value = defaultCustom.bg;
  customSection.value = defaultCustom.section;
  customCard.value = defaultCustom.card;
  customMessage.value = defaultCustom.message;
  customText.value = defaultCustom.text;
  customAccent.value = defaultCustom.accent;

  applyTheme("custom");
}

/* =========================================================
   LANGUAGE
========================================================= */

function applyLanguage(language) {

  if (!translations[language]) {
    language = "fa";
  }

  const t = translations[language];

  document.documentElement.lang = language;

  document.documentElement.dir =
    language === "en" ? "ltr" : "rtl";

  document
    .querySelectorAll("[data-i18n]")
    .forEach(element => {

      const key = element.dataset.i18n;

      if (t[key]) {
        element.textContent = t[key];
      }

    });

  document
    .querySelectorAll("[data-i18n-placeholder]")
    .forEach(element => {

      const key = element.dataset.i18nPlaceholder;

      if (t[key]) {
        element.placeholder = t[key];
      }

    });

  document
    .querySelectorAll(".language-option")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.language === language
      );

    });

  localStorage.setItem(
    "novyLanguage",
    language
  );
}

/* =========================================================
   SETTINGS
========================================================= */

function openSettings() {

  settingsPanel.classList.add("open");
  settingsOverlay.classList.add("show");
}

function closeSettingsPanel() {

  settingsPanel.classList.remove("open");
  settingsOverlay.classList.remove("show");
}

settingsBtn.addEventListener(
  "click",
  openSettings
);

closeSettings.addEventListener(
  "click",
  closeSettingsPanel
);

settingsOverlay.addEventListener(
  "click",
  closeSettingsPanel
);

/* =========================================================
   SIDEBAR
========================================================= */

menuBtn.addEventListener("click", () => {

  if (window.innerWidth <= 760) {

    sidebar.classList.toggle("mobile-open");
    mobileOverlay.classList.toggle(
      "show"
    );

  } else {

    sidebar.classList.toggle("collapsed");

  }

});

mobileOverlay.addEventListener(
  "click",
  () => {

    sidebar.classList.remove(
      "mobile-open"
    );

    mobileOverlay.classList.remove(
      "show"
    );

  }
);

/* =========================================================
   THEME EVENTS
========================================================= */

document
  .querySelectorAll(".theme-option")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        applyTheme(
          button.dataset.theme
        );

      }
    );

  });

saveCustom.addEventListener(
  "click",
  saveCustomTheme
);

resetCustom.addEventListener(
  "click",
  resetCustomTheme
);

/* =========================================================
   LANGUAGE EVENTS
========================================================= */

document
  .querySelectorAll(".language-option")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        applyLanguage(
          button.dataset.language
        );

      }
    );

  });

/* =========================================================
   SEND MESSAGE
========================================================= */

function sendMessage() {

  const text =
    messageInput.value.trim();

  if (!text) return;

  welcome.style.display = "none";

  const userMessage =
    document.createElement("div");

  userMessage.className =
    "message user";

  userMessage.textContent = text;

  messages.appendChild(
    userMessage
  );

  messageInput.value = "";

  messageInput.style.height = "42px";

  const language =
    localStorage.getItem(
      "novyLanguage"
    ) || "fa";

  setTimeout(() => {

    const botMessage =
      document.createElement("div");

    botMessage.className =
      "message novy";

    botMessage.textContent =
      translations[language].fakeAnswer;

    messages.appendChild(
      botMessage
    );

    document
      .getElementById("chat")
      .scrollTo({
        top:
          document.getElementById("chat")
            .scrollHeight,
        behavior: "smooth"
      });

  }, 500);

}

sendBtn.addEventListener(
  "click",
  sendMessage
);

messageInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);

/* =========================================================
   AUTO RESIZE TEXTAREA
========================================================= */

messageInput.addEventListener(
  "input",
  () => {

    messageInput.style.height = "auto";

    messageInput.style.height =
      Math.min(
        messageInput.scrollHeight,
        130
      ) + "px";

  }
);

/* =========================================================
   NEW CHAT
========================================================= */

document
  .getElementById("newChatBtn")
  .addEventListener(
    "click",
    () => {

      messages.innerHTML = "";

      welcome.style.display = "";

      messageInput.value = "";

      messageInput.style.height =
        "42px";

      if (window.innerWidth <= 760) {

        sidebar.classList.remove(
          "mobile-open"
        );

        mobileOverlay.classList.remove(
          "show"
        );

      }

    }
  );

/* =========================================================
   SIDEBAR PLACEHOLDER TOOLS
========================================================= */

document
  .querySelectorAll(".tool[data-tool]")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        if (
          button.dataset.tool ===
          "newChat"
        ) {
          return;
        }

        const language =
          localStorage.getItem(
            "novyLanguage"
          ) || "fa";

        alert(
          translations[language].toolSoon
        );

      }
    );

  });

/* =========================================================
   INITIAL LOAD
========================================================= */

const savedTheme =
  localStorage.getItem(
    "novyTheme"
  ) || "navy";

const savedLanguage =
  localStorage.getItem(
    "novyLanguage"
  ) || "fa";

applyTheme(savedTheme);

applyLanguage(savedLanguage);

</script>

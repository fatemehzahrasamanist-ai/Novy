<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOVY</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
    --bg-main:#07111f;
    --bg-sidebar:#0a1627;
    --bg-card:#0e1d31;
    --bg-card-2:#122942;
    --bg-input:#0b1a2c;

    --text-main:#f5f8ff;
    --text-soft:#a8b7ca;
    --text-muted:#718198;

    --accent:#8ee7ff;
    --accent-soft:rgba(142,231,255,.11);

    --border:rgba(255,255,255,.09);
    --danger:#ff7187;

    --sidebar-width:280px;
    --sidebar-collapsed:76px;

    --radius-sm:10px;
    --radius-md:14px;
    --radius-lg:20px;

    --transition:.22s ease;
}

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
}

body{
    font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    background:var(--bg-main);
    color:var(--text-main);

    -webkit-font-smoothing:antialiased;
}

button,
input,
textarea{
    font:inherit;
}

button{
    border:0;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
}

/* =========================
   APP
========================= */

.app{
    width:100%;
    height:100vh;

    display:flex;
    overflow:hidden;

    background:var(--bg-main);
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:var(--sidebar-width);
    min-width:var(--sidebar-width);

    height:100vh;

    display:flex;
    flex-direction:column;

    background:
        linear-gradient(
            180deg,
            var(--bg-sidebar),
            var(--bg-main)
        );

    border-left:1px solid var(--border);

    transition:
        width var(--transition),
        min-width var(--transition);

    overflow:hidden;

    z-index:50;
}

.sidebar.collapsed{
    width:var(--sidebar-collapsed);
    min-width:var(--sidebar-collapsed);
}

/* top */

.sidebar-top{
    height:70px;
    min-height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:11px 12px;

    border-bottom:1px solid var(--border);
}

.sidebar.collapsed .sidebar-top{
    justify-content:center;
}

/* logo */

.brand{
    display:flex;
    align-items:center;
    gap:10px;

    min-width:0;

    white-space:nowrap;
}

.brand-logo{
    width:42px;
    height:42px;

    flex:0 0 42px;

    display:grid;
    place-items:center;

    border-radius:13px;

    color:var(--accent);

    font-size:21px;
    font-weight:950;

    background:
        linear-gradient(
            135deg,
            var(--accent-soft),
            rgba(255,255,255,.035)
        );

    border:1px solid rgba(142,231,255,.12);

    box-shadow:
        0 0 30px rgba(142,231,255,.06);
}

.brand-name{
    font-size:18px;
    font-weight:950;
    letter-spacing:.5px;
}

/* toggle */

.sidebar-toggle{
    width:38px;
    height:38px;

    flex:0 0 38px;

    display:grid;
    place-items:center;

    border-radius:11px;

    background:var(--bg-card);
    border:1px solid var(--border);

    color:var(--text-soft);

    cursor:pointer;

    font-size:18px;

    transition:all var(--transition);
}

.sidebar-toggle:hover{
    color:var(--accent);
    border-color:var(--accent);

    transform:translateY(-1px);
}

.sidebar.collapsed .brand-name{
    display:none;
}

/* content */

.sidebar-content{
    flex:1;

    overflow-y:auto;

    padding:13px 10px;
}

.sidebar-content::-webkit-scrollbar{
    width:5px;
}

.sidebar-content::-webkit-scrollbar-thumb{
    background:var(--border);
    border-radius:20px;
}

/* buttons */

.new-chat,
.side-button{
    width:100%;

    display:flex;
    align-items:center;

    border-radius:13px;

    cursor:pointer;

    transition:all var(--transition);
}

/* new */

.new-chat{
    min-height:46px;

    justify-content:center;

    gap:9px;

    margin-bottom:8px;

    color:var(--accent);

    background:
        linear-gradient(
            135deg,
            var(--accent-soft),
            rgba(142,231,255,.035)
        );

    border:1px solid rgba(142,231,255,.16);

    font-weight:850;
}

.new-chat:hover{
    border-color:var(--accent);

    transform:translateY(-1px);
}

.sidebar.collapsed .new-chat-text{
    display:none;
}

.sidebar.collapsed .new-chat{
    justify-content:center;
}

/* normal */

.side-button{
    min-height:44px;

    padding:0 12px;

    gap:11px;

    margin-bottom:3px;

    background:transparent;

    color:var(--text-soft);

    font-weight:700;

    text-align:right;
}

.side-button:hover,
.side-button.active{
    background:var(--accent-soft);
    color:var(--accent);
}

.side-icon{
    width:22px;
    min-width:22px;

    text-align:center;

    font-size:17px;
}

.side-text{
    white-space:nowrap;
}

.sidebar.collapsed .side-button{
    justify-content:center;
    padding:0;
}

.sidebar.collapsed .side-text{
    display:none;
}

/* section title */

.sidebar-label{
    margin:19px 0 7px;
    padding:0 12px;

    color:var(--text-muted);

    font-size:10px;
    font-weight:900;

    letter-spacing:.4px;
}

.sidebar.collapsed .sidebar-label{
    display:none;
}

/* recent */

.recent-list{
    display:flex;
    flex-direction:column;

    gap:3px;
}

.recent-chat{
    width:100%;

    padding:9px 11px;

    border-radius:10px;

    background:transparent;

    color:var(--text-soft);

    text-align:right;

    cursor:pointer;

    font-size:12.5px;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.recent-chat:hover{
    background:var(--bg-card-2);
    color:var(--text-main);
}

.sidebar.collapsed .recent-list{
    display:none;
}

/* =========================
   PROFILE
========================= */

.profile-box{
    position:relative;

    padding:10px;

    border-top:1px solid var(--border);
}

.profile-button{
    width:100%;

    display:flex;
    align-items:center;

    gap:10px;

    padding:8px;

    border-radius:13px;

    background:transparent;

    color:var(--text-main);

    cursor:pointer;

    text-align:right;
}

.profile-button:hover{
    background:var(--accent-soft);
}

.profile-avatar{
    width:40px;
    height:40px;

    min-width:40px;

    border-radius:50%;

    object-fit:cover;

    display:grid;
    place-items:center;

    background:var(--accent-soft);

    color:var(--accent);

    font-weight:950;

    border:1px solid rgba(142,231,255,.12);
}

.profile-info{
    min-width:0;
}

.profile-name,
.profile-email{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.profile-name{
    font-size:13px;
    font-weight:850;
}

.profile-email{
    margin-top:2px;

    color:var(--text-muted);

    font-size:10.5px;
}

.sidebar.collapsed .profile-info{
    display:none;
}

.profile-menu{
    position:absolute;

    right:10px;
    left:10px;
    bottom:67px;

    display:none;

    padding:7px;

    background:var(--bg-card);

    border:1px solid var(--border);
    border-radius:15px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.4);

    z-index:80;
}

.profile-menu.show{
    display:block;
}

.profile-menu button{
    width:100%;

    padding:11px;

    border-radius:10px;

    background:transparent;

    color:var(--text-soft);

    cursor:pointer;

    text-align:right;
}

.profile-menu button:hover{
    background:var(--accent-soft);
    color:var(--accent);
}

/* =========================
   MAIN
========================= */

.main{
    flex:1;
    min-width:0;

    height:100vh;

    display:flex;
    flex-direction:column;

    background:var(--bg-main);
}

/* =========================
   TOPBAR
========================= */

.topbar{
    height:68px;
    min-height:68px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    border-bottom:1px solid var(--border);

    background:
        color-mix(
            in srgb,
            var(--bg-main) 92%,
            transparent
        );

    backdrop-filter:blur(18px);
}

.top-left{
    display:flex;
    align-items:center;

    gap:9px;

    min-width:0;
}

.chat-title{
    min-width:0;

    font-size:15px;
    font-weight:900;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.top-actions{
    display:flex;
    gap:7px;
}

.icon-button{
    width:38px;
    height:38px;

    display:grid;
    place-items:center;

    border-radius:11px;

    background:var(--bg-card);

    border:1px solid var(--border);

    color:var(--text-soft);

    cursor:pointer;

    transition:all var(--transition);
}

.icon-button:hover{
    color:var(--accent);
    border-color:var(--accent);

    transform:translateY(-1px);
}

.mobile-sidebar-button{
    display:none;
}

/* =========================
   CHAT AREA
========================= */

.chat-area{
    flex:1;

    overflow-y:auto;

    padding:
        30px
        20px
        20px;
}

.chat-area::-webkit-scrollbar{
    width:6px;
}

.chat-area::-webkit-scrollbar-thumb{
    background:var(--border);
    border-radius:20px;
}

/* welcome */

.welcome{
    width:min(760px,100%);

    margin:auto;

    padding:25px 15px;

    text-align:center;
}

.welcome-logo{
    width:78px;
    height:78px;

    margin:0 auto 20px;

    display:grid;
    place-items:center;

    border-radius:24px;

    color:var(--accent);

    font-size:34px;
    font-weight:950;

    background:
        linear-gradient(
            135deg,
            var(--accent-soft),
            rgba(255,255,255,.035)
        );

    border:1px solid rgba(142,231,255,.13);

    box-shadow:
        0 0 50px rgba(142,231,255,.07);
}

.welcome h1{
    margin:0 0 9px;

    font-size:30px;
    font-weight:950;

    letter-spacing:-.5px;
}

.welcome p{
    margin:0;

    color:var(--text-soft);

    font-size:14px;
    line-height:1.9;
}

.welcome-hints{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;

    margin-top:27px;
}

.hint{
    padding:16px;

    border-radius:16px;

    background:var(--bg-card);

    border:1px solid var(--border);

    text-align:right;

    color:var(--text-soft);

    font-size:12px;

    line-height:1.75;

    transition:all var(--transition);
}

.hint:hover{
    border-color:rgba(142,231,255,.3);

    transform:translateY(-2px);
}

.hint b{
    display:block;

    margin-bottom:5px;

    color:var(--text-main);

    font-size:13px;
}

/* messages */

.messages{
    width:min(900px,100%);

    margin:0 auto;

    display:flex;
    flex-direction:column;

    gap:17px;
}

.message{
    display:flex;

    align-items:flex-end;

    gap:10px;

    max-width:88%;
}

.message.user{
    align-self:flex-start;

    flex-direction:row-reverse;
}

.message.bot{
    align-self:flex-end;
}

.message-avatar{
    width:32px;
    height:32px;

    min-width:32px;

    display:grid;
    place-items:center;

    border-radius:10px;

    background:var(--accent-soft);

    color:var(--accent);

    font-size:11px;
    font-weight:950;
}

.message-content{
    padding:11px 14px;

    border-radius:17px;

    background:var(--bg-card);

    border:1px solid var(--border);

    color:var(--text-main);

    font-size:14px;

    line-height:1.9;

    word-break:break-word;

    box-shadow:
        0 6px 24px rgba(0,0,0,.07);
}

.message.user .message-content{
    background:var(--accent-soft);

    border-color:
        rgba(142,231,255,.15);
}

.message-meta{
    margin-top:4px;

    color:var(--text-muted);

    font-size:9px;
}

/* =========================
   COMPOSER
========================= */

.composer-wrap{
    padding:
        10px
        20px
        18px;
}

.composer{
    width:min(900px,100%);

    margin:0 auto;

    padding:10px;

    border-radius:20px;

    background:var(--bg-input);

    border:1px solid var(--border);

    box-shadow:
        0 12px 45px rgba(0,0,0,.16);
}

.composer textarea{
    width:100%;

    min-height:54px;
    max-height:180px;

    resize:none;

    padding:8px;

    border:0;
    outline:0;

    background:transparent;

    color:var(--text-main);

    font-family:inherit;

    font-size:14px;

    line-height:1.8;
}

.composer textarea::placeholder{
    color:var(--text-muted);
}

.composer-bottom{
    display:flex;

    align-items:center;
    justify-content:space-between;

    padding-top:7px;
}

.composer-tools{
    display:flex;
    gap:6px;
}

.composer-button{
    width:38px;
    height:38px;

    display:grid;
    place-items:center;

    border-radius:11px;

    background:var(--bg-card);

    border:1px solid var(--border);

    color:var(--text-soft);

    cursor:pointer;

    transition:all var(--transition);
}

.composer-button:hover{
    color:var(--accent);
    border-color:var(--accent);

    transform:translateY(-1px);
}

.send-button{
    width:42px;
    height:42px;

    display:grid;
    place-items:center;

    border-radius:13px;

    background:var(--accent);

    color:#06101b;

    cursor:pointer;

    font-size:17px;
    font-weight:950;

    transition:all var(--transition);
}

.send-button:hover{
    transform:translateY(-1px);
    filter:brightness(1.07);
}

/* =========================
   CONTENT PAGES
========================= */

.content-page{
    flex:1;

    overflow-y:auto;

    padding:34px 25px;
}

.page-inner{
    width:min(940px,100%);
    margin:0 auto;
}

.page-title{
    margin:0 0 7px;

    font-size:28px;
    font-weight:950;
}

.page-description{
    margin:0 0 25px;

    color:var(--text-soft);

    font-size:14px;

    line-height:1.9;
}

.cards{
    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(190px,1fr));

    gap:13px;
}

.card{
    padding:18px;

    border-radius:17px;

    background:var(--bg-card);

    border:1px solid var(--border);

    transition:all var(--transition);
}

.card:hover{
    transform:translateY(-2px);

    border-color:
        rgba(142,231,255,.32);
}

.card-icon{
    margin-bottom:12px;

    font-size:24px;
}

.card-title{
    margin-bottom:5px;

    font-weight:900;
}

.card-text{
    color:var(--text-soft);

    font-size:12px;

    line-height:1.75;
}

.empty{
    padding:35px;

    border-radius:18px;

    border:1px dashed var(--border);

    color:var(--text-muted);

    text-align:center;
}

/* =========================
   FORMS
========================= */

.primary-button,
.secondary-button{
    padding:11px 17px;

    border-radius:12px;

    cursor:pointer;

    font-weight:900;
}

.primary-button{
    background:var(--accent);
    color:#06101b;
}

.secondary-button{
    background:var(--bg-card-2);

    border:1px solid var(--border);

    color:var(--text-soft);
}

.form-input,
.form-textarea,
.search-input{
    width:100%;

    padding:12px 14px;

    margin-bottom:10px;

    border-radius:12px;

    background:var(--bg-input);

    border:1px solid var(--border);

    color:var(--text-main);

    outline:none;
}

.form-input:focus,
.form-textarea:focus,
.search-input:focus{
    border-color:var(--accent);
}

.form-textarea{
    min-height:110px;
    resize:vertical;
}

/* =========================
   MODAL
========================= */

.modal-backdrop{
    position:fixed;

    inset:0;

    display:none;
    align-items:center;
    justify-content:center;

    padding:14px;

    background:rgba(0,0,0,.64);

    backdrop-filter:blur(8px);

    z-index:100;
}

.modal-backdrop.show{
    display:flex;
}

.modal{
    width:min(570px,100%);

    max-height:88vh;

    overflow:auto;

    padding:21px;

    border-radius:21px;

    background:var(--bg-card);

    border:1px solid var(--border);

    box-shadow:
        0 30px 100px rgba(0,0,0,.5);
}

.modal-header{
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:10px;

    margin-bottom:18px;
}

.modal-title{
    font-size:18px;
    font-weight:950;
}

.close-button{
    width:35px;
    height:35px;

    border-radius:10px;

    background:transparent;

    border:1px solid var(--border);

    color:var(--text-soft);

    cursor:pointer;
}

/* =========================
   SETTINGS
========================= */

.setting-group{
    margin-bottom:23px;
}

.setting-title{
    margin-bottom:8px;

    font-size:13px;
    font-weight:950;
}

.setting-buttons{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:8px;
}

.setting-option,
.language-option{
    padding:11px 8px;

    border-radius:11px;

    background:var(--bg-card-2);

    border:1px solid var(--border);

    color:var(--text-soft);

    cursor:pointer;

    text-align:center;

    font-size:12px;
}

.setting-option:hover,
.setting-option.active,
.language-option:hover,
.language-option.active{
    color:var(--accent);

    border-color:var(--accent);

    background:var(--accent-soft);
}

.language-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:8px;
}

.color-row{
    display:flex;

    align-items:center;
    justify-content:space-between;

    padding:8px 0;

    color:var(--text-soft);

    font-size:12px;
}

.color-row input{
    width:48px;
    height:30px;

    padding:0;

    border:0;

    background:transparent;

    cursor:pointer;
}

/* =========================
   POPUP
========================= */

.menu-pop{
    position:fixed;

    min-width:185px;

    display:none;

    padding:7px;

    border-radius:14px;

    background:var(--bg-card);

    border:1px solid var(--border);

    box-shadow:
        0 25px 70px rgba(0,0,0,.4);

    z-index:120;
}

.menu-pop.show{
    display:block;
}

.menu-pop button{
    display:block;

    width:100%;

    padding:10px;

    border-radius:9px;

    background:transparent;

    color:var(--text-soft);

    cursor:pointer;

    text-align:right;
}

.menu-pop button:hover{
    background:var(--accent-soft);
    color:var(--accent);
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;

    left:50%;
    bottom:24px;

    transform:
        translateX(-50%)
        translateY(20px);

    padding:11px 15px;

    border-radius:12px;

    background:var(--bg-card);

    border:1px solid var(--border);

    color:var(--text-main);

    font-size:12px;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    z-index:200;
}

.toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:750px){

    .sidebar{
        position:fixed;

        right:0;
        top:0;
        bottom:0;

        box-shadow:
            -18px 0 50px rgba(0,0,0,.35);
    }

    [dir="ltr"] .sidebar{
        right:auto;
        left:0;

        box-shadow:
            18px 0 50px rgba(0,0,0,.35);
    }

    .sidebar.collapsed{
        width:0;
        min-width:0;

        border:0;
    }

    .sidebar.collapsed > *{
        display:none;
    }

    .mobile-sidebar-button{
        display:grid;
    }

    .topbar{
        padding:0 11px;
    }

    .chat-area{
        padding:20px 10px;
    }

    .composer-wrap{
        padding:
            8px
            10px
            12px;
    }

    .welcome{
        padding:15px 5px;
    }

    .welcome h1{
        font-size:25px;
    }

    .welcome-hints{
        grid-template-columns:1fr;
    }

    .message{
        max-width:95%;
    }

    .top-actions .hide-mobile{
        display:none;
    }
}

[dir="ltr"] .profile-button,
[dir="ltr"] .profile-menu button,
[dir="ltr"] .side-button,
[dir="ltr"] .recent-chat,
[dir="ltr"] .hint,
[dir="ltr"] .menu-pop button{
    text-align:left;
}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->

<aside class="sidebar" id="sidebar">

    <div class="sidebar-top">

        <div class="brand">

/* =========================
   STATE
========================= */

let currentLanguage =
    localStorage.getItem("novy-language") || "fa";

let currentTheme =
    localStorage.getItem("novy-theme") || "navy";

let sidebarCollapsed =
    localStorage.getItem("novy-sidebar-collapsed") === "1";

let chats =
    JSON.parse(
        localStorage.getItem("novy-chats") || "[]"
    );

let projects =
    JSON.parse(
        localStorage.getItem("novy-projects") || "[]"
    );

let currentChatId =
    localStorage.getItem("novy-current-chat") || null;

let currentPage = "chat";


/* =========================
   HELPERS
========================= */

const $ = id =>
    document.getElementById(id);

const t = () =>
    translations[currentLanguage] ||
    translations.fa;


function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function hexToRgba(hex,alpha){

    const clean =
        hex.replace("#","");

    const full =
        clean.length === 3
            ? clean.split("").map(x=>x+x).join("")
            : clean;

    const number =
        parseInt(full,16);

    const r =
        (number >> 16) & 255;

    const g =
        (number >> 8) & 255;

    const b =
        number & 255;

    return `rgba(${r},${g},${b},${alpha})`;
}


/* =========================
   THEME
========================= */

function applyTheme(name){

    const theme =
        themePresets[name] ||
        themePresets.navy;

    currentTheme = name;

    localStorage.setItem(
        "novy-theme",
        name
    );

    document.documentElement.style.setProperty(
        "--bg-main",
        theme.bg
    );

    document.documentElement.style.setProperty(
        "--bg-sidebar",
        theme.panel
    );

    document.documentElement.style.setProperty(
        "--bg-card",
        theme.card
    );

    document.documentElement.style.setProperty(
        "--bg-card-2",
        theme.card2
    );

    document.documentElement.style.setProperty(
        "--bg-input",
        theme.input
    );

    document.documentElement.style.setProperty(
        "--text-main",
        theme.text
    );

    document.documentElement.style.setProperty(
        "--text-soft",
        theme.soft
    );

    document.documentElement.style.setProperty(
        "--text-muted",
        theme.muted
    );

    document.documentElement.style.setProperty(
        "--accent",
        theme.accent
    );

    document.documentElement.style.setProperty(
        "--accent-soft",
        hexToRgba(theme.accent,.12)
    );
}


function applyCustomTheme(){

    const saved =
        JSON.parse(
            localStorage.getItem(
                "novy-custom-theme"
            ) || "null"
        );

    if(!saved){
        applyTheme("navy");
        return;
    }

    currentTheme = "custom";

    localStorage.setItem(
        "novy-theme",
        "custom"
    );

    const map = {
        bg:"--bg-main",
        panel:"--bg-sidebar",
        card:"--bg-card",
        card2:"--bg-card-2",
        input:"--bg-input",
        text:"--text-main",
        soft:"--text-soft",
        muted:"--text-muted",
        accent:"--accent"
    };

    Object.entries(saved)
        .forEach(([key,value])=>{

            if(map[key]){

                document.documentElement.style.setProperty(
                    map[key],
                    value
                );
            }
        });

    document.documentElement.style.setProperty(
        "--accent-soft",
        hexToRgba(
            saved.accent || "#8ee7ff",
            .12
        )
    );
}


function loadSavedTheme(){

    if(currentTheme === "custom"){

        applyCustomTheme();

    }else{

        applyTheme(currentTheme);
    }
}


/* =========================
   LANGUAGE
========================= */

function setLanguage(language){

    if(!LANGUAGES.includes(language)){
        language = "fa";
    }

    currentLanguage = language;

    localStorage.setItem(
        "novy-language",
        language
    );

    document.documentElement.lang =
        language;

    const rtl =
        language === "fa" ||
        language === "ar";

    document.documentElement.dir =
        rtl ? "rtl" : "ltr";

    document.body.classList.toggle(
        "ltr",
        !rtl
    );

    document
        .querySelectorAll("[data-i18n]")
        .forEach(element=>{

            const key =
                element.dataset.i18n;

            if(t()[key] !== undefined){

                element.textContent =
                    t()[key];
            }
        });


    document
        .querySelectorAll(
            "[data-i18n-placeholder]"
        )
        .forEach(element=>{

            const key =
                element.dataset.i18nPlaceholder;

            if(t()[key] !== undefined){

                element.placeholder =
                    t()[key];
            }
        });

    renderRecentChats();

    if(currentPage === "chat"){
        renderChat();
    }

    if(currentPage === "projects"){
        renderProjectsPage();
    }

    if(currentPage === "images"){
        renderImagesPage();
    }

    if(currentPage === "library"){
        renderLibraryPage();
    }

    if(currentPage === "code"){
        renderCodePage();
    }
}


/* =========================
   SIDEBAR
========================= */

function toggleSidebar(force){

    sidebarCollapsed =
        typeof force === "boolean"
            ? force
            : !sidebarCollapsed;

    $("sidebar")
        .classList
        .toggle(
            "collapsed",
            sidebarCollapsed
        );

    $("sidebarToggle")
        .textContent =
            sidebarCollapsed
                ? "›"
                : "‹";

    localStorage.setItem(
        "novy-sidebar-collapsed",
        sidebarCollapsed
            ? "1"
            : "0"
    );
}

========================= */

function saveChats(){

    localStorage.setItem(
        "novy-chats",
        JSON.stringify(chats)
    );
}


function saveProjects(){

    localStorage.setItem(
        "novy-projects",
        JSON.stringify(projects)
    );
}

    return chats.find(
        chat =>
            chat.id === currentChatId
    ) || null;
}


function createNewChat(projectId=null){

    const id =
        "chat_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .slice(2,8);

    const chat = {

        id,

        title:t().newChat,

        messages:[],

        projectId,

        createdAt:Date.now()
    };

    chats.unshift(chat);

    currentChatId = id;

    localStorage.setItem(
        "novy-current-chat",
        id
    );

    saveChats();

    showPage("chat");

    renderChat();

    renderRecentChats();

    setTimeout(()=>{
        $("messageInput").focus();
    },50);

    return chat;
}

========================= */

function renderChat(){

    const chat =
        getCurrentChat();

    const messages =
        $("messages");

    messages.innerHTML = "";

    $("welcome").style.display =
        chat &&
        chat.messages.length
            ? "none"
            : "block";

    $("chatTitle").textContent =
        chat
            ? chat.title
            : "Novy";

    if(!chat){
        return;
    }

    chat.messages
        .forEach(message =>
            renderMessage(message)
        );

    setTimeout(()=>{

        $("chatArea").scrollTop =
            $("chatArea").scrollHeight;

    },0);
}


/* =========================
   MESSAGE
========================= */

function renderMessage(message){

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message " +
        (
            message.role === "user"
                ? "user"
                : "bot"
        );


    const avatar =
        document.createElement("div");

    avatar.className =
        "message-avatar";

    avatar.textContent =
        message.role === "user"
            ? "●"
            : "✦";


    const contentBox =
        document.createElement("div");


    const content =
        document.createElement("div");

    content.className =
        "message-content";

    content.textContent =
        message.content;


    contentBox.appendChild(content);


    if(message.time){

        const meta =
            document.createElement("div");

        meta.className =
            "message-meta";

        meta.textContent =
            new Date(
                message.time
            ).toLocaleTimeString(
                currentLanguage,
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

        contentBox.appendChild(meta);
    }


    wrapper.appendChild(avatar);
    wrapper.appendChild(contentBox);

    $("messages")
        .appendChild(wrapper);
}


/* =========================
   SEND MESSAGE
========================= */

function sendMessage(){

    const input =
        $("messageInput");

    const text =
        input.value.trim();

    if(!text){
        return;
    }

    let chat =
        getCurrentChat();

    if(!chat){

        chat =
            createNewChat();
    }


    if(
        chat.title === t().newChat
    ){

        chat.title =
            text.length > 34
                ? text.slice(0,34) + "…"
                : text;
    }


    chat.messages.push({

        role:"user",

        content:text,

        time:Date.now()
    });


    saveChats();

    renderChat();

    renderRecentChats();

    input.value = "";

    autoResizeTextarea();


    /*
       AI CONNECTION COMES LATER
    */

    setTimeout(()=>{

        const current =
            getCurrentChat();

        if(
            !current ||
            current.id !== chat.id
        ){
            return;
        }

        chat.messages.push({

            role:"bot",

            content:t().aiUnavailable,

            time:Date.now()
        });

        saveChats();

        renderChat();

    },350);
}


function autoResizeTextarea(){

    const input =
        $("messageInput");

    input.style.height =
        "auto";

    input.style.height =
        Math.min(
            input.scrollHeight,
            180
        ) + "px";
}

            id="searchResults"
        ></div>

    `);


    $("closeSearch")
        .onclick =
        closeModal;


    const input =
        $("globalSearchInput");


    input.oninput = () =>
        performSearch(
            input.value
        );


    input.focus();

    performSearch("");

function performSearch(query){

    const q =
        query
            .trim()
            .toLowerCase();


    const results =
        chats.filter(chat=>{

            if(!q){
                return true;
            }


            if(
                chat.title
                    .toLowerCase()
                    .includes(q)
            ){
                return true;
            }


            return chat.messages.some(
                message =>
                    message.content
                        .toLowerCase()
                        .includes(q)
            );

        });


    if(!results.length){

        $("searchResults")
            .innerHTML = `

                <div class="empty">
                    ${t().noResults}
                </div>

            `;

        return;
    }


    $("searchResults")
        .innerHTML = results
            .map(chat=>`

                <div
                    class="card"
                    data-search-chat="${chat.id}"
                    style="
                        margin-bottom:8px;
                        cursor:pointer;
                    "
                >

                    <div class="card-title">
                        ${escapeHtml(
                            chat.title
                        )}
                    </div>

                    <div class="card-text">
                        ${chat.messages.length}
                    </div>

                </div>

            `)
            .join("");


    document
        .querySelectorAll(
            "[data-search-chat]"
        )
        .forEach(card=>{

            card.onclick = () => {

                const id =
                    card.dataset.searchChat;

                closeModal();

                openChat(id);
            };

        });
}

    /* =========================
   CHAT ACTIONS
========================= */

function handleChatAction(
    action,
    chat
){

    if(action === "rename"){

        openModal(`

            <div class="modal-header">

                <div class="modal-title">
                    ${t().renameChat}
                </div>

                <button
                    class="close-button"
                    id="closeRename"
                >
                    ×
                </button>

            </div>


            <input
                class="form-input"
                id="renameInput"
                value="${escapeHtml(chat.title)}"
            >


            <button
                class="primary-button"
                id="saveRename"
            >
                ${t().save}
            </button>

        `);


        $("closeRename")
            .onclick =
            closeModal;


        $("saveRename")
            .onclick = () => {

                const name =
                    $("renameInput")
                        .value
                        .trim();


                if(!name){
                    return;
                }


                chat.title =
                    name;

                saveChats();

                renderChat();

                renderRecentChats();

                closeModal();

                showToast(
                    t().chatRenamed
                );
            };

        return;
    }


    if(action === "delete"){

        if(
            !confirm(
                t().confirmDelete
            )
        ){
            return;
        }


        chats =
            chats.filter(
                item =>
                    item.id !== chat.id
            );


        saveChats();


        currentChatId =
            null;

        localStorage.removeItem(
            "novy-current-chat"
        );


        if(chats.length){

            currentChatId =
                chats[0].id;

            localStorage.setItem(
                "novy-current-chat",
                currentChatId
            );

            renderChat();

        }else{

            createNewChat();
        }


        renderRecentChats();

        return;
    }


    if(action === "share"){

        const url =
            location.href.split("#")[0] +
            "#chat=" +
            chat.id;


        if(
            navigator.clipboard &&
            navigator.clipboard.writeText
        ){

            navigator.clipboard.writeText(
                url
            );

        }


        showToast(
            t().copied
        );

        return;
    }


    if(action === "move"){

        if(!projects.length){

            showPage("projects");

            showToast(
                t().noProjects
            );

            return;
        }


        openModal(`

            <div class="modal-header">

                <div class="modal-title">
                    ${t().moveProject}
                </div>

                <button
                    class="close-button"
                    id="closeMove"
                >
                    ×
                </button>

            </div>


            ${projects
                .map(project=>`

                    <button
                        class="recent-chat"
                        data-move-project="${project.id}"
                    >
                        📁
                        ${escapeHtml(
                            project.name
                        )}
                    </button>

                `)
                .join("")}

        `);


        $("closeMove")
            .onclick =
            closeModal;


        document
            .querySelectorAll(
                "[data-move-project]"
            )
            .forEach(button=>{

                button.onclick = () => {

                    chat.projectId =
                        button.dataset
                            .moveProject;

                    saveChats();

                    closeModal();
                };

            });
    }
}

async function loadUser(){

    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .getSession();


    if(error){

        console.error(error);

        return null;
    }


    const session =
        data.session;


    if(!session){

        location.href =
            "login.html";

        return null;
    }


    const user =
        session.user;


    const metadata =
        user.user_metadata || {};


    const name =
        metadata.name ||
        metadata.username ||
        user.email
            ?.split("@")[0] ||
        "Novy";


    $("profileName")
        .textContent =
        name;


    $("profileEmail")
        .textContent =
        user.email || "";


    if(metadata.avatar_url){

        const avatar =
            $("profileAvatar");


        avatar.outerHTML = `

            <img
                class="profile-avatar"
                id="profileAvatar"
                src="${metadata.avatar_url}"
                alt=""
            >

        `;

    }else{

        $("profileAvatar")
            .textContent =
            name
                .slice(0,1)
                .toUpperCase();
    }


    return user;
}


/* =========================
   EVENTS
========================= */

$("sidebarToggle")
    .onclick = () =>
        toggleSidebar();


$("mobileSidebar")
    .onclick = () =>
        toggleSidebar();


$("newChatBtn")
    .onclick = () =>
        createNewChat();


document
    .querySelectorAll(
        ".side-button[data-page]"
    )
    .forEach(button=>{

        button.onclick = () =>
            showPage(
                button.dataset.page
            );

    });


$("searchBtn")
    .onclick =
    openSearch;


$("topSearch")
    .onclick =
    openSearch;


$("profileButton")
    .onclick = () => {

        $("profileMenu")
            .classList
            .toggle("show");

    };


$("openProfile")
    .onclick = () => {

        location.href =
            "profile.html";

    };


$("openSettings")
    .onclick = () => {

        $("profileMenu")
            .classList
            .remove("show");

        openSettings();

    };


$("sendBtn")
    .onclick =
    sendMessage;


$("messageInput")
    .addEventListener(
        "input",
        autoResizeTextarea
    );


$("messageInput")
    .addEventListener(
        "keydown",
        event => {

            if(
                event.key === "Enter" &&
                !event.shiftKey
            ){

                event.preventDefault();

                sendMessage();
            }

        }
    );


$("fileBtn")
    .onclick = () =>
        $("fileInput").click();


$("imageBtn")
    .onclick = () =>
        $("imageInput").click();


$("libraryBtn")
    .onclick = () =>
        showToast(
            t().librarySoon
        );


$("voiceBtn")
    .onclick = () =>
        showToast(
            t().voiceSoon
        );


$("fileInput")
    .onchange = event => {

        const file =
            event.target.files[0];


        if(!file){
            return;
        }


        let chat =
            getCurrentChat();


        if(!chat){
            chat =
                createNewChat();
        }


        chat.messages.push({

            role:"user",

            content:
                `${t().sentFile}: ${file.name}`,

            time:Date.now()

        });


        saveChats();

        renderChat();

        event.target.value = "";
    };


$("imageInput")
    .onchange = event => {

        const file =
            event.target.files[0];


        if(!file){
            return;
        }


        let chat =
            getCurrentChat();


        if(!chat){
            chat =
                createNewChat();
        }


        chat.messages.push({

            role:"user",

            content:
                `${t().sentImage}: ${file.name}`,

            time:Date.now()

        });


        saveChats();

        renderChat();

        event.target.value = "";
    };


$("topMenu")
    .onclick =
    openChatMenu;


$("modalBackdrop")
    .addEventListener(
        "click",
        event => {

            if(
                event.target.id ===
                "modalBackdrop"
            ){

                closeModal();
            }

        }
    );


document.addEventListener(
    "click",
    event => {

        if(
            !event.target.closest(
                "#chatMenu"
            ) &&
            !event.target.closest(
                "#topMenu"
            )
        ){

            $("chatMenu")
                .classList
                .remove("show");
        }


        if(
            !event.target.closest(
                ".profile-box"
            )
        ){

            $("profileMenu")
                .classList
                .remove("show");
        }

    }
);


/* =========================
   STARTUP
========================= */

loadSavedTheme();

setLanguage(
    currentLanguage
);

toggleSidebar(
    sidebarCollapsed
);

renderRecentChats();


if(
    currentChatId &&
    !getCurrentChat()
){

    currentChatId =
        null;

    localStorage.removeItem(
        "novy-current-chat"
    );
}


if(!currentChatId){

    createNewChat();

}else{

    renderChat();
}


loadUser();


/* =========================
   HASH CHAT
========================= */

const hash =
    location.hash;


if(
    hash.startsWith("#chat=")
){

    const id =
        hash.slice(6);


    if(
        chats.some(
            chat =>
                chat.id === id
        )
    ){

        openChat(id);
    }
}

</script>

</body>
</html>

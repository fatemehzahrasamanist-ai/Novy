        .login-page-submit span {

        /* ==================== Mobile ==================== */

</head>

<body>

<div class="login-page">

    <div class="login-page-box">

        <!-- Back -->
        <div class="login-page-top">
            <button
                class="login-back"
                id="loginBack"

        <!-- Logo -->
        <div class="login-page-logo">

            <div class="login-page-logo-mark">
                ن

            <h1 data-i18n="loginTitle">
                ورود به نووی
            </h1>

            <p data-i18n="loginDescription">
                برای شروع، اطلاعاتت رو وارد کن.
            </p>

        </div>


        <!-- ==================== Step 1: Contact ==================== -->

        <div class="login-step active" id="step1">

            <div class="login-input-group">

                <label
                    for="loginContact"
                    data-i18n="contactLabel">
                    ایمیل یا شماره موبایل
                </label>

                <input
                    id="loginContact"
                    type="text"
                    autocomplete="email"
                    data-i18n-placeholder="contactPlaceholder"
                    placeholder="ایمیل یا شماره موبایل">

            </div>

            <button
                class="login-page-submit"
                id="step1Button"
                type="button"
                data-i18n="continue">
                ادامه
            </button>

        </div>


        <!-- ==================== Step 2: Verification ==================== -->

        <div class="login-step" id="verificationStep">

            <p
                class="verification-description"
                data-i18n="verificationDescription">
                کد تأیید ارسال‌شده را وارد کن.
            </p>

            <div class="login-input-group">

                <label
                    data-i18n="verificationLabel">
                    کد تأیید
                </label>

                <div class="verification-inputs">

                    <input
                        class="verification-digit"
                        type="text"
                        inputmode="numeric"
                        maxlength="1"
                        autocomplete="one-time-code">

                    <input
                        class="verification-digit"
                        type="text"
                        inputmode="numeric"
                        maxlength="1">

                    <input
                        class="verification-digit"
                        type="text"
                        inputmode="numeric"
                        maxlength="1">

                    <input

                        inputmode="numeric"
                        maxlength="1">

                    <input

                </div>

            </div>

            <button

        <div class="login-step" id="passwordStep">

            <div class="login-input-group">

                <p

        <div class="login-step" id="step2">

<script>

    /* ==================== Translations ==================== */

    const translations = {

        fa: {
            pageTitle: "ورود به نووی",
            back: "← بازگشت",

            loginTitle: "ورود به نووی",
            loginDescription: "برای شروع، اطلاعاتت رو وارد کن.",

            contactLabel: "ایمیل یا شماره موبایل",
            contactPlaceholder: "ایمیل یا شماره موبایل",

            continue: "ادامه",

            verificationDescription: "کد تأیید ارسال‌شده را وارد کن.",
            verificationLabel: "کد تأیید",
            verify: "تأیید",

            passwordDescription: "یک رمز عبور برای حساب نووی خودت بساز.",
            passwordLabel: "رمز عبور",
            passwordPlaceholder: "رمز عبور خودت را بساز",
            confirmPasswordLabel: "تکرار رمز عبور",
            confirmPasswordPlaceholder: "رمز عبور را دوباره وارد کن",
            passwordMismatch: "رمزهای عبور یکسان نیستند.",
            passwordRequired: "لطفاً رمز عبور را وارد کن.",

            usernameLabel: "نام کاربری",
            usernamePlaceholder: "یک نام کاربری انتخاب کن",

            nameLabel: "اسم",
            namePlaceholder: "اسمت رو وارد کن",

            profileReady: "پروفایلت آماده‌ست!",
            readyDescription: "حالا می‌تونی وارد نووی بشی.",
            enterNovy: "ورود به نووی"
        },

        en: {
            pageTitle: "Login to Novy",
            back: "← Back",

            loginTitle: "Login to Novy",
            loginDescription: "Enter your information to get started.",

            contactLabel: "Email or phone number",
            contactPlaceholder: "Email or phone number",

            continue: "Continue",

            verificationDescription: "Enter the verification code.",
            verificationLabel: "Verification code",
            verify: "Verify",

            passwordDescription: "Create a password for your Novy account.",
            passwordLabel: "Password",
            passwordPlaceholder: "Create your password",
            confirmPasswordLabel: "Confirm password",
            confirmPasswordPlaceholder: "Enter your password again",
            passwordMismatch: "Passwords do not match.",
            passwordRequired: "Please enter a password.",

            usernameLabel: "Username",
            usernamePlaceholder: "Choose a username",

            nameLabel: "Name",
            namePlaceholder: "Enter your name",

            profileReady: "Your profile is ready!",
            readyDescription: "You can now enter Novy.",
            enterNovy: "Enter Novy"
        },

        ar: {
            pageTitle: "تسجيل الدخول إلى نوفي",
            back: "← رجوع",

            loginTitle: "تسجيل الدخول إلى نوفي",
            loginDescription: "أدخل معلوماتك للبدء.",

            contactLabel: "البريد الإلكتروني أو رقم الهاتف",
            contactPlaceholder: "البريد الإلكتروني أو رقم الهاتف",

            continue: "متابعة",

            verificationDescription: "أدخل رمز التحقق.",
            verificationLabel: "رمز التحقق",
            verify: "تأكيد",

            passwordDescription: "أنشئ كلمة مرور لحسابك في نوفي.",
            passwordLabel: "كلمة المرور",
            passwordPlaceholder: "أنشئ كلمة المرور",
            confirmPasswordLabel: "تأكيد كلمة المرور",
            confirmPasswordPlaceholder: "أدخل كلمة المرور مرة أخرى",
            passwordMismatch: "كلمتا المرور غير متطابقتين.",
            passwordRequired: "يرجى إدخال كلمة المرور.",

            usernameLabel: "اسم المستخدم",
            usernamePlaceholder: "اختر اسم مستخدم",

            nameLabel: "الاسم",
            namePlaceholder: "أدخل اسمك",

            profileReady: "ملفك جاهز!",
            readyDescription: "يمكنك الآن الدخول إلى نوفي.",
            enterNovy: "الدخول إلى نوفي"
        }

    };


    /* ==================== Themes ==================== */

    const themes = {

        navy: {
            "--bg-main": "#061426",
            "--bg-card": "#0b233d",
            "--bg-message": "#0a2038",
            "--text-main": "#f4fbff",
            "--text-muted": "#91b0c2",
            "--accent": "#8ee7ff",
            "--button-text": "#061426",
            "--border": "#1d405d"
        },

        black: {
            "--bg-main": "#050505",
            "--bg-card": "#111111",
            "--bg-message": "#181818",
            "--text-main": "#f5f5f5",
            "--text-muted": "#999999",
            "--accent": "#ffffff",
            "--button-text": "#061426",
            "--border": "#303030"
        },

        ice: {
            "--bg-main": "#eafaff",
            "--bg-card": "#ffffff",
            "--bg-message": "#eefaff",
            "--text-main": "#123044",
            "--text-muted": "#658092",
            "--accent": "#159ac2",
            "--button-text": "#061426",
            "--border": "#b9dce8"
        }

    };


    /* ==================== Theme ==================== */

    function setTheme(themeName) {

        const theme = themes[themeName] || themes.navy;

        Object.entries(theme).forEach(([key, value]) => {
            document.documentElement.style.setProperty(key, value);
        });

        localStorage.setItem("novy-theme", themeName);
    }


    /* ==================== Language ==================== */

    function applyLanguage(lang) {

        const selectedLanguage =
            translations[lang] ? lang : "fa";

        const t = translations[selectedLanguage];

        document.documentElement.lang = selectedLanguage;

        document.documentElement.dir =
            selectedLanguage === "en" ? "ltr" : "rtl";

        document.title = t.pageTitle;

        document.querySelectorAll("[data-i18n]").forEach(element => {

            const key = element.getAttribute("data-i18n");

            if (t[key]) {
                element.textContent = t[key];
            }

        });

        document.querySelectorAll("[data-i18n-placeholder]").forEach(element => {

            const key =
                element.getAttribute("data-i18n-placeholder");

            if (t[key]) {
                element.placeholder = t[key];
            }

        });

        localStorage.setItem(
            "novy-language",
            selectedLanguage
        );
    }


    /* ==================== Load Saved Settings ==================== */

    const savedTheme =
        localStorage.getItem("novy-theme") || "navy";

    const savedLanguage =
        localStorage.getItem("novy-language") || "fa";

    setTheme(savedTheme);
    applyLanguage(savedLanguage);


    /* ==================== Elements ==================== */

    const step1 =
        document.getElementById("step1");

    const verificationStep =
        document.getElementById("verificationStep");

    const passwordStep =
        document.getElementById("passwordStep");

    const step2 =
        document.getElementById("step2");

    const step3 =
        document.getElementById("step3");

    const step4 =
        document.getElementById("step4");


    const step1Button =
        document.getElementById("step1Button");

    const verificationButton =
        document.getElementById("verificationButton");

    const passwordButton =
        document.getElementById("passwordButton");

    const step2Button =
        document.getElementById("step2Button");

    const step3Button =
        document.getElementById("step3Button");


    const loginContact =
        document.getElementById("loginContact");

    const loginPassword =
        document.getElementById("loginPassword");

    const loginPasswordConfirm =
        document.getElementById("loginPasswordConfirm");

    const loginUsername =
        document.getElementById("loginUsername");

    const loginName =
        document.getElementById("loginName");

    const passwordError =
        document.getElementById("passwordError");


    /* ==================== Step 1 ==================== */

    step1Button.addEventListener("click", function() {

        const contact =
            loginContact.value.trim();

        if (!contact) {

            loginContact.focus();

            return;
        }

        step1.classList.remove("active");

        verificationStep.classList.add("active");

        const firstDigit =
            document.querySelector(".verification-digit");

        if (firstDigit) {
            firstDigit.focus();
        }

    });


    /* ==================== Verification ==================== */

    const verificationInputs =
        document.querySelectorAll(".verification-digit");


    verificationInputs.forEach((input, index) => {

        input.addEventListener("input", function() {

            this.value =
                this.value.replace(/\D/g, "").slice(0, 1);

            if (
                this.value &&
                index < verificationInputs.length - 1
            ) {
                verificationInputs[index + 1].focus();
            }

        });


        input.addEventListener("keydown", function(event) {

            if (
                event.key === "Backspace" &&
                !this.value &&
                index > 0
            ) {
                verificationInputs[index - 1].focus();
            }

        });

    });


    verificationButton.addEventListener("click", function() {

        verificationStep.classList.remove("active");

        passwordStep.classList.add("active");

        loginPassword.focus();

    });


    /* ==================== Password Creation ==================== */

    passwordButton.addEventListener("click", function() {

        const password =
            loginPassword.value.trim();

        const confirmPassword =
            loginPasswordConfirm.value.trim();


        if (!password) {

            passwordError.textContent =
                translations[
                    localStorage.getItem("novy-language") || "fa"
                ].passwordRequired;

            passwordError.classList.add("show");

            loginPassword.focus();

            return;
        }


        if (password !== confirmPassword) {

            const currentLanguage =
                localStorage.getItem("novy-language") || "fa";

            passwordError.textContent =
                translations[currentLanguage].passwordMismatch;

            passwordError.classList.add("show");

            loginPasswordConfirm.focus();

            return;
        }


        passwordError.classList.remove("show");


        /*
         * Demo only:
         * The password is stored locally for this prototype.
         * A real login system should NEVER store passwords
         * as plain text in localStorage.
         */

        localStorage.setItem(
            "novyPassword",
            password
        );


        passwordStep.classList.remove("active");

        step2.classList.add("active");

        loginUsername.focus();

    });


    loginPassword.addEventListener("input", function() {
        passwordError.classList.remove("show");
    });

    loginPasswordConfirm.addEventListener("input", function() {
        passwordError.classList.remove("show");
    });


    /* ==================== Username ==================== */

    step2Button.addEventListener("click", function() {

        const username =
            loginUsername.value.trim();

        if (!username) {

            loginUsername.focus();

            return;
        }

        step2.classList.remove("active");

        step3.classList.add("active");

        loginName.focus();

    });


    /* ==================== Name ==================== */

    step3Button.addEventListener("click", function() {

        const name =
            loginName.value.trim();

        if (!name) {

            loginName.focus();

            return;
        }

        step3.classList.remove("active");

        step4.classList.add("active");

    });


    /* ==================== Final Login ==================== */

    document
        .getElementById("loginSubmit")
        .addEventListener("click", function(event) {

            event.preventDefault();


            const contact =
                loginContact.value.trim();

            const password =
                loginPassword.value.trim();

            const username =
                loginUsername.value.trim();

            const name =
                loginName.value.trim();


            localStorage.setItem(
                "novyContact",
                contact
            );

            localStorage.setItem(
                "novyPassword",
                password
            );

            localStorage.setItem(
                "novyUsername",
                username
            );

            localStorage.setItem(
                "novyName",
                name
            );

            localStorage.setItem(
                "novyLoggedIn",
                "true"
            );


            window.location.href =
                "profile.html";

        });


    /* ==================== Back Button ==================== */

    document
        .getElementById("loginBack")
        .addEventListener("click", function() {

            window.location.href =
                "index.html";

        });

</script>

</body>
</html>

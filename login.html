<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ورود به نووی</title>

    <link rel="stylesheet" href="style.css">

    <style>
        html,
        body {
            color: var(--text-main) !important;
        }

        .login-page {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top,
                    rgba(142, 231, 255, 0.10),
                    transparent 45%
                ),
                var(--bg-main) !important;
        }

        .login-page-box {
            position: relative;
            width: min(430px, 100%);
            box-sizing: border-box;
            background: var(--bg-card) !important;
            color: var(--text-main) !important;
            border-color: var(--border) !important;
        }


        /* ==================== دکمه‌ها ==================== */

        .login-page-submit {
            background: var(--accent) !important;
            border: 1px solid var(--accent) !important;

            color: #061426 !important;

            -webkit-text-fill-color: #061426 !important;

            font-weight: 800;
            cursor: pointer;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease,
                box-shadow 0.2s ease;
        }

        .login-page-submit,
        .login-page-submit *,
        .login-page-submit span {
            color: #061426 !important;
            -webkit-text-fill-color: #061426 !important;
        }

        .login-page-submit:hover {
            opacity: 0.9;
            transform: translateY(-1px);

            box-shadow:
                0 6px 18px rgba(0, 0, 0, 0.18);
        }


        /* ==================== ورودی‌ها ==================== */

        .login-step input {
            width: 100%;
            box-sizing: border-box;

            padding: 14px 16px;

            border: 1px solid var(--border) !important;
            border-radius: 14px;

            outline: none;

            background: var(--bg-message) !important;
            color: var(--text-main) !important;

            font-family: inherit;
            font-size: 15px;

            transition: 0.2s;
        }

        .login-step input::placeholder {
            color: var(--text-muted) !important;
            opacity: 1;
        }

        .login-step input:focus {
            background: var(--bg-message) !important;
            color: var(--text-main) !important;

            border-color: var(--accent) !important;

            box-shadow:
                0 0 0 3px rgba(142, 231, 255, 0.10);
        }

        .login-step input:-webkit-autofill,
        .login-step input:-webkit-autofill:hover,
        .login-step input:-webkit-autofill:focus {
            -webkit-text-fill-color: var(--text-main) !important;

            -webkit-box-shadow:
                0 0 0 1000px var(--bg-message) inset !important;

            box-shadow:
                0 0 0 1000px var(--bg-message) inset !important;

            transition:
                background-color 5000s ease-in-out 0s;
        }


        /* ==================== پیام وضعیت ==================== */

        .login-status {
            display: none;

            margin-top: 10px;

            color: var(--text-muted);

            font-size: 13px;
            line-height: 1.8;
        }

        .login-status.show {
            display: block;
        }


        /* ==================== خطای رمز ==================== */

        .password-error {
            display: none;

            margin-top: 8px;

            color: #ff7b7b;

            font-size: 13px;
        }

        .password-error.show {
            display: block;
        }


        /* ==================== دکمه در حال پردازش ==================== */

        .login-page-submit.loading {
            opacity: 0.65;
            pointer-events: none;
        }
    </style>

</head>


<body>

    <main class="login-page">

        <div class="login-page-box">


            <!-- برگشت -->

            <a

                    ایمیل

                <button

                    ادامه

                </button>

            </div>


            <!-- ==================== مرحله تأیید ایمیل ==================== -->

            <div
                class="login-step"
                id="verificationStep"
                style="display: none;"
            >

                <p
                    class="login-page-description"
                    data-i18n="verificationDescription"

                </p>


                <p
                    class="login-status show"

                ></p>


                <button
                    class="login-page-submit"

                </button>

            </div>


            <!-- ==================== مرحله ساخت رمز ==================== -->

            <div
                class="login-step"
                id="passwordStep"
                style="display: none;"
            >

                <p
                    class="login-page-description"
                    data-i18n="passwordDescription"
                >

                </p>


                <label
                    for="loginPassword"

                >
                    رمز عبور
                </label>


                <input
                    type="password"

                    autocomplete="new-password"
                    data-i18n-placeholder="passwordPlaceholder"
                    placeholder="رمز عبور خودت را بساز"
                >


                <br><br>


                <label
                    for="loginPasswordConfirm"
                    data-i18n="confirmPasswordLabel"
                >
                    تکرار رمز عبور
                </label>


                <input
                    type="password"
                    id="loginPasswordConfirm"
                    autocomplete="new-password"
                    data-i18n-placeholder="confirmPasswordPlaceholder"
                    placeholder="رمز عبور را دوباره وارد کن"
                >


                <p
                    class="password-error"
                    id="passwordError"
                ></p>


                <button
                    class="login-page-submit"
                    id="passwordButton"
                    data-i18n="continue"
                >
                    ادامه
                    <span>←</span>
                </button>

            </div>


            <!-- ==================== مرحله ۲ ==================== -->

            <div
                class="login-step"
                id="step2"
                style="display: none;"
            >

                <label
                    for="loginUsername"
                    data-i18n="usernameLabel"
                >
                    نام کاربری
                </label>


                <input
                    type="text"
                    id="loginUsername"
                    autocomplete="username"
                    data-i18n-placeholder="usernamePlaceholder"
                    placeholder="مثلاً novy_user"
                >


                <button
                    class="login-page-submit"
                    id="step2Button"
                    data-i18n="continue"
                >
                    ادامه
                    <span>←</span>
                </button>

            </div>


            <!-- ==================== مرحله ۳ ==================== -->

            <div
                class="login-step"
                id="step3"
                style="display: none;"
            >

                <label
                    for="loginName"
                    data-i18n="nameLabel"
                >
                    نام
                </label>


                <input
                    type="text"
                    id="loginName"
                    data-i18n-placeholder="namePlaceholder"
                    placeholder="مثلاً میوا"
                >


                <button
                    class="login-page-submit"
                    id="step3Button"
                    data-i18n="continue"
                >
                    ادامه
                    <span>←</span>
                </button>

            </div>


            <!-- ==================== مرحله موفقیت ==================== -->

            <div
                class="login-step"
                id="step4"
                style="display: none;"
            >

                <div class="login-success-icon">
                    ✓
                </div>


                <h2 data-i18n="profileReady">
                    پروفایلت آماده‌ست!
                </h2>


                <p
                    class="login-page-description"
                    data-i18n="readyDescription"
                >
                    حالا می‌تونی وارد نووی بشی و شروع کنی.
                </p>


                <button
                    class="login-page-submit"
                    id="loginSubmit"
                    data-i18n="enterNovy"
                >
                    ورود به نووی
                    <span>←</span>
                </button>

            </div>


        </div>

    </main>

                usernameLabel: "اسم المستخدم",

                profileReady:

                enterNovy:

                invalidEmail:

                emailError:
                    "تعذر إرسال رابط تسجيل الدخول. حاول مرة أخرى.",
                authError:
                    "فشلت المصادقة. حاول مرة أخرى.",
                passwordError:
                    "تعذر إنشاء كلمة المرور.",
                profileError:
                    "تعذر حفظ معلومات ملفك الشخصي."
            }

        };


        /* ==================== تم‌ها ==================== */

        const themes = {

            navy: {
                "--bg-main": "#061426",
                "--bg-card": "#0b233d",
                "--bg-message": "#0a2038",
                "--text-main": "#f4fbff",
                "--text-muted": "#91b0c2",
                "--accent": "#8ee7ff",
                "--button-text": "#061426",
                "--border": "#1d405d"
            },

            black: {
                "--bg-main": "#050505",
                "--bg-card": "#111111",
                "--bg-message": "#181818",
                "--text-main": "#f5f5f5",
                "--text-muted": "#999999",
                "--accent": "#ffffff",
                "--button-text": "#061426",
                "--border": "#303030"
            },

            ice: {
                "--bg-main": "#eafaff",
                "--bg-card": "#ffffff",
                "--bg-message": "#eefaff",
                "--text-main": "#123044",
                "--text-muted": "#658092",
                "--accent": "#159ac2",
                "--button-text": "#061426",
                "--border": "#b9dce8"
            }

        };


        /* ==================== اعمال تم ==================== */

        function setTheme(themeName) {

            const theme =
                themes[themeName] || themes.navy;

            Object.entries(theme).forEach(
                ([property, value]) => {

                    document.documentElement.style
                        .setProperty(property, value);

                }
            );

            localStorage.setItem(
                "novy-theme",
                themeName
            );

        }


        /* ==================== اعمال زبان ==================== */

        function applyLanguage(lang) {

            const translation =
                translations[lang] || translations.fa;


            document
                .querySelectorAll("[data-i18n]")
                .forEach(element => {

                    const key =
                        element.dataset.i18n;

                    if (
                        translation[key] !== undefined
                    ) {

                        const span =
                            element.querySelector("span");

                        if (span) {

                            span.textContent = "←";

                            element.childNodes[0].nodeValue =
                                translation[key] + " ";

                        } else {

                            element.textContent =
                                translation[key];

                        }

                    }

                });


            document
                .querySelectorAll("[data-i18n-placeholder]")
                .forEach(element => {

                    const key =
                        element.dataset.i18nPlaceholder;

                    if (
                        translation[key] !== undefined
                    ) {

                        element.placeholder =
                            translation[key];

                    }

                });


            document.documentElement.lang =
                lang;

            document.documentElement.dir =
                lang === "en"
                    ? "ltr"
                    : "rtl";

            document.title =
                translation.pageTitle;

            localStorage.setItem(
                "novy-language",
                lang
            );

        }


        /* ==================== تنظیمات ذخیره‌شده ==================== */

        const savedTheme =
            localStorage.getItem("novy-theme")
            || "navy";

        const savedLanguage =
            localStorage.getItem("novy-language")
            || "fa";


        setTheme(savedTheme);
        applyLanguage(savedLanguage);


        /* ==================== مراحل ==================== */

        const step1 =
            document.getElementById("step1");

        const verificationStep =
            document.getElementById("verificationStep");

        const passwordStep =
            document.getElementById("passwordStep");

        const step2 =
            document.getElementById("step2");

        const step3 =
            document.getElementById("step3");

        const step4 =
            document.getElementById("step4");


        /* ==================== دکمه‌ها ==================== */

        const step1Button =
            document.getElementById("step1Button");

        const verificationButton =
            document.getElementById("verificationButton");

        const passwordButton =
            document.getElementById("passwordButton");

        const step2Button =
            document.getElementById("step2Button");

        const step3Button =
            document.getElementById("step3Button");

        const loginSubmit =
            document.getElementById("loginSubmit");


        /* ==================== ورودی‌ها ==================== */

        const loginContact =
            document.getElementById("loginContact");

        const loginPassword =
            document.getElementById("loginPassword");

        const loginPasswordConfirm =
            document.getElementById("loginPasswordConfirm");

        const loginUsername =
            document.getElementById("loginUsername");

        const loginName =
            document.getElementById("loginName");

        const passwordError =
            document.getElementById("passwordError");

        const contactError =
            document.getElementById("contactError");

        const verificationEmail =
            document.getElementById("verificationEmail");


        /* ==================== ابزارهای کمکی ==================== */

        function getCurrentLanguage() {

            return localStorage.getItem("novy-language")
                || "fa";

        }


        function t(key) {

            const lang =
                getCurrentLanguage();

            return (
                translations[lang]?.[key]
                || translations.fa[key]
                || key
            );

        }


        function showError(element, message) {

            element.textContent =
                message;

            element.classList.add("show");

        }


        function hideError(element) {

            element.textContent = "";

            element.classList.remove("show");

        }


        function setLoading(button, loading) {

            if (loading) {

                button.classList.add("loading");
                button.dataset.originalText =
                    button.innerHTML;

                button.innerHTML =
                    "...";

            } else {

                button.classList.remove("loading");

                if (
                    button.dataset.originalText
                ) {

                    button.innerHTML =
                        button.dataset.originalText;

                }

            }

        }


        function isValidEmail(email) {

            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
                .test(email);

        }


        function showStep(stepToShow) {

            [
                step1,
                verificationStep,
                passwordStep,
                step2,
                step3,
                step4
            ].forEach(step => {

                step.style.display =
                    step === stepToShow
                        ? "flex"
                        : "none";

            });

        }


        /* ==================== مرحله ۱ ==================== */

        step1Button.addEventListener(
            "click",
            async function (event) {

                event.preventDefault();

                hideError(contactError);

                const email =
                    loginContact.value.trim()
                        .toLowerCase();


                if (!isValidEmail(email)) {

                    showError(
                        contactError,
                        t("invalidEmail")
                    );

                    loginContact.focus();

                    return;

                }


                setLoading(
                    step1Button,
                    true
                );


                /*
                 * Supabase برای این حالت Magic Link
                 * ارسال می‌کند.
                 *
                 * لینک کاربر را به همین صفحه
                 * برمی‌گرداند.
                 */

                const redirectUrl =
                    window.location.origin +
                    window.location.pathname;


                const {
                    error
                } =
                    await supabaseClient.auth
                        .signInWithOtp({

                            email: email,

                            options: {

                                shouldCreateUser:
                                    true,

                                emailRedirectTo:
                                    redirectUrl

                            }

                        });


                setLoading(
                    step1Button,
                    false
                );


                if (error) {

                    console.error(
                        "Supabase signInWithOtp error:",
                        error
                    );

                    showError(
                        contactError,
                        t("emailError")
                    );

                    return;

                }


                localStorage.setItem(
                    "novyContact",
                    email
                );


                verificationEmail.textContent =
                    email;


                showStep(
                    verificationStep
                );

            }
        );


        /* ==================== بررسی ورود ==================== */

        verificationButton.addEventListener(
            "click",
            async function (event) {

                event.preventDefault();

                setLoading(
                    verificationButton,
                    true
                );


                const {
                    data,
                    error
                } =
                    await supabaseClient.auth
                        .getSession();


                setLoading(
                    verificationButton,
                    false
                );


                if (error) {

                    console.error(
                        "Supabase session error:",
                        error
                    );

                    alert(
                        t("authError")
                    );

                    return;

                }


                if (
                    data &&
                    data.session
                ) {

                    showStep(
                        passwordStep
                    );

                    loginPassword.focus();

                    return;

                }


                alert(
                    t("loginNotComplete")
                );

            }
        );


        /* ==================== ساخت رمز ==================== */

        passwordButton.addEventListener(
            "click",
            async function (event) {

                event.preventDefault();

                hideError(passwordError);


                const password =
                    loginPassword.value;

                const confirmPassword =
                    loginPasswordConfirm.value;


                if (
                    password.length < 6
                ) {

                    showError(
                        passwordError,
                        t("passwordTooShort")
                    );

                    loginPassword.focus();

                    return;

                }


                if (
                    password !== confirmPassword
                ) {

                    showError(
                        passwordError,
                        t("passwordMismatch")
                    );

                    loginPasswordConfirm.focus();

                    return;

                }


                setLoading(
                    passwordButton,
                    true
                );


                const {
                    error
                } =
                    await supabaseClient.auth
                        .updateUser({

                            password:
                                password

                        });


                setLoading(
                    passwordButton,
                    false
                );


                if (error) {

                    console.error(
                        "Supabase password error:",
                        error
                    );

                    showError(
                        passwordError,
                        t("passwordError")
                    );

                    return;

                }


                /*
                 * مهم:
                 * رمز عبور دیگر در localStorage
                 * ذخیره نمی‌شود.
                 */


                showStep(
                    step2
                );

                loginUsername.focus();

            }
        );


        loginPassword.addEventListener(
            "input",
            function () {

                hideError(
                    passwordError
                );

            }
        );


        loginPasswordConfirm.addEventListener(
            "input",
            function () {

                hideError(
                    passwordError
                );

            }
        );


        /* ==================== نام کاربری ==================== */

        step2Button.addEventListener(
            "click",
            async function (event) {

                event.preventDefault();


                const username =
                    loginUsername.value.trim();


                if (
                    username === ""
                ) {

                    loginUsername.focus();

                    return;

                }


                setLoading(
                    step2Button,
                    true
                );


                const {
                    error
                } =
                    await supabaseClient.auth
                        .updateUser({

                            data: {

                                username:
                                    username

                            }

                        });


                setLoading(
                    step2Button,
                    false
                );


                if (error) {

                    console.error(
                        "Supabase username error:",
                        error
                    );

                    alert(
                        t("profileError")
                    );

                    return;

                }


                showStep(
                    step3
                );

                loginName.focus();

            }
        );


        /* ==================== نام ==================== */

        step3Button.addEventListener(
            "click",
            async function (event) {

                event.preventDefault();


                const name =
                    loginName.value.trim();


                if (
                    name === ""
                ) {

                    loginName.focus();

                    return;

                }


                setLoading(
                    step3Button,
                    true
                );


                const {
                    error
                } =
                    await supabaseClient.auth
                        .updateUser({

                            data: {

                                name:
                                    name

                            }

                        });


                setLoading(
                    step3Button,
                    false
                );


                if (error) {

                    console.error(
                        "Supabase name error:",
                        error
                    );

                    alert(
                        t("profileError")
                    );

                    return;

                }


                showStep(
                    step4
                );

            }
        );


        /* ==================== ورود نهایی ==================== */

        loginSubmit.addEventListener(
            "click",
            async function (event) {

                event.preventDefault();


                const {
                    data,
                    error
                } =
                    await supabaseClient.auth
                        .getSession();


                if (
                    error ||
                    !data ||
                    !data.session
                ) {

                    alert(
                        t("authError")
                    );

                    return;

                }


                /*
                 * اطلاعات غیرحساس را برای استفاده
                 * ساده‌تر در بخش‌های فعلی سایت نگه می‌داریم.
                 *
                 * رمز عبور هرگز ذخیره نمی‌شود.
                 */

                localStorage.setItem(
                    "novyContact",
                    loginContact.value.trim()
                );

                localStorage.setItem(
                    "novyUsername",
                    loginUsername.value.trim()
                );

                localStorage.setItem(
                    "novyName",
                    loginName.value.trim()
                );

                localStorage.setItem(
                    "novyLoggedIn",
                    "true"
                );


                window.location.href =
                    "profile.html";

            }
        );


        /* ==================== تشخیص خودکار ورود ==================== */

        supabaseClient.auth.onAuthStateChange(
            function (event, session) {

                /*
                 * وقتی کاربر روی Magic Link کلیک می‌کند،
                 * Supabase جلسه را ایجاد می‌کند.
                 */

                if (
                    event === "SIGNED_IN" &&
                    session
                ) {

                    const currentStep =
                        [
                            step1,
                            verificationStep,
                            passwordStep,
                            step2,
                            step3,
                            step4
                        ].find(
                            step =>
                                step.style.display !== "none"
                        );


                    /*
                     * اگر کاربر از لینک ایمیل برگشته،
                     * مستقیماً وارد مرحله ساخت رمز می‌شود.
                     */

                    if (
                        currentStep ===
                        verificationStep
                    ) {

                        showStep(
                            passwordStep
                        );

                        loginPassword.focus();

                    }

                }

            }
        );


        /* ==================== بررسی جلسه هنگام باز شدن صفحه ==================== */

        async function checkExistingSession() {

            const {
                data
            } =
                await supabaseClient.auth
                    .getSession();


            if (
                data &&
                data.session
            ) {

                /*
                 * اگر کاربر از Magic Link برگشته
                 * و هنوز اطلاعات پروفایل را کامل نکرده،
                 * مرحله رمز نمایش داده می‌شود.
                 */

                if (
                    !loginUsername.value.trim()
                ) {

                    showStep(
                        passwordStep
                    );

                }

            }

        }


        /*
         * اجرای بررسی جلسه با کمی تأخیر تا
         * Supabase زمان کافی برای تشخیص لینک
         * موجود در URL داشته باشد.
         */

        setTimeout(
            checkExistingSession,
            300
        );

    </script>

</body>

</html>

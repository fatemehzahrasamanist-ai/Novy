<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ورود به نووی</title>

    <link rel="stylesheet" href="style.css">

    <style>
        html,
        body {
            color: var(--text-main) !important;
        }

        .login-page {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top,
                    rgba(142, 231, 255, 0.10),
                    transparent 45%
                ),
                var(--bg-main) !important;
        }

        .login-page-box {
            position: relative;
            width: min(430px, 100%);
            box-sizing: border-box;
            background: var(--bg-card) !important;
            color: var(--text-main) !important;
            border-color: var(--border) !important;
        }


        /* ==================== دکمه‌ها ==================== */

        .login-page-submit {
            background: var(--accent) !important;
            border: 1px solid var(--accent) !important;

            /* متن همه‌ی تم‌ها مشکی */
            color: #061426 !important;

            /* Chrome */
            -webkit-text-fill-color: #061426 !important;

            font-weight: 800;
            cursor: pointer;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease,
                box-shadow 0.2s ease;
        }

        .login-page-submit,
        .login-page-submit *,
        .login-page-submit span {
            color: #061426 !important;
            -webkit-text-fill-color: #061426 !important;
        }

        .login-page-submit:hover {
            opacity: 0.9;
            transform: translateY(-1px);

            box-shadow:
                0 6px 18px rgba(0, 0, 0, 0.18);
        }


        /* ==================== ورودی‌ها ==================== */

        .login-step input {
            width: 100%;
            box-sizing: border-box;

            padding: 14px 16px;

            border: 1px solid var(--border) !important;
            border-radius: 14px;

            outline: none;

            background: var(--bg-message) !important;
            color: var(--text-main) !important;

            font-family: inherit;
            font-size: 15px;

            transition: 0.2s;
        }

        .login-step input::placeholder {
            color: var(--text-muted) !important;
            opacity: 1;
        }

        .login-step input:focus {
            background: var(--bg-message) !important;
            color: var(--text-main) !important;

            border-color: var(--accent) !important;

            box-shadow:
                0 0 0 3px rgba(142, 231, 255, 0.10);
        }

        .login-step input:-webkit-autofill,
        .login-step input:-webkit-autofill:hover,
        .login-step input:-webkit-autofill:focus {
            -webkit-text-fill-color: var(--text-main) !important;

            -webkit-box-shadow:
                0 0 0 1000px var(--bg-message) inset !important;

            box-shadow:
                0 0 0 1000px var(--bg-message) inset !important;

            transition:
                background-color 5000s ease-in-out 0s;
        }


        /* ==================== کد تأیید ==================== */

        .verification-inputs {
            display: flex;
            direction: ltr;
            justify-content: center;

            gap: 8px;

            width: 100%;
            margin: 8px 0 10px;
        }

        .verification-digit {
            width: 48px !important;
            height: 54px;

            padding: 0 !important;

            text-align: center;

            font-size: 20px !important;
            font-weight: 600;

            border-radius: 12px !important;
        }
    </style>

</head>


<body>

    <main class="login-page">

        <div class="login-page-box">


            <!-- برگشت -->

            <a
                href="index.html"
                class="login-back"
                data-i18n="back"
            >
                ← برگشت به نووی
            </a>


            <!-- لوگو -->

            <div class="login-page-logo">
                NOVY
            </div>


            <!-- عنوان -->

            <h1
                id="loginTitle"
                data-i18n="loginTitle"
            >
                ورود به نووی
            </h1>


            <!-- ==================== مرحله ۱ ==================== -->

            <div
                class="login-step"
                id="step1"
            >

                <p
                    class="login-page-description"
                    data-i18n="loginDescription"
                >
                    اطلاعاتت رو وارد کن تا پروفایلت رو بسازیم.
                </p>


                <label
                    for="loginContact"
                    data-i18n="contactLabel"
                >
                    ایمیل یا شماره تلفن
                </label>


                <input
                    type="text"
                    id="loginContact"
                    data-i18n-placeholder="contactPlaceholder"
                    placeholder="ایمیل یا شماره تلفن"
                >


                <button
                    class="login-page-submit"
                    id="step1Button"
                    data-i18n="continue"
                >
                    ادامه
                    <span>←</span>
                </button>

            </div>


            <!-- ==================== مرحله کد تأیید ==================== -->

            <div
                class="login-step"
                id="verificationStep"
                style="display: none;"
            >

                <p
                    class="login-page-description"
                    data-i18n="verificationDescription"
                >
                    کد تأیید برایت ارسال شد.
                </p>


                <label data-i18n="verificationLabel">
                    کد تأیید
                </label>


                <div class="verification-inputs">

                    <input
                        type="text"
                        maxlength="1"
                        inputmode="numeric"
                        class="verification-digit"
                    >

                    <input
                        type="text"
                        maxlength="1"
                        inputmode="numeric"
                        class="verification-digit"
                    >

                    <input
                        type="text"
                        maxlength="1"
                        inputmode="numeric"
                        class="verification-digit"
                    >

                    <input
                        type="text"
                        maxlength="1"
                        inputmode="numeric"
                        class="verification-digit"
                    >

                    <input
                        type="text"
                        maxlength="1"
                        inputmode="numeric"
                        class="verification-digit"
                    >

                    <input
                        type="text"
                        maxlength="1"
                        inputmode="numeric"
                        class="verification-digit"
                    >

                </div>


                <button
                    class="login-page-submit"
                    id="verificationButton"
                    data-i18n="verify"
                >
                    تأیید
                    <span>←</span>
                </button>

            </div>


            <!-- ==================== مرحله ۲ ==================== -->

            <div
                class="login-step"
                id="step2"
                style="display: none;"
            >

                <label
                    for="loginUsername"
                    data-i18n="usernameLabel"
                >
                    نام کاربری
                </label>


                <input
                    type="text"
                    id="loginUsername"
                    data-i18n-placeholder="usernamePlaceholder"
                    placeholder="مثلاً novy_user"
                >


                <button
                    class="login-page-submit"
                    id="step2Button"
                    data-i18n="continue"
                >
                    ادامه
                    <span>←</span>
                </button>

            </div>


            <!-- ==================== مرحله ۳ ==================== -->

            <div
                class="login-step"
                id="step3"
                style="display: none;"
            >

                <label
                    for="loginName"
                    data-i18n="nameLabel"
                >
                    نام
                </label>


                <input
                    type="text"
                    id="loginName"
                    data-i18n-placeholder="namePlaceholder"
                    placeholder="مثلاً میوا"
                >


                <button
                    class="login-page-submit"
                    id="step3Button"
                    data-i18n="continue"
                >
                    ادامه
                    <span>←</span>
                </button>

            </div>


            <!-- ==================== مرحله موفقیت ==================== -->

            <div
                class="login-step"
                id="step4"
                style="display: none;"
            >

                <div class="login-success-icon">
                    ✓
                </div>


                <h2 data-i18n="profileReady">
                    پروفایلت آماده‌ست!
                </h2>


                <p
                    class="login-page-description"
                    data-i18n="readyDescription"
                >
                    حالا می‌تونی وارد نووی بشی و شروع کنی.
                </p>


                <button
                    class="login-page-submit"
                    id="loginSubmit"
                    data-i18n="enterNovy"
                >
                    ورود به نووی
                    <span>←</span>
                </button>

            </div>


        </div>

    </main>


    <script>

        /* ==================== ترجمه‌ها ==================== */

        const translations = {

            fa: {
                pageTitle: "ورود به نووی",
                back: "← برگشت به نووی",
                loginTitle: "ورود به نووی",
                loginDescription: "اطلاعاتت رو وارد کن تا پروفایلت رو بسازیم.",
                contactLabel: "ایمیل یا شماره تلفن",
                contactPlaceholder: "ایمیل یا شماره تلفن",
                continue: "ادامه",
                verificationDescription: "کد تأیید برایت ارسال شد.",
                verificationLabel: "کد تأیید",
                verify: "تأیید",
                usernameLabel: "نام کاربری",
                usernamePlaceholder: "مثلاً novy_user",
                nameLabel: "نام",
                namePlaceholder: "مثلاً میوا",
                profileReady: "پروفایلت آماده‌ست!",
                readyDescription: "حالا می‌تونی وارد نووی بشی و شروع کنی.",
                enterNovy: "ورود به نووی"
            },

            en: {
                pageTitle: "Login to Novy",
                back: "← Back to Novy",
                loginTitle: "Login to Novy",
                loginDescription: "Enter your information to create your profile.",
                contactLabel: "Email or phone number",
                contactPlaceholder: "Email or phone number",
                continue: "Continue",
                verificationDescription: "A verification code was sent to you.",
                verificationLabel: "Verification code",
                verify: "Verify",
                usernameLabel: "Username",
                usernamePlaceholder: "e.g. novy_user",
                nameLabel: "Name",
                namePlaceholder: "e.g. Miwa",
                profileReady: "Your profile is ready!",
                readyDescription: "Now you can enter Novy and get started.",
                enterNovy: "Enter Novy"
            },

            ar: {
                pageTitle: "تسجيل الدخول إلى نوفي",
                back: "← العودة إلى نوفي",
                loginTitle: "تسجيل الدخول إلى نوفي",
                loginDescription: "أدخل معلوماتك لإنشاء ملفك الشخصي.",
                contactLabel: "البريد الإلكتروني أو رقم الهاتف",
                contactPlaceholder: "البريد الإلكتروني أو رقم الهاتف",
                continue: "متابعة",
                verificationDescription: "تم إرسال رمز التحقق إليك.",
                verificationLabel: "رمز التحقق",
                verify: "تأكيد",
                usernameLabel: "اسم المستخدم",
                usernamePlaceholder: "مثلاً novy_user",
                nameLabel: "الاسم",
                namePlaceholder: "مثلاً Miwa",
                profileReady: "ملفك الشخصي جاهز!",
                readyDescription: "يمكنك الآن الدخول إلى نوفي والبدء.",
                enterNovy: "الدخول إلى نوفي"
            }

        };


        /* ==================== تم‌ها ==================== */

        const themes = {

            navy: {
                "--bg-main": "#061426",
                "--bg-card": "#0b233d",
                "--bg-message": "#0a2038",
                "--text-main": "#f4fbff",
                "--text-muted": "#91b0c2",
                "--accent": "#8ee7ff",

                /* متن دکمه: همیشه مشکی */
                "--button-text": "#061426",

                "--border": "#1d405d"
            },

            black: {
                "--bg-main": "#050505",
                "--bg-card": "#111111",
                "--bg-message": "#181818",
                "--text-main": "#f5f5f5",
                "--text-muted": "#999999",
                "--accent": "#ffffff",

                /* متن دکمه: همیشه مشکی */
                "--button-text": "#061426",

                "--border": "#303030"
            },

            ice: {
                "--bg-main": "#eafaff",
                "--bg-card": "#ffffff",
                "--bg-message": "#eefaff",
                "--text-main": "#123044",
                "--text-muted": "#658092",
                "--accent": "#159ac2",

                /* متن دکمه: همیشه مشکی */
                "--button-text": "#061426",

                "--border": "#b9dce8"
            }

        };


        /* ==================== اعمال تم ==================== */

        function setTheme(themeName) {

            const theme =
                themes[themeName] || themes.navy;

            Object.entries(theme).forEach(
                ([property, value]) => {

                    document.documentElement.style
                        .setProperty(property, value);

                }
            );

            localStorage.setItem(
                "novy-theme",
                themeName
            );

        }


        /* ==================== اعمال زبان ==================== */

        function applyLanguage(lang) {

            const translation =
                translations[lang] || translations.fa;


            document
                .querySelectorAll("[data-i18n]")
                .forEach(element => {

                    const key =
                        element.dataset.i18n;

                    if (
                        translation[key] !== undefined
                    ) {

                        const span =
                            element.querySelector("span");

                        if (span) {

                            span.textContent = "←";

                            element.childNodes[0].nodeValue =
                                translation[key] + " ";

                        } else {

                            element.textContent =
                                translation[key];

                        }

                    }

                });


            document
                .querySelectorAll("[data-i18n-placeholder]")
                .forEach(element => {

                    const key =
                        element.dataset.i18nPlaceholder;

                    if (
                        translation[key] !== undefined
                    ) {

                        element.placeholder =
                            translation[key];

                    }

                });


            document.documentElement.lang =
                lang;

            document.documentElement.dir =
                lang === "en"
                    ? "ltr"
                    : "rtl";

            document.title =
                translation.pageTitle;

            localStorage.setItem(
                "novy-language",
                lang
            );

        }


        /* ==================== تنظیمات ذخیره‌شده ==================== */

        const savedTheme =
            localStorage.getItem("novy-theme")
            || "navy";

        const savedLanguage =
            localStorage.getItem("novy-language")
            || "fa";


        setTheme(savedTheme);
        applyLanguage(savedLanguage);


        /* ==================== مراحل ==================== */

        const step1 =
            document.getElementById("step1");

        const verificationStep =
            document.getElementById("verificationStep");

        const step2 =
            document.getElementById("step2");

        const step3 =
            document.getElementById("step3");

        const step4 =
            document.getElementById("step4");


        /* ==================== دکمه‌ها ==================== */

        const step1Button =
            document.getElementById("step1Button");

        const verificationButton =
            document.getElementById("verificationButton");

        const step2Button =
            document.getElementById("step2Button");

        const step3Button =
            document.getElementById("step3Button");


        /* ==================== ورودی‌ها ==================== */

        const loginContact =
            document.getElementById("loginContact");

        const loginUsername =
            document.getElementById("loginUsername");

        const loginName =
            document.getElementById("loginName");


        /* ==================== مرحله ۱ ==================== */

        step1Button.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                if (
                    loginContact.value.trim() === ""
                ) {

                    loginContact.focus();
                    return;

                }

                step1.style.display = "none";

                verificationStep.style.display =
                    "flex";

            }
        );


        /* ==================== کد تأیید ==================== */

        verificationButton.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                verificationStep.style.display =
                    "none";

                step2.style.display =
                    "flex";

            }
        );


        /* ==================== نام کاربری ==================== */

        step2Button.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                if (
                    loginUsername.value.trim() === ""
                ) {

                    loginUsername.focus();
                    return;

                }

                step2.style.display =
                    "none";

                step3.style.display =
                    "flex";

            }
        );


        /* ==================== نام ==================== */

        step3Button.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                if (
                    loginName.value.trim() === ""
                ) {

                    loginName.focus();
                    return;

                }

                step3.style.display =
                    "none";

                step4.style.display =
                    "flex";

            }
        );


        /* ==================== ورود نهایی ==================== */

        document
            .getElementById("loginSubmit")
            .addEventListener(
                "click",
                function (event) {

                    event.preventDefault();

                    const contact =
                        loginContact.value.trim();

                    const username =
                        loginUsername.value.trim();

                    const name =
                        loginName.value.trim();


                    localStorage.setItem(
                        "novyContact",
                        contact
                    );

                    localStorage.setItem(
                        "novyUsername",
                        username
                    );

                    localStorage.setItem(
                        "novyName",
                        name
                    );

                    localStorage.setItem(
                        "novyLoggedIn",
                        "true"
                    );


                    window.location.href =
                        "profile.html";

                }
            );


        /* ==================== حرکت کد تأیید ==================== */

        const verificationInputs =
            document.querySelectorAll(
                ".verification-digit"
            );


        verificationInputs.forEach(
            function (input, index) {

                input.addEventListener(
                    "input",
                    function () {

                        if (
                            input.value.length === 1 &&
                            index <
                            verificationInputs.length - 1
                        ) {

                            verificationInputs[
                                index + 1
                            ].focus();

                        }

                    }
                );


                input.addEventListener(
                    "keydown",
                    function (event) {

                        if (
                            event.key === "Backspace" &&
                            input.value === "" &&
                            index > 0
                        ) {

                            verificationInputs[
                                index - 1
                            ].focus();

                        }

                    }
                );

            }
        );

    </script>

</body>

</html>

```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ورود به نووی</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* ==================== Login Input Fix ==================== */

        .login-step input {
            width: 100%;
            box-sizing: border-box;

            padding: 14px 16px;

            border: 1px solid #1d405d;
            border-radius: 14px;

            outline: none;

            background-color: #0a2038 !important;
            color: #f4fbff !important;

            font-family: Arial, sans-serif;
            font-size: 15px;

            transition: 0.2s;
        }

        .login-step input::placeholder {
            color: #91b0c2 !important;
            opacity: 1;
        }

        .login-step input:focus {
            background-color: #102e4a !important;

            border-color: #8ee7ff;

            box-shadow:
                0 0 0 3px rgba(142, 231, 255, 0.10);
        }

        .login-step input:-webkit-autofill,
        .login-step input:-webkit-autofill:hover,
        .login-step input:-webkit-autofill:focus {
            -webkit-text-fill-color: #f4fbff !important;

            -webkit-box-shadow:
                0 0 0 1000px #0a2038 inset !important;

            box-shadow:
                0 0 0 1000px #0a2038 inset !important;

            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>

<body>

    <main class="login-page">

        <div class="login-page-box">

            <a href="index.html" class="login-back">
                ← برگشت به نووی
            </a>

            <div class="login-page-logo">
                NOVY
            </div>

            <h1 id="loginTitle">
                ورود به نووی
            </h1>

            <p
                class="login-page-description"
                id="loginDescription"
            >
                اطلاعاتت رو وارد کن تا پروفایلت رو بسازیم.
            </p>


            <!-- مرحله ۱ -->
            <div
                class="login-step"
                id="step1"
            >

                <label for="loginContact">
                    ایمیل یا شماره تلفن
                </label>

                <input
                    type="text"
                    id="loginContact"
                    placeholder="ایمیل یا شماره تلفن"
                >

                <button
                    class="login-page-submit"
                    id="step1Button"
                >
                    ادامه
                    <span>←</span>
                </button>

            </div>


            <!-- مرحله ۲ -->
            <div
                class="login-step"
                id="step2"
                style="display: none;"
            >

                <label for="loginUsername">
                    نام کاربری
                </label>

                <input
                    type="text"
                    id="loginUsername"
                    placeholder="مثلاً novy_user"
                >

                <button
                    class="login-page-submit"
                    id="step2Button"
                >
                    ادامه
                    <span>←</span>
                </button>

            </div>


            <!-- مرحله ۳ -->
            <div
                class="login-step"
                id="step3"
                style="display: none;"
            >

                <label for="loginName">
                    نام
                </label>

                <input
                    type="text"
                    id="loginName"
                    placeholder="مثلاً میوا"
                >

                <button
                    class="login-page-submit"
                    id="step3Button"
                >
                    ادامه
                    <span>←</span>
                </button>

            </div>


            <!-- مرحله ۴ -->
            <div
                class="login-step"
                id="step4"
                style="display: none;"
            >

                <div class="login-success-icon">
                    ✓
                </div>

                <h2>
                    پروفایلت آماده‌ست!
                </h2>

                <p class="login-page-description">
                    حالا می‌تونی وارد نووی بشی و شروع کنی.
                </p>

                <button
                    class="login-page-submit"
                    id="loginSubmit"
                >
                    ورود به نووی
                    <span>←</span>
                </button>

            </div>

        </div>

    </main>


    <script>

        const step1 = document.getElementById("step1");
        const step2 = document.getElementById("step2");
        const step3 = document.getElementById("step3");
        const step4 = document.getElementById("step4");

        const step1Button = document.getElementById("step1Button");
        const step2Button = document.getElementById("step2Button");
        const step3Button = document.getElementById("step3Button");

        const loginContact = document.getElementById("loginContact");
        const loginUsername = document.getElementById("loginUsername");
        const loginName = document.getElementById("loginName");


        step1Button.addEventListener("click", function () {

            if (loginContact.value.trim() === "") {
                loginContact.focus();
                return;
            }

            step1.style.display = "none";
            step2.style.display = "block";

        });


        step2Button.addEventListener("click", function () {

            if (loginUsername.value.trim() === "") {
                loginUsername.focus();
                return;
            }

            step2.style.display = "none";
            step3.style.display = "block";

        });


        step3Button.addEventListener("click", function () {

            if (loginName.value.trim() === "") {
                loginName.focus();
                return;
            }

            step3.style.display = "none";
            step4.style.display = "block";

        });


        document
            .getElementById("loginSubmit")
            .addEventListener("click", function () {

                window.location.href = "index.html";

            });

    </script>

</body>

</html>
```

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ورود به نووی</title>

    <link rel="stylesheet" href="style.css">

    <style>

        html,
        body {
            color: var(--text-main) !important;
        }

        .login-page {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    rgba(142, 231, 255, 0.10),
                    transparent 45%
                ),
                var(--bg-main) !important;
        }

        .login-page-box {
            position: relative;

            width: min(430px, 100%);

            box-sizing: border-box;

            background: var(--bg-card) !important;
            color: var(--text-main) !important;

            border-color: var(--border) !important;
        }


        /* ==================== Buttons ==================== */

        .login-page-submit {
            background: var(--accent) !important;
            border: 1px solid var(--accent) !important;

            color: #061426 !important;

            -webkit-text-fill-color: #061426 !important;

            font-weight: 800;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease,
                box-shadow 0.2s ease;
        }

        .login-page-submit,
        .login-page-submit *,
        .login-page-submit span {
            color: #061426 !important;
            -webkit-text-fill-color: #061426 !important;
        }

        .login-page-submit:hover {
            opacity: 0.9;

            transform: translateY(-1px);

            box-shadow:
                0 6px 18px rgba(0, 0, 0, 0.18);
        }


        /* ==================== Inputs ==================== */

        .login-step input {
            width: 100%;

            box-sizing: border-box;

            padding: 14px 16px;

            border: 1px solid var(--border) !important;

            border-radius: 14px;

            outline: none;

            background: var(--bg-message) !important;
            color: var(--text-main) !important;

            font-family: inherit;
            font-size: 15px;

            transition: 0.2s;
        }

        .login-step input::placeholder {
            color: var(--text-muted) !important;
            opacity: 1;
        }

        .login-step input:focus {
            background: var(--bg-message) !important;
            color: var(--text-main) !important;

            border-color: var(--accent) !important;

            box-shadow:
                0 0 0 3px rgba(142, 231, 255, 0.10);
        }

        .login-step input:-webkit-autofill,
        .login-step input:-webkit-autofill:hover,
        .login-step input:-webkit-autofill:focus {
            -webkit-text-fill-color: var(--text-main) !important;

            -webkit-box-shadow:
                0 0 0 1000px var(--bg-message) inset !important;

            box-shadow:
                0 0 0 1000px var(--bg-message) inset !important;

            transition:
                background-color 5000s ease-in-out 0s;
        }


        /* ==================== Status ==================== */

        .login-status {
            display: none;

            margin-top: 10px;

            color: var(--text-muted);

            font-size: 13px;
            line-height: 1.8;
        }

        .login-status.show {
            display: block;
        }


        /* ==================== Password Error ==================== */

        .password-error {
            display: none;

            margin-top: 8px;

            color: #ff7b7b;

            font-size: 13px;
        }

        .password-error.show {
            display: block;
        }


        /* ==================== Loading ==================== */

        .login-page-submit.loading {
            opacity: 0.65;

            pointer-events: none;
        }

    </style>

</head>

        function setTheme(themeName) {

            const theme =
                themes[themeName] || themes.navy;

            Object.entries(theme).forEach(
                ([property, value]) => {

                    document.documentElement.style
                        .setProperty(
                            property,
                            value
                        );

                }
            );

            localStorage.setItem(
                "novy-theme",
                themeName
            );
        }


        /* =========================================================

        ========================================================= */

        function applyLanguage(lang) {

            const translation =
                translations[lang] ||
                translations.fa;


            document
                .querySelectorAll("[data-i18n]")
                .forEach(element => {

                    const key =
                        element.dataset.i18n;

                    if (
                        translation[key] !== undefined
                    ) {

                        const span =
                            element.querySelector("span");

                        if (span) {

                            span.textContent = "←";

                            element.childNodes[0]
                                .nodeValue =
                                translation[key] + " ";

                        } else {

                            element.textContent =
                                translation[key];

                        }

                    }

                });


            document
                .querySelectorAll(
                    "[data-i18n-placeholder]"
                )
                .forEach(element => {

                    const key =
                        element.dataset.i18nPlaceholder;

                    if (
                        translation[key] !== undefined
                    ) {

                        element.placeholder =
                            translation[key];

                    }

                });


            document.documentElement.lang =
                lang;

            document.documentElement.dir =
                lang === "en"
                    ? "ltr"
                    : "rtl";

            document.title =
                translation.pageTitle;


            localStorage.setItem(
                "novy-language",
                lang
            );

        }

            const lang =
                localStorage.getItem(
                    "novy-language"
                ) || "fa";


            return (
                translations[lang]?.[key]
                ||
                translations.fa[key]

        function showError(
            element,
            message
        ) {

            element.textContent =
                message;

            element.classList.add(
                "show"
            );

        }


        function hideError(element) {

            element.textContent = "";

            element.classList.remove(
                "show"
            );

        }


        function setLoading(
            button,
            loading
        ) {

            if (loading) {

                button.classList.add(
                    "loading"
                );

                button.dataset.originalText =
                    button.innerHTML;

                button.innerHTML =
                    "...";

            } else {

                button.classList.remove(
                    "loading"
                );

                if (
                    button.dataset.originalText
                ) {

                    button.innerHTML =
                        button.dataset.originalText;

                }

            }

        }


        function isValidEmail(email) {

            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
                .test(email);

        }


        function showStep(stepToShow) {

            [

                verificationStep,
                passwordStep,
                step2,
                step3,

                    step === stepToShow
                        ? "flex"
                        : "none";

            });

        /* =========================================================
           CHECK PROFILE COMPLETION
        ========================================================= */

        function isProfileComplete(user) {

            if (!user) {
                return false;
            }


            const metadata =
                user.user_metadata || {};


            const username =
                metadata.username;


            const name =
                metadata.name;


            return Boolean(
                username &&
                username.trim() &&
                name &&
                name.trim()
            );

        }


        /* =========================================================
           HANDLE EXISTING SESSION
        ========================================================= */

        async function handleExistingSession() {

            const {
                data,
                error
            } =
                await supabaseClient.auth
                    .getSession();


            if (error) {

                console.error(
                    "Session check error:",
                    error
                );

                return;

            }


            const session =
                data?.session;


            if (!session) {
                return;
            }


            const user =
                session.user;


            /*
             * اگر کاربر قبلاً Username و Name
             * داشته باشد، یعنی ثبت‌نامش کامل شده.
             *
             * پس نباید دوباره مرحله ساخت رمز
             * نمایش داده شود.
             */

            if (
                isProfileComplete(user)
            ) {

                localStorage.setItem(
                    "novyLoggedIn",
                    "true"
                );

                window.location.href =
                    "profile.html";

                return;

            }


            /*
             * اگر Session هست ولی پروفایل کامل نیست،
             * یعنی کاربر تازه ثبت‌نام کرده.
             */

            showStep(
                passwordStep
            );

        }

        step1Button.addEventListener(
            "click",
            async function (event) {

                event.preventDefault();

                hideError(
                    contactError
                );


                const email =
                    loginContact.value
                        .trim()
                        .toLowerCase();


                if (
                    !isValidEmail(email)
                ) {

                    showError(
                        contactError,
                        t("invalidEmail")
                    );

                    loginContact.focus();

                    return;

                }


                setLoading(
                    step1Button,
                    true
                );


                const redirectUrl =
                    window.location.origin +
                    window.location.pathname;


                const {
                    error
                } =
                    await supabaseClient.auth
                        .signInWithOtp({

                            email: email,

                            options: {

                                shouldCreateUser:
                                    true,

                                emailRedirectTo:
                                    redirectUrl

                            }

                        });


                setLoading(
                    step1Button,
                    false
                );


                if (error) {

                    console.error(
                        "signInWithOtp error:",
                        error
                    );

                    showError(
                        contactError,
                        t("emailError")
                    );

                    return;

                }


                localStorage.setItem(
                    "novyContact",
                    email
                );


                verificationEmail.textContent =
                    email;


                showStep(
                    verificationStep
                );

            }
        );


        /* =========================================================
           EMAIL VERIFICATION
        ========================================================= */

        verificationButton.addEventListener(
            "click",
            async function (event) {

                event.preventDefault();


                setLoading(
                    verificationButton,
                    true
                );


                const {
                    data,
                    error
                } =
                    await supabaseClient.auth
                        .getSession();


                setLoading(
                    verificationButton,
                    false
                );


                if (error) {

                    console.error(
                        error
                    );

                    alert(
                        t("authError")
                    );

                    return;

                }


                const session =
                    data?.session;


                if (!session) {

                    alert(
                        t("loginNotComplete")
                    );

                    return;

                }


                /*
                 * اگر بعد از تأیید ایمیل مشخص شد
                 * کاربر قبلاً ثبت‌نام کرده،
                 * مستقیم پروفایل.
                 */

                if (
                    isProfileComplete(
                        session.user
                    )
                ) {

                    localStorage.setItem(
                        "novyLoggedIn",
                        "true"
                    );

                    window.location.href =
                        "profile.html";

                    return;

                }


                /*
                 * کاربر جدید است.
                 */

                showStep(
                    passwordStep
                );

                loginPassword.focus();

            }
        );


        /* =========================================================
           PASSWORD
        ========================================================= */

        passwordButton.addEventListener(
            "click",
            async function (event) {

                event.preventDefault();

                hideError(
                    passwordError
                );


                const password =
                    loginPassword.value;

                const confirmPassword =
                    loginPasswordConfirm.value;


                if (!password) {

                    showError(
                        passwordError,
                        t("passwordRequired")
                    );

                    loginPassword.focus();

                    return;

                }


                if (
                    password.length < 6
                ) {

                    showError(
                        passwordError,
                        t("passwordTooShort")
                    );

                    loginPassword.focus();

                    return;

                }


                if (
                    password !== confirmPassword
                ) {

                    showError(
                        passwordError,
                        t("passwordMismatch")
                    );

                    loginPasswordConfirm.focus();

                    return;

                }


                setLoading(
                    passwordButton,
                    true
                );


                const {
                    error
                } =
                    await supabaseClient.auth
                        .updateUser({

                            password:
                                password

                        });


                setLoading(
                    passwordButton,
                    false
                );


                if (error) {

                    console.error(
                        "Password error:",
                        error
                    );

                    showError(
                        passwordError,
                        t("passwordError")
                    );

                    return;

                }


                /*
                 * رمز عبور ذخیره نمی‌شود.
                 */

                showStep(
                    step2
                );

                loginUsername.focus();

            }
        );


        loginPassword.addEventListener(
            "input",
            function () {

                hideError(
                    passwordError
                );

            }
        );


        loginPasswordConfirm.addEventListener(
            "input",
            function () {

                hideError(
                    passwordError
                );

            }
        );


        /* =========================================================
           USERNAME
        ========================================================= */

        step2Button.addEventListener(
            "click",
            async function (event) {

                event.preventDefault();


                const username =
                    loginUsername.value.trim();


                if (!username) {

                    loginUsername.focus();

                    return;

                }


                setLoading(
                    step2Button,
                    true
                );


                const {
                    error
                } =
                    await supabaseClient.auth
                        .updateUser({

                            data: {

                                username:
                                    username

                            }

                        });


                setLoading(
                    step2Button,
                    false
                );


                if (error) {

                    console.error(
                        "Username error:",
                        error
                    );

                    alert(
                        t("profileError")
                    );

                    return;

                }


                showStep(
                    step3
                );

                loginName.focus();

            }
        );


        /* =========================================================
           NAME
        ========================================================= */

        step3Button.addEventListener(
            "click",
            async function (event) {

                event.preventDefault();


                const name =
                    loginName.value.trim();


                if (!name) {

                    loginName.focus();

                    return;

                }


                setLoading(
                    step3Button,
                    true
                );


                const {
                    error
                } =
                    await supabaseClient.auth
                        .updateUser({

                            data: {

                                name:
                                    name

                            }

                        });


                setLoading(
                    step3Button,
                    false
                );


                if (error) {

                    console.error(
                        "Name error:",
                        error
                    );

                    alert(
                        t("profileError")
                    );

                    return;

                }


                showStep(
                    step4
                );

            }
        );


        /* =========================================================
           FINAL LOGIN
        ========================================================= */

        loginSubmit.addEventListener(
            "click",
            async function (event) {

                event.preventDefault();


                const {
                    data,
                    error
                } =
                    await supabaseClient.auth
                        .getSession();


                if (
                    error ||
                    !data?.session
                ) {

                    alert(
                        t("authError")
                    );

                    return;

                }


                const user =
                    data.session.user;

                const metadata =
                    user.user_metadata || {};


                /*
                 * اطلاعات غیرحساس
                 */

                localStorage.setItem(
                    "novyContact",
                    user.email || ""
                );

                localStorage.setItem(
                    "novyUsername",
                    metadata.username || ""
                );

                localStorage.setItem(
                    "novyName",
                    metadata.name || ""
                );

                localStorage.setItem(
                    "novyLoggedIn",
                    "true"
                );


                window.location.href =
                    "profile.html";

            }
        );


        /* =========================================================
           AUTH STATE
        ========================================================= */

        supabaseClient.auth.onAuthStateChange(
            function (event, session) {

                if (
                    event !== "SIGNED_IN" ||
                    !session
                ) {
                    return;
                }


                /*
                 * صبر کوتاه برای اینکه metadata
                 * و Session کاملاً آماده شوند.
                 */

                setTimeout(
                    async function () {

                        const {
                            data
                        } =
                            await supabaseClient.auth
                                .getUser();


                        const user =
                            data?.user;


                        if (!user) {
                            return;
                        }


                        /*
                         * کاربر قبلی
                         */

                        if (
                            isProfileComplete(
                                user
                            )
                        ) {

                            localStorage.setItem(
                                "novyLoggedIn",
                                "true"
                            );

                            window.location.href =
                                "profile.html";

                            return;

                        }


                        /*
                         * کاربر جدید
                         */

                        if (
                            verificationStep.style.display
                            !== "none"
                        ) {

                            showStep(
                                passwordStep
                            );

                            loginPassword.focus();

                        }

                    },
                    250
                );

            }
        );


        /* =========================================================
           INITIAL SESSION CHECK
        ========================================================= */

        setTimeout(
            handleExistingSession,
            400
        );

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ورود به نووی</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-page">

        <div class="login-page-box">

            <a href="index.html" class="login-back">
                ← برگشت به نووی
            </a>

            <div class="login-page-logo">
                NOVY
            </div>

            <h1>
                ورود به نووی
            </h1>

            <p class="login-page-description">
                برای ساخت پروفایل خودت اطلاعاتت رو وارد کن.
            </p>

            <div class="login-form">

                <label for="loginName">
                    نام نمایشی
                </label>

                <input
                    type="text"
                    id="loginName"
                    placeholder="مثلاً میوا"
                >

                <button
                    class="login-page-submit"
                    id="loginSubmit"
                >
                    ادامه
                    <span>←</span>
                </button>

            </div>

        </div>

    </main>

</body>

</html>

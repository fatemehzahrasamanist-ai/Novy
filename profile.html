    <title>NOVY | Profile</title>

    <style>

        :root {
            --bg-main: #07111f;
            --bg-card: #0c1b2e;
            --bg-input: #101f33;
            --bg-message: #12243a;
            --border: #1d3854;
            --text-main: #eef7ff;
            --text-muted: #91a8bd;
            --accent: #8ee7ff;
            --accent-strong: #55d6f7;
            --danger: #ff7d8f;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: var(--bg-main);
            color: var(--text-main);

            font-family:
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 470px;
        }

        .logo {
            text-align: center;

            font-size: 28px;
            font-weight: 900;

            letter-spacing: 3px;

            margin-bottom: 20px;
        }

        .card {
            background: var(--bg-card);

            border: 1px solid var(--border);

            border-radius: 24px;

            padding: 28px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .profile-header {
            text-align: center;
        }

        .avatar-wrapper {
            position: relative;

            width: 120px;
            height: 120px;

            margin: 0 auto 12px;
        }

        .avatar {
            width: 120px;
            height: 120px;

            border-radius: 50%;

            background: var(--bg-message);

            border: 2px solid var(--border);

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            color: var(--accent);

            font-size: 42px;
            font-weight: 900;
        }

        .avatar img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .edit-photo {
            position: absolute;

            bottom: 2px;
            left: 2px;

            width: 34px;
            height: 34px;

            border-radius: 50%;

            border: 2px solid var(--bg-card);

            background: var(--accent);
            color: #06111d;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            font-size: 16px;
            font-weight: 900;
        }

        .photo-hint {
            margin-bottom: 22px;

            color: var(--text-muted);

            font-size: 12px;
        }

        input[type="file"] {
            display: none;
        }

        h1 {
            margin: 0 0 8px;

            font-size: 25px;
        }

        .description {
            margin: 0 0 24px;

            color: var(--text-muted);

            font-size: 14px;

            line-height: 1.7;
        }

        .info {
            display: flex;
            flex-direction: column;

            gap: 10px;

            margin-bottom: 22px;
        }

        .info-row {
            background: var(--bg-message);

            border: 1px solid var(--border);

            border-radius: 13px;

            padding: 13px 15px;
        }

        .info-label {
            color: var(--text-muted);

            font-size: 11px;

            margin-bottom: 4px;
        }

        .info-value {
            color: var(--text-main);

            font-size: 14px;

            font-weight: 700;

            word-break: break-word;
        }

        .edit-input {
            width: 100%;

            padding: 9px 10px;

            margin-top: 2px;

            background: var(--bg-input);

            border: 1px solid var(--border);

            border-radius: 9px;

            color: var(--text-main);

            font-family: inherit;

            font-size: 14px;

            outline: none;
        }

        .edit-input:focus {
            border-color: var(--accent);
        }

        .edit-input::placeholder {
            color: var(--text-muted);
        }

        .edit-profile,
        .save-profile,
        .cancel-edit {
            margin-top: 10px;
        }

        .save-profile {
            display: none;
        }

        .cancel-edit {
            display: none;

            background: transparent;

            color: var(--text-muted);

            border: 1px solid var(--border);
        }

        .cancel-edit:hover {
            background: var(--bg-message);

            color: var(--text-main);

            border-color: var(--text-muted);
        }

        button {
            width: 100%;

            min-height: 48px;

            border: 0;

            border-radius: 13px;

            background: var(--accent);

            color: #06111d;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

            transition: 0.2s;

            margin-top: 10px;
        }

        button:hover {
            background: var(--accent-strong);

            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }

        .delete-photo {
            background: transparent;

            color: var(--danger);

            border: 1px solid rgba(

                125,
                143,
                0.35

        }

        .delete-photo:hover {
            background: rgba(
                255,
                125,
                143,
                0.08

            color: var(--danger);

            border-color: var(--danger);
        }

            color: var(--text-muted);

            border: 1px solid var(--border);
        }

        .logout:hover {
            background: var(--bg-message);

            color: var(--text-main);

            border-color: var(--text-muted);

                125,
                143,

            color: var(--text-muted);

let currentLanguage =
    localStorage.getItem(
        "novy-language"
    ) || "fa";


let currentUser = null;


/* =========================
   LANGUAGE
========================= */

function applyLanguage(lang) {

    currentLanguage =
        translations[lang]
            ? lang
            : "fa";

    const data =
        translations[currentLanguage];


    document.documentElement.lang =
        currentLanguage;

    document.documentElement.dir =
        currentLanguage === "en"
            ? "ltr"
            : "rtl";


    document.title =
        data.pageTitle;


    document
        .querySelectorAll("[data-i18n]")
        .forEach(element => {

            const key =
                element.getAttribute(
                    "data-i18n"
                );

            if (data[key]) {

                element.textContent =
                    data[key];

            }

        });


    document
        .querySelectorAll("[data-i18n-title]")
        .forEach(element => {

            const key =
                element.getAttribute(
                    "data-i18n-title"
                );

            if (data[key]) {

                element.title =
                    data[key];

            }

        });


    document
        .querySelectorAll("[data-i18n-aria]")
        .forEach(element => {

            const key =
                element.getAttribute(
                    "data-i18n-aria"
                );

            if (data[key]) {

                element.setAttribute(
                    "aria-label",
                    data[key]
                );

            }

        });


    document
        .querySelectorAll("[data-i18n-placeholder]")
        .forEach(element => {

            const key =
                element.getAttribute(
                    "data-i18n-placeholder"
                );

            if (data[key]) {

                element.placeholder =
                    data[key];

            }

        });


    const avatarImage =
        document.querySelector(
            "#avatar img"
        );

    if (avatarImage) {

        avatarImage.alt =
            data.profileAlt;

    }


    localStorage.setItem(
        "novy-language",
        currentLanguage
    );


    updateWelcome();

}


/* =========================
   TEXT HELPER
========================= */

function getText(key) {

    return (
        translations[currentLanguage]?.[key] ||
        translations.fa[key] ||
        key
    );

}


/* =========================
   WELCOME
========================= */

function updateWelcome() {

    const welcome =
        document.getElementById(
            "welcome"
        );

    if (!welcome) {
        return;
    }


    const name =
        document.getElementById(
            "nameValue"
        )?.textContent;


    const username =
        document.getElementById(
            "usernameValue"
        )?.textContent;


    const email =
        document.getElementById(
            "emailValue"
        )?.textContent;


    const validName =
        name && name !== "-"
            ? name
            : "";


    const validUsername =
        username && username !== "-"
            ? username
            : "";


    const validEmail =
        email && email !== "-"
            ? email
            : "";


    const displayName =
        validName ||
        validUsername ||
        validEmail ||
        getText("defaultName");


    if (
        currentLanguage === "en"
    ) {

        welcome.textContent =
            `Welcome ${displayName} 👋`;

    }
    else if (
        currentLanguage === "ar"
    ) {

        welcome.textContent =
            `مرحباً ${displayName} 👋`;

    }
    else {

        welcome.textContent =
            `خوش اومدی ${displayName} 👋`;

    }

}


/* =========================
   MESSAGE
========================= */

function showMessage(
    text,
    error = false
) {

    const element =
        document.getElementById(
            "photoMessage"
        );

    element.textContent =
        text;

    element.classList.add(
        "show"
    );

    element.classList.toggle(
        "error",
        error
    );

}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile() {

    const {
        data: {
            session
        }
    } =
        await supabaseClient.auth.getSession();


    if (
        !session ||
        !session.user
    ) {

        window.location.href =
            "login.html";

        return;

    }


    currentUser =
        session.user;


    const metadata =
        currentUser.user_metadata || {};


    const name =
        metadata.name ||
        "";


    const username =
        metadata.username ||
        "";


    document.getElementById(
        "nameValue"
    ).textContent =
        name || "-";


    document.getElementById(
        "usernameValue"
    ).textContent =
        username || "-";


    document.getElementById(
        "emailValue"
    ).textContent =
        currentUser.email || "-";


    updateWelcome();


    if (
        metadata.avatar_url
    ) {

        setAvatarImage(
            metadata.avatar_url
        );

    }
    else {

        setAvatarInitial(
            name ||
            username ||
            currentUser.email ||
            "N"
        );

    }


    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "profileContent"
    ).style.display =
        "block";

}


/* =========================
   EDIT PROFILE
========================= */

function startEditing() {

    const name =
        document.getElementById(
            "nameValue"
        ).textContent;


    const username =
        document.getElementById(
            "usernameValue"
        ).textContent;


    document.getElementById(
        "nameInput"
    ).value =
        name === "-"
            ? ""
            : name;


    document.getElementById(
        "usernameInput"
    ).value =
        username === "-"
            ? ""
            : username;


    document.getElementById(
        "nameValue"
    ).style.display =
        "none";


    document.getElementById(
        "usernameValue"
    ).style.display =
        "none";


    document.getElementById(
        "nameInput"
    ).style.display =
        "block";


    document.getElementById(
        "usernameInput"
    ).style.display =
        "block";


    document.getElementById(
        "editProfileButton"
    ).style.display =
        "none";


    document.getElementById(
        "saveProfileButton"
    ).style.display =
        "block";


    document.getElementById(
        "cancelEditButton"
    ).style.display =
        "block";


    document.getElementById(
        "nameInput"
    ).focus();

}


function cancelEditing() {

    document.getElementById(
        "nameValue"
    ).style.display =
        "block";


    document.getElementById(
        "usernameValue"
    ).style.display =
        "block";


    document.getElementById(
        "nameInput"
    ).style.display =
        "none";


    document.getElementById(
        "usernameInput"
    ).style.display =
        "none";


    document.getElementById(
        "editProfileButton"
    ).style.display =
        "block";


    document.getElementById(
        "saveProfileButton"
    ).style.display =
        "none";


    document.getElementById(
        "cancelEditButton"
    ).style.display =
        "none";

}


async function saveProfile() {

    const name =
        document.getElementById(
            "nameInput"
        ).value.trim();


    const username =
        document.getElementById(
            "usernameInput"
        ).value.trim();


    if (!name) {

        showMessage(
            getText("emptyName"),
            true
        );

        return;

    }


    if (!username) {

        showMessage(
            getText("emptyUsername"),
            true
        );

        return;

    }


    if (
        !/^[a-zA-Z0-9._-]+$/.test(
            username
        )
    ) {

        showMessage(
            getText("invalidUsername"),
            true
        );

        return;

    }


    const saveButton =
        document.getElementById(
            "saveProfileButton"
        );


    saveButton.disabled =
        true;


    showMessage(
        getText("savingProfile")
    );


    const {
        data,
        error
    } =
        await supabaseClient.auth.updateUser({

            data: {

                name:
                    name,

                username:
                    username

            }

        });


    saveButton.disabled =
        false;


    if (error) {

        console.error(
            "Profile update error:",
            error
        );


        showMessage(
            getText(
                "profileUpdateError"
            ),
            true
        );

        return;

    }


    currentUser =
        data.user;


    document.getElementById(
        "nameValue"
    ).textContent =
        name;


    document.getElementById(
        "usernameValue"
    ).textContent =
        username;


    cancelEditing();


    updateWelcome();


    showMessage(
        getText("profileUpdated")
    );

}


/* =========================
   AVATAR
========================= */

function setAvatarInitial(
    text
) {

    const avatar =
        document.getElementById(
            "avatar"
        );


    const letter =
        text
            .trim()
            .charAt(0)
            .toUpperCase() ||
        "N";


    avatar.innerHTML =
        "";

    avatar.textContent =
        letter;

}


function setAvatarImage(
    url
) {

    const avatar =
        document.getElementById(
            "avatar"
        );


    avatar.innerHTML =
        "";


    const image =
        document.createElement(
            "img"
        );


    image.src =
        url;


    image.alt =
        getText("profileAlt");


    avatar.appendChild(
        image
    );

}


/* =========================
   UPLOAD AVATAR
========================= */

document
    .getElementById(
        "avatarInput"
    )
    .addEventListener(
        "change",
        async function () {

            const file =
                this.files[0];


            if (!file) {
                return;
            }


            const allowedTypes = [

                "image/jpeg",

                "image/png",

                "image/webp"

            ];


            if (
                !allowedTypes.includes(
                    file.type
                )
            ) {

                showMessage(
                    getText(
                        "invalidType"
                    ),
                    true
                );


                this.value =
                    "";

                return;

            }


            if (
                file.size >
                5 * 1024 * 1024
            ) {

                showMessage(
                    getText(
                        "tooLarge"
                    ),
                    true
                );


                this.value =
                    "";

                return;

            }


            const {
                data: {
                    session
                }
            } =
                await supabaseClient.auth.getSession();


            if (
                !session ||
                !session.user
            ) {

                showMessage(
                    getText(
                        "loginRequired"
                    ),
                    true
                );

                return;

            }


            const user =
                session.user;


            const extension =
                file.type ===
                "image/png"

                    ? "png"

                    : file.type ===
                      "image/webp"

                        ? "webp"

                        : "jpg";


            const path =
                `${user.id}/avatar.${extension}`;


            showMessage(
                getText(
                    "uploading"
                )
            );


            const oldPaths = [

                `${user.id}/avatar.jpg`,

                `${user.id}/avatar.png`,

                `${user.id}/avatar.webp`

            ];


            const pathsToRemove =
                oldPaths.filter(
                    oldPath =>
                        oldPath !== path
                );


            if (
                pathsToRemove.length
            ) {

                const {
                    error:
                        removeError
                } =
                    await supabaseClient
                        .storage
                        .from("avatars")
                        .remove(
                            pathsToRemove
                        );


                if (removeError) {

                    console.error(
                        removeError
                    );

                }

            }


            const {
                error: uploadError
            } =
                await supabaseClient
                    .storage
                    .from("avatars")
                    .upload(
                        path,
                        file,
                        {
                            cacheControl:
                                "3600",

                            upsert:
                                true,

                            contentType:
                                file.type
                        }
                    );


            if (
                uploadError
            ) {

                console.error(
                    uploadError
                );


                showMessage(
                    getText(
                        "uploadError"
                    ),
                    true
                );


                this.value =
                    "";

                return;

            }


            const {
                data: publicData
            } =
                supabaseClient
                    .storage
                    .from("avatars")
                    .getPublicUrl(
                        path
                    );


            const avatarUrl =
                publicData.publicUrl;


            const {
                error:
                    metadataError
            } =
                await supabaseClient
                    .auth
                    .updateUser({

                        data: {

                            avatar_url:
                                avatarUrl

                        }

                    });


            if (
                metadataError
            ) {

                console.error(
                    metadataError
                );


                showMessage(
                    getText(
                        "metadataError"
                    ),
                    true
                );


                this.value =
                    "";

                return;

            }


            const finalUrl =
                `${avatarUrl}?t=${Date.now()}`;


            setAvatarImage(
                finalUrl
            );


            showMessage(
                getText(
                    "uploadSuccess"
                )
            );


            this.value =
                "";

        }
    );


/* =========================
   DELETE AVATAR
========================= */

async function deleteAvatar() {

    const confirmed =
        window.confirm(
            getText(
                "confirmDeletePhoto"
            )
        );


    if (!confirmed) {
        return;
    }


    const {
        data: {
            session
        }
    } =
        await supabaseClient.auth.getSession();


    if (
        !session ||
        !session.user
    ) {

        showMessage(
            getText(
                "loginRequired"
            ),
            true
        );

        return;
    }


    const user =
        session.user;


    showMessage(
        getText(
            "deleting"
        )
    );


    const paths = [

        `${user.id}/avatar.jpg`,

        `${user.id}/avatar.png`,

        `${user.id}/avatar.webp`

    ];


    const {
        error: removeError
    } =
        await supabaseClient
            .storage
            .from("avatars")
            .remove(paths);


    if (removeError) {

        console.error(
            removeError
        );


        showMessage(
            getText(
                "deleteError"
            ),
            true
        );

        return;
    }


    const {
        error: metadataError
    } =
        await supabaseClient
            .auth
            .updateUser({

                data: {
                    avatar_url: null
                }

            });


    if (metadataError) {

        console.error(
            metadataError
        );


        showMessage(
            getText(
                "deleteError"
            ),
            true
        );

        return;
    }


    setAvatarInitial(
        user.user_metadata?.name ||
        user.user_metadata?.username ||
        user.email ||
        "N"
    );


    showMessage(
        getText(
            "deleteSuccess"
        )
    );

}

            getText(
                "confirmLogout"
            )
        );


    if (!confirmed) {
        return;
    }


    showMessage(
        getText(
            "loggingOut"
        )
    );

        error
    } =
        await supabaseClient
            .auth
            .signOut();


    if (error) {

        console.error(
            error
        );


        showMessage(
            getText(
                "logoutError"
            ),
            true
        );

        return;

    }


    localStorage.removeItem(
        "novyLoggedIn"
    );


    window.location.href =
        "login.html";

}


/* =========================
   DELETE ACCOUNT
========================= */

async function deleteAccount() {

    const confirmed =
        window.confirm(
            getText(
                "confirmDeleteAccount"
            )
        );


    if (!confirmed) {
        return;
    }


    const {
        data: {
            session
        }
    } =
        await supabaseClient
            .auth
            .getSession();


    if (
        !session ||
        !session.user
    ) {

        showMessage(
            getText(
                "loginRequired"
            ),
            true
        );

        return;

    }


    showMessage(
        getText(
            "deletingAccount"
        )
    );


    const {
        data,
        error
    } =
        await supabaseClient
            .functions
            .invoke(
                "delete-account",
                {
                    body: {}
                }
            );


    if (error) {

        console.error(
            "Delete account error:",
            error
        );


        showMessage(
            getText(
                "accountDeleteError"
            ),
            true
        );

        return;

    }


    if (
        !data ||
        data.success !== true
    ) {

        console.error(
            "Delete account response:",
            data
        );


        showMessage(
            getText(
                "accountDeleteError"
            ),
            true
        );

        return;

    }


    localStorage.removeItem(
        "novyLoggedIn"
    );


    window.location.href =
        "index.html";

}

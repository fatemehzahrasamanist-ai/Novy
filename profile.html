<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>پروفایل | نووی</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --profile-bg: #061426;
            --profile-box: #0b233d;
            --profile-item: #0a2038;
            --profile-avatar: #102e4a;
            --profile-border: #1d405d;
            --profile-item-border: #163452;
            --profile-text: #f4fbff;
            --profile-muted: #a8c7d9;
            --profile-soft: #91b0c2;
            --profile-accent: #8ee7ff;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;

            background: var(--profile-bg);
            color: var(--profile-text);

            font-family: inherit;
        }

        body {
            transition:
                background 0.25s ease,
                color 0.25s ease;
        }

        .profile-page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            background:
                radial-gradient(
                    circle at top,
                    rgba(142, 231, 255, 0.10),
                    transparent 45%
                ),
                var(--profile-bg);

            transition: background 0.25s ease;
        }

        .profile-box {
            width: min(500px, 100%);

            padding: 40px 32px;

            background: var(--profile-box);

            border: 1px solid var(--profile-border);
            border-radius: 24px;

            text-align: center;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.30);
        }

        .profile-logo {
            color: var(--profile-accent);

            font-size: 22px;
            font-weight: 700;

            letter-spacing: 4px;

            margin-bottom: 25px;
        }

        /* ==================== Avatar ==================== */

        .avatar-wrapper {
            position: relative;

            width: 104px;
            height: 104px;

            margin: 0 auto 20px;
        }

        .profile-avatar {
            width: 104px;
            height: 104px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            border-radius: 50%;

            background: var(--profile-avatar);

            border: 2px solid var(--profile-accent);

            color: var(--profile-accent);

            font-size: 34px;
            font-weight: bold;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }

        .avatar-upload-button {
            position: absolute;

            right: -3px;
            bottom: -3px;

            width: 34px;
            height: 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 2px solid var(--profile-box);
            border-radius: 50%;

            background: var(--profile-accent);
            color: var(--profile-bg);

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                filter 0.2s ease;
        }

        .avatar-upload-button:hover {
            filter: brightness(1.06);
            transform: scale(1.06);
        }

        #avatarInput {
            display: none;
        }

        .avatar-hint {
            margin: -8px 0 22px;

            color: var(--profile-soft);

            font-size: 12px;
        }

        .upload-status {
            min-height: 18px;

            margin: -12px 0 18px;

            color: var(--profile-accent);

            font-size: 12px;
        }

        /* ==================== Text ==================== */

        .profile-box h1 {
            margin: 0 0 10px;

            color: var(--profile-text);

            font-size: 25px;
        }

        .profile-description {
            margin: 0 0 28px;

            color: var(--profile-muted);

            font-size: 14px;
        }

        /* ==================== Info ==================== */

        .profile-info {
            display: flex;
            flex-direction: column;
            gap: 12px;

            margin-bottom: 25px;
        }

        .profile-item {
            padding: 15px;

            background: var(--profile-item);

            border: 1px solid var(--profile-item-border);

            border-radius: 14px;

            text-align: right;
        }

        .profile-item-title {
            display: block;

            margin-bottom: 5px;

            color: var(--profile-soft);

            font-size: 12px;
        }

        .profile-item-value {
            color: var(--profile-text);

            font-size: 15px;
        }

        /* ==================== Buttons ==================== */

        .profile-button {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 14px;

            background: var(--profile-accent);
            color: var(--profile-bg);

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                filter 0.2s ease;
        }

        .profile-button:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
        }

        .profile-button:active {
            transform: translateY(0);
        }

        .logout-button {
            width: 100%;

            margin-top: 10px;

            padding: 12px;

            border: 1px solid var(--profile-item-border);
            border-radius: 14px;

            background: transparent;
            color: var(--profile-muted);

            font-size: 13px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease;
        }

        .logout-button:hover {
            background: var(--profile-item);
            border-color: var(--profile-accent);
            color: var(--profile-accent);
        }

        /* ==================== Responsive ==================== */

        @media (max-width: 600px) {

            .profile-page {
                padding: 18px;
            }

            .profile-box {
                padding: 32px 22px;
            }

            .profile-box h1 {
                font-size: 22px;
            }

        }

    </style>

</head>


<body>

    <main class="profile-page">

        <div class="profile-box">

            <div class="profile-logo">
                NOVY
            </div>


            <!-- Avatar -->

            <div class="avatar-wrapper">

                <div
                    class="profile-avatar"
                    id="profileAvatar"
                >
                    N
                </div>

                <label
                    class="avatar-upload-button"
                    for="avatarInput"
                    id="avatarUploadLabel"
                    title="تغییر عکس"
                >
                    ✎
                </label>

                <input
                    type="file"
                    id="avatarInput"
                    accept="image/png,image/jpeg,image/webp"
                >

            </div>


            <p
                class="avatar-hint"
                id="avatarHint"
            >
                برای تغییر عکس روی ✎ بزن
            </p>


            <div
                class="upload-status"
                id="uploadStatus"
            ></div>


            <!-- Welcome -->

            <h1 id="welcomeTitle">
                خوش اومدی به نووی 👋
            </h1>


            <p
                class="profile-description"
                id="profileDescription"
            >
                اینجا پروفایل شخصی توئه.
            </p>


            <!-- Information -->

            <div class="profile-info">

                <div class="profile-item">

                    <span
                        class="profile-item-title"
                        id="nameLabel"
                    >
                        نام
                    </span>

                    <span
                        class="profile-item-value"
                        id="profileName"
                    >
                        -
                    </span>

                </div>


                <div class="profile-item">

                    <span
                        class="profile-item-title"
                        id="usernameLabel"
                    >
                        نام کاربری
                    </span>

                    <span
                        class="profile-item-value"
                        id="profileUsername"
                    >
                        -
                    </span>

                </div>

            </div>


            <!-- Enter Novy -->

            <button
                class="profile-button"
                id="enterNovy"
            >
                ورود به نووی
                ←
            </button>


            <!-- Logout -->

            <button
                class="logout-button"
                id="logoutButton"
            >
                خروج از حساب
            </button>

        </div>

    </main>


    <script>

        /* =========================================================
           SUPABASE
        ========================================================= */

        const SUPABASE_URL =
            "https://yeqwwxmbgeojjbuzppsm.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_OS5skv6tIdXNzCqHcRlUug_Qmtuzlmh";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        /* =========================================================
           ELEMENTS
        ========================================================= */

        const profileAvatar =
            document.getElementById("profileAvatar");

        const avatarInput =
            document.getElementById("avatarInput");

        const uploadStatus =
            document.getElementById("uploadStatus");

        const welcomeTitle =
            document.getElementById("welcomeTitle");

        const profileDescription =
            document.getElementById("profileDescription");

        const profileName =
            document.getElementById("profileName");

        const profileUsername =
            document.getElementById("profileUsername");

        const nameLabel =
            document.getElementById("nameLabel");

        const usernameLabel =
            document.getElementById("usernameLabel");

        const avatarHint =
            document.getElementById("avatarHint");

        const avatarUploadLabel =
            document.getElementById("avatarUploadLabel");

        const enterNovy =
            document.getElementById("enterNovy");

        const logoutButton =
            document.getElementById("logoutButton");


        /* =========================================================
           TRANSLATIONS
        ========================================================= */

        const translations = {

            fa: {
                title: "پروفایل | نووی",

                welcome: "خوش اومدی {name} 👋",
                welcomeDefault: "خوش اومدی به نووی 👋",

                description:
                    "اینجا پروفایل شخصی توئه.",

                name:
                    "نام",

                username:
                    "نام کاربری",

                enter:
                    "ورود به نووی",

                logout:
                    "خروج از حساب",

                avatarHint:
                    "برای تغییر عکس روی ✎ بزن",

                changeAvatar:
                    "تغییر عکس",

                uploading:
                    "در حال آپلود عکس...",

                uploaded:
                    "عکس پروفایل ذخیره شد ✓",

                uploadError:
                    "آپلود عکس انجام نشد.",

                invalidImage:
                    "فقط فایل تصویری JPG، PNG یا WebP انتخاب کن.",

                tooLarge:
                    "حجم عکس باید کمتر از 5 مگابایت باشد.",

                notLoggedIn:
                    "لطفاً ابتدا وارد حساب شو."
            },


            en: {
                title: "Profile | Novy",

                welcome: "Welcome {name} 👋",
                welcomeDefault: "Welcome to Novy 👋",

                description:
                    "This is your personal profile.",

                name:
                    "Name",

                username:
                    "Username",

                enter:
                    "Enter Novy",

                logout:
                    "Log out",

                avatarHint:
                    "Click ✎ to change your photo",

                changeAvatar:
                    "Change photo",

                uploading:
                    "Uploading photo...",

                uploaded:
                    "Profile photo saved ✓",

                uploadError:
                    "Could not upload the photo.",

                invalidImage:
                    "Please choose a JPG, PNG, or WebP image.",

                tooLarge:
                    "The image must be smaller than 5 MB.",

                notLoggedIn:
                    "Please log in first."
            },


            ar: {
                title: "الملف الشخصي | نووي",

                welcome: "مرحباً {name} 👋",
                welcomeDefault: "مرحباً بك في نووي 👋",

                description:
                    "هذا هو ملفك الشخصي.",

                name:
                    "الاسم",

                username:
                    "اسم المستخدم",

                enter:
                    "الدخول إلى نووي",

                logout:
                    "تسجيل الخروج",

                avatarHint:
                    "اضغط على ✎ لتغيير الصورة",

                changeAvatar:
                    "تغيير الصورة",

                uploading:
                    "جارٍ رفع الصورة...",

                uploaded:
                    "تم حفظ صورة الملف الشخصي ✓",

                uploadError:
                    "تعذر رفع الصورة.",

                invalidImage:
                    "اختر صورة بصيغة JPG أو PNG أو WebP.",

                tooLarge:
                    "يجب أن يكون حجم الصورة أقل من 5 ميجابايت.",

                notLoggedIn:
                    "يرجى تسجيل الدخول أولاً."
            }

        };


        /* =========================================================
           THEME
        ========================================================= */

        const themes = {

            navy: {
                bg: "#061426",
                box: "#0b233d",
                item: "#0a2038",
                avatar: "#102e4a",
                border: "#1d405d",
                itemBorder: "#163452",
                text: "#f4fbff",
                muted: "#a8c7d9",
                soft: "#91b0c2",
                accent: "#8ee7ff"
            },

            black: {
                bg: "#050505",
                box: "#0d0d0d",
                item: "#111111",
                avatar: "#181818",
                border: "#292929",
                itemBorder: "#242424",
                text: "#f5f5f5",
                muted: "#b5b5b5",
                soft: "#999999",
                accent: "#8ee7ff"
            },

            ice: {
                bg: "#eaf8ff",
                box: "#ffffff",
                item: "#f1fbff",
                avatar: "#dff5ff",
                border: "#b8e6f7",
                itemBorder: "#c9eaf5",
                text: "#123047",
                muted: "#547086",
                soft: "#6c8799",
                accent: "#168db5"
            }

        };


        function setTheme(themeName) {

            const theme =
                themes[themeName] || themes.navy;

            const root =
                document.documentElement;

            root.style.setProperty(
                "--profile-bg",
                theme.bg
            );

            root.style.setProperty(
                "--profile-box",
                theme.box
            );

            root.style.setProperty(
                "--profile-item",
                theme.item
            );

            root.style.setProperty(
                "--profile-avatar",
                theme.avatar
            );

            root.style.setProperty(
                "--profile-border",
                theme.border
            );

            root.style.setProperty(
                "--profile-item-border",
                theme.itemBorder
            );

            root.style.setProperty(
                "--profile-text",
                theme.text
            );

            root.style.setProperty(
                "--profile-muted",
                theme.muted
            );

            root.style.setProperty(
                "--profile-soft",
                theme.soft
            );

            root.style.setProperty(
                "--profile-accent",
                theme.accent
            );
        }


        /* =========================================================
           LANGUAGE
        ========================================================= */

        let currentLanguage =
            localStorage.getItem("novy-language") || "fa";


        function applyLanguage(language) {

            if (!translations[language]) {
                language = "fa";
            }

            currentLanguage = language;

            const t =
                translations[language];

            document.documentElement.lang =
                language;

            document.documentElement.dir =
                language === "ar" || language === "fa"
                    ? "rtl"
                    : "ltr";

            document.title =
                t.title;

            profileDescription.textContent =
                t.description;

            nameLabel.textContent =
                t.name;

            usernameLabel.textContent =
                t.username;

            enterNovy.textContent =
                t.enter + " ←";

            logoutButton.textContent =
                t.logout;

            avatarHint.textContent =
                t.avatarHint;

            avatarUploadLabel.title =
                t.changeAvatar;

            updateWelcome();

        }


        function updateWelcome() {

            const t =
                translations[currentLanguage];

            const name =
                profileName.textContent.trim();

            if (!name || name === "-") {

                welcomeTitle.textContent =
                    t.welcomeDefault;

                return;
            }

            welcomeTitle.textContent =
                t.welcome.replace(
                    "{name}",
                    name
                );
        }


        /* =========================================================
           LOAD THEME + LANGUAGE
        ========================================================= */

        const savedTheme =
            localStorage.getItem("novy-theme") || "navy";

        setTheme(savedTheme);

        applyLanguage(currentLanguage);


        /* =========================================================
           HELPERS
        ========================================================= */

        function getInitial(name) {

            if (!name || !name.trim()) {
                return "N";
            }

            return name
                .trim()
                .charAt(0)
                .toUpperCase();
        }


        function showAvatarImage(url) {

            profileAvatar.innerHTML = "";

            const image =
                document.createElement("img");

            image.src = url;

            image.alt = "Profile photo";

            profileAvatar.appendChild(image);
        }


        function showAvatarInitial(name) {

            profileAvatar.innerHTML = "";

            profileAvatar.textContent =
                getInitial(name);
        }


        function showUploadStatus(message) {

            uploadStatus.textContent =
                message;
        }


        /* =========================================================
           LOAD PROFILE
        ========================================================= */

        async function loadProfile() {

            const {
                data: {
                    session
                },
                error: sessionError
            } =
                await supabaseClient.auth.getSession();


            if (
                sessionError ||
                !session ||
                !session.user
            ) {

                window.location.href =
                    "login.html";

                return;
            }


            const user =
                session.user;

            const metadata =
                user.user_metadata || {};


            const name =
                metadata.name ||
                localStorage.getItem("novyName") ||
                "";


            const username =
                metadata.username ||
                localStorage.getItem("novyUsername") ||
                "";


            profileName.textContent =
                name || "-";


            profileUsername.textContent =
                username || "-";


            if (name) {

                localStorage.setItem(
                    "novyName",
                    name
                );

            }


            if (username) {

                localStorage.setItem(
                    "novyUsername",
                    username
                );

            }


            updateWelcome();


            /*
             * avatar_url is stored inside
             * Supabase user metadata.
             */

            const avatarUrl =
                metadata.avatar_url;


            if (avatarUrl) {

                showAvatarImage(
                    avatarUrl
                );

            } else {

                showAvatarInitial(
                    name
                );

            }

        }


        /* =========================================================
           AVATAR UPLOAD
        ========================================================= */

        avatarInput.addEventListener(
            "change",
            async function () {

                const file =
                    avatarInput.files[0];


                if (!file) {
                    return;
                }


                const t =
                    translations[currentLanguage];


                /* File type */

                const allowedTypes = [
                    "image/jpeg",
                    "image/png",
                    "image/webp"
                ];


                if (
                    !allowedTypes.includes(
                        file.type
                    )
                ) {

                    showUploadStatus(
                        t.invalidImage
                    );

                    avatarInput.value = "";

                    return;
                }


                /* File size */

                if (
                    file.size >
                    5 * 1024 * 1024
                ) {

                    showUploadStatus(
                        t.tooLarge
                    );

                    avatarInput.value = "";

                    return;
                }


                showUploadStatus(
                    t.uploading
                );


                try {

                    const {
                        data: {
                            user
                        },
                        error: userError
                    } =
                        await supabaseClient.auth.getUser();


                    if (
                        userError ||
                        !user
                    ) {

                        window.location.href =
                            "login.html";

                        return;
                    }


                    /*
                     * Keep one avatar per user.
                     * The file name stays the same,
                     * so uploading a new one replaces
                     * the previous avatar.
                     */

                    const extension =
                        file.type === "image/png"
                            ? "png"
                            : file.type === "image/webp"
                                ? "webp"
                                : "jpg";


                    const filePath =
                        `${user.id}/avatar.${extension}`;


                    /*
                     * Remove possible old formats.
                     */

                    const oldFiles = [
                        `${user.id}/avatar.jpg`,
                        `${user.id}/avatar.png`,
                        `${user.id}/avatar.webp`
                    ];


                    await supabaseClient
                        .storage
                        .from("avatars")
                        .remove(oldFiles);


                    /*
                     * Upload new image.
                     */

                    const {
                        error: uploadError
                    } =
                        await supabaseClient
                            .storage
                            .from("avatars")
                            .upload(
                                filePath,
                                file,
                                {
                                    upsert: true,
                                    cacheControl: "3600",
                                    contentType: file.type
                                }
                            );


                    if (uploadError) {

                        console.error(
                            uploadError
                        );

                        showUploadStatus(
                            t.uploadError
                        );

                        return;
                    }


                    /*
                     * Get public URL.
                     */

                    const {
                        data: publicUrlData
                    } =
                        supabaseClient
                            .storage
                            .from("avatars")
                            .getPublicUrl(
                                filePath
                            );


                    const avatarUrl =
                        publicUrlData.publicUrl +
                        "?v=" +
                        Date.now();


                    /*
                     * Save URL to user metadata.
                     */

                    const {
                        error: updateError
                    } =
                        await supabaseClient.auth.updateUser(
                            {
                                data: {
                                    avatar_url:
                                        avatarUrl
                                }
                            }
                        );


                    if (updateError) {

                        console.error(
                            updateError
                        );

                        showUploadStatus(
                            t.uploadError
                        );

                        return;
                    }


                    showAvatarImage(
                        avatarUrl
                    );


                    showUploadStatus(
                        t.uploaded
                    );


                } catch (error) {

                    console.error(
                        error
                    );

                    showUploadStatus(
                        t.uploadError
                    );

                } finally {

                    avatarInput.value = "";

                }

            }
        );


        /* =========================================================
           ENTER NOVY
        ========================================================= */

        enterNovy.addEventListener(
            "click",
            function () {

                window.location.href =
                    "chat.html";

            }
        );


        /* =========================================================
           LOGOUT
        ========================================================= */

        logoutButton.addEventListener(
            "click",
            async function () {

                await supabaseClient.auth.signOut();

                localStorage.removeItem(
                    "novyLoggedIn"
                );

                localStorage.removeItem(
                    "novyContact"
                );

                localStorage.removeItem(
                    "novyUsername"
                );

                localStorage.removeItem(
                    "novyName"
                );

                /*
                 * Theme and language are NOT removed.
                 * This means user's preferences survive logout.
                 */

                window.location.href =
                    "login.html";

            }
        );


        /* =========================================================
           START
        ========================================================= */

        loadProfile();

    </script>

</body>

</html>
